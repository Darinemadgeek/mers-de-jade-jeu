    ctx.globalAlpha = 1;
    this.fx.draw(ctx, cam, 0, 'sky');
    // la scène (sans le ciel) sur un calque, puis teinte selon l'heure
    sx.clearRect(0, 0, W, H);
    sx.drawImage(this.far, -cam * 0.2, gy - 18 - this.far.lh, this.far.lw, this.far.lh);
    sx.drawImage(this.mid, -cam * 0.5, gy - 6 - this.mid.lh, this.mid.lw, this.mid.lh);
    // eau du port derrière le quai
    const qx = st.quai.x - cam;
    if (qx < W) {
      const HB = SEA.palette.harbor;
      sx.fillStyle = Gfx.lin(sx, 0, gy - 17, 0, gy, [[0, mixHex(HB.sea4, tod.bot, 0.35)], [1, HB.sea2]]);
      sx.fillRect(qx, gy - 17, W - qx + 1, 17);
      sx.strokeStyle = rgba('#dff3f4', 0.5); sx.lineWidth = 0.4;
      sx.beginPath();
      for (let i = 0; i < 14; i++) { const wx = qx + ((i * 37 + t * 6) % Math.max(1, W - qx + 30)); const wyy = gy - 14 + (i % 4) * 3; sx.moveTo(wx, wyy); sx.lineTo(wx + 3.5, wyy); }
      sx.stroke();
      // voiles au loin : jonques, ou voiles latines selon la mer
      const lateen = SEA.portScene && SEA.portScene.farBoats === 'lateen';
      for (let i = 0; i < 3; i++) {
        const jx = qx + 150 + i * 70 - (t * 3 % 40);
        sx.fillStyle = mixHex('#3c5470', tod.bot, 0.3);
        sx.beginPath(); sx.moveTo(jx - 1, gy - 18); sx.lineTo(jx + 11, gy - 18); sx.lineTo(jx + 9, gy - 16); sx.lineTo(jx + 1, gy - 16); sx.closePath(); sx.fill();
        sx.beginPath();
        if (lateen) { sx.moveTo(jx + 1.5, gy - 18.5); sx.lineTo(jx + 11.5, gy - 30); sx.quadraticCurveTo(jx + 9.5, gy - 22, jx + 8.5, gy - 18.5); }
        else { sx.moveTo(jx + 5, gy - 18.5); sx.lineTo(jx + 5.4, gy - 27); sx.quadraticCurveTo(jx + 1.5, gy - 24, jx + 1.2, gy - 19); }
        sx.closePath(); sx.fill();
      }
      // navire du joueur à quai
      const r = Game.run;
      if (r.ship) {
        const S = SHIPS[r.ship.type];
        const side = ShipSide.get(S.style, S.len * 3, Game.playerScheme(), Game.sailScheme(), Math.min(Main.S, 5));
        const bob = Math.sin(t * 1.4) * 0.8;
        sx.drawImage(side.c, st.quai.x + 70 - cam - side.x0, gy - 4 - side.wl + bob, side.W, side.H);
      }
    }
    const vw = Math.min(W, st.len - cam);
    if (vw > 0) sx.drawImage(this.street, cam * ks, 0, vw * ks, SH * ks, 0, gy - GY, vw, SH);
    // lanternes de la mi-automne
    if (this.lanternsFest) {
      sx.strokeStyle = 'rgba(40,30,30,0.6)'; sx.lineWidth = 0.3;
      sx.beginPath(); for (let x = -(cam % 24) - 24; x < W + 24; x += 2) { const yy = gy - 66 + Math.sin((x + cam) * 0.13) * 1.6; if (x < -((cam % 24)) - 23) sx.moveTo(x, yy); else sx.lineTo(x, yy); } sx.stroke();
      for (let x = -(cam % 24); x < W; x += 24) { const c = Math.round((x + cam) / 24) % 2 ? '#e0402a' : '#e0b040'; const yy = gy - 64 + Math.sin((x + cam) * 0.13) * 1.6; sx.fillStyle = c; Gfx.ellipse(sx, x, yy + 1.6, 1.8, 2.2); sx.fill(); }
    }
    // chaussée pavée
    const pv = gy, pvH = 12;
    sx.fillStyle = Gfx.lin(sx, 0, pv, 0, pv + pvH, [[0, '#a8a194'], [1, '#8e877a']]);
    sx.fillRect(0, pv, W, pvH);
    sx.strokeStyle = 'rgba(70,64,56,0.45)'; sx.lineWidth = 0.35;
    sx.beginPath();
    for (let row = 0; row < 3; row++) {
      const yy = pv + 4 * row, off = row % 2 ? 4.5 : 0;
      sx.moveTo(0, yy + 4); sx.lineTo(W, yy + 4);
      for (let x = -((cam + off) % 9); x < W; x += 9) { sx.moveTo(x, yy); sx.lineTo(x, yy + 4); }
    }
    sx.stroke();
    sx.fillStyle = 'rgba(255,255,255,0.22)'; sx.fillRect(0, pv, W, 0.6);
    // ponton
    if (qx < W) {
      const px0 = Math.max(0, qx);
      sx.fillStyle = Gfx.lin(sx, 0, pv, 0, pv + pvH, [[0, '#9a7650'], [1, '#76583a']]);
      sx.fillRect(px0, pv, W - px0, pvH);
      sx.strokeStyle = 'rgba(58,40,24,0.55)'; sx.lineWidth = 0.35;
      sx.beginPath(); for (let x = qx + ((-qx) % 6 + 6) % 6; x < W; x += 6) { sx.moveTo(x, pv); sx.lineTo(x, pv + pvH); } sx.stroke();
      sx.fillStyle = '#4a3420'; for (let x = qx + 4; x < W; x += 18) sx.fillRect(x, pv + pvH, 2.4, 22);
      sx.fillStyle = '#34343a'; for (let x = qx + 10; x < W; x += 40) { Gfx.rr(sx, x, pv - 4, 3, 4.4, 1); sx.fill(); }
    }
    // bord du quai
    sx.fillStyle = Gfx.lin(sx, 0, pv + pvH, 0, pv + pvH + 6, [[0, '#7c766a'], [1, '#5c574d']]);
    sx.fillRect(0, pv + pvH, Math.max(0, qx), 6);
    sx.strokeStyle = 'rgba(40,36,30,0.5)'; sx.lineWidth = 0.35;
    sx.beginPath(); for (let x = -(cam % 10); x < Math.min(W, qx); x += 10) { sx.moveTo(x, pv + pvH); sx.lineTo(x, pv + pvH + 6); } sx.stroke();
    // eau au premier plan : reflets de la rue ondulés
    const wy = pv + pvH + 6;
    const HB = SEA.palette.harbor;
    sx.fillStyle = Gfx.lin(sx, 0, wy, 0, H, [[0, tod.dark > 0.4 ? HB.night[0] : mixHex(HB.sea3, tod.bot, 0.25)], [1, tod.dark > 0.4 ? HB.night[1] : HB.sea1]]);
    sx.fillRect(0, wy, W, H - wy);
    sx.globalAlpha = 0.3;
    for (let i = 0; i < H - wy; i += 0.5) {
      const srcY = GY - 2 - i * 1.6;
      if (srcY < 0) break;
      const off = Math.sin(i * 0.9 + t * 2.2) * (0.8 + i * 0.06);
      if (vw > 0) sx.drawImage(this.street, U.clamp((cam + off) * ks, 0, this.street.width - 1), srcY * ks, vw * ks, 0.8 * ks, 0, wy + i, vw, 0.52);
    }
    sx.globalAlpha = 1;
    sx.strokeStyle = 'rgba(200,236,244,0.55)'; sx.lineWidth = 0.45; sx.lineCap = 'round';
    sx.beginPath();
    for (let i = 0; i < 26; i++) {
      const hx = hash2(i, 3, 1) * (W + 40) - ((t * 8 + cam * 1.1) % 40), hy = wy + 3 + hash2(i, 5, 2) * (H - wy - 4);
      if (Math.sin(t * 2 + i) > 0.2) { sx.moveTo(hx, hy); sx.lineTo(hx + 3 + (i % 3), hy); }
    }
    sx.stroke();
    // barques
    for (const b of this.boats) {
      const bx = b.x - cam * 1.12, by = wy + 10 + Math.sin(t * 1.3 + b.ph) * 1.2;
      if (bx < -40 || bx > W + 10) continue;
      sx.fillStyle = 'rgba(8,20,36,0.3)'; Gfx.ellipse(sx, bx + 13, by + 5.5, 15, 1.4); sx.fill();
      sx.fillStyle = Gfx.lin(sx, 0, by - 1, 0, by + 5, [[0, shade(b.c, 1.2)], [1, shade(b.c, 0.75)]]);
      sx.beginPath(); sx.moveTo(bx - 3, by - 1.5); sx.quadraticCurveTo(bx + 2, by + 5.2, bx + 13, by + 5.2); sx.quadraticCurveTo(bx + 24, by + 5.2, bx + 29, by - 2.4); sx.lineTo(bx + 26, by); sx.lineTo(bx, by); sx.closePath(); sx.fill();
      sx.beginPath(); sx.moveTo(bx + 7, by); sx.quadraticCurveTo(bx + 13, by - 8, bx + 20, by); sx.closePath();
      sx.fillStyle = Gfx.lin(sx, 0, by - 6, 0, by, [[0, '#d0b27a'], [1, '#a88a58']]); sx.fill();
      sx.strokeStyle = 'rgba(110,84,48,0.7)'; sx.lineWidth = 0.3; sx.beginPath(); for (let k = 9; k < 20; k += 2.2) { sx.moveTo(bx + k, by); sx.lineTo(bx + k + 0.4, by - 5); } sx.stroke();
      People.draw(sx, (SEA.portScene && SEA.portScene.boatman) || { hat: 'cone', top: '#2a2a33', bottom: '#2a2a33', skin: PAL.skin[2] }, bx + 23, by + 0.5, -1, 0, false, 1);
      sx.strokeStyle = '#4a3420'; sx.lineWidth = 0.5; sx.beginPath(); sx.moveTo(bx + 25, by - 14); sx.lineTo(bx + 27, by + 4); sx.stroke();
    }
    // personnages (triés par profondeur)
    const people = this.npcs.map(n => ({ n, y: n.d })).concat([{ cap: true, y: 5 }]).sort((a, b) => a.y - b.y);
    for (const p of people) {
      if (p.cap) {
        const c = this.cap;
        People.draw(sx, this.capSpr, c.x - cam, pv + 8, c.dir, c.f, c.moving);
      } else {
        const n = p.n, x = n.x - cam;
        if (x < -30 || x > W + 30) continue;
        People.draw(sx, n.spr, x, pv + 8 + n.d * 0.8, n.dir, n.f, !(n.pause > 0 || n.still));
      }
    }
    this.fx.draw(sx, cam, 0, 'world');
    // teinte de l'heure
    if (tod.dark > 0.02 || this.weather === 'rain') {
      sx.globalCompositeOperation = 'source-atop';
      sx.fillStyle = `rgba(14,22,66,${(tod.dark + (this.weather === 'rain' ? 0.16 : 0)).toFixed(3)})`;
      sx.fillRect(0, 0, W, H);
      if (tod.dark > 0.15 && tod.dark < 0.35) { sx.fillStyle = 'rgba(255,120,60,0.09)'; sx.fillRect(0, 0, W, H); }
      sx.globalCompositeOperation = 'source-over';
    }
    // lumières du soir
    if (tod.dark > 0.2) {
      const oy = gy - GY, la = Math.min(1, tod.dark * 1.3);
      for (const l of st.lights) {
        const lx = l.x - cam;
        if (lx < -30 || lx > W + 30 || !l.on || l.kind !== 'win') continue;
        sx.fillStyle = Gfx.lin(sx, 0, l.wy + oy, 0, l.wy + oy + l.h, [[0, l.warm ? '#ffd27a' : '#ffe3a0'], [1, l.warm ? '#f0a040' : '#e8b060']]);
        Gfx.rr(sx, l.wx - cam, l.wy + oy, l.w, l.h, 0.4); sx.fill();
      }
      for (const m of this.midLights) {
        const mxp = m.x - cam * 0.5, myp = gy - 6 - this.mid.lh + m.y;
        if (mxp < -10 || mxp > W + 10) continue;
        Gfx.glow(sx, mxp, myp, 2.2, '#ffc978', la * 0.8);
      }
      for (const l of st.lights) {
        const lx = l.x - cam;
        if (lx < -30 || lx > W + 30 || !l.on) continue;
        const s = l.kind === 'lantern' ? 13 : 11;
        Gfx.glow(sx, lx, l.y + oy, s, l.kind === 'lantern' ? '#ffac5a' : '#ffcf80', la * 0.85);
        if (l.kind === 'lantern') {
          sx.save(); sx.globalAlpha = la * 0.5; sx.globalCompositeOperation = 'lighter';
          sx.drawImage(Gfx.soft('#ffac5a'), lx - 3, wy + 3 + (l.x * 7) % 10, 6, 16);
          sx.restore();
        }
      }
    }
    ctx.drawImage(this.scene, 0, 0, W, H);
  },
  // textes nets par-dessus (enseignes, nom du navire)
  overlay(sctx, S) {
    const cam = this.cam, gy = this.groundY, oy = gy - GY;
    for (const s of this.st.signs) {
      const x = (s.x - cam) * S, y = (s.y + oy) * S;
      if (x < -200 || x > sctx.canvas.width + 200) continue;
      const name = ((this.P.signs && this.P.signs[s.it.type]) || BUILDINGS[s.it.type].name).toUpperCase();   // enseigne propre au port, sinon nom du bâtiment
      let size = Math.max(9, Math.round(S * 3.3));
      const fit = () => { sctx.font = `800 ${size}px ${FONT_TITLE}`; if ('letterSpacing' in sctx) sctx.letterSpacing = (size * 0.08).toFixed(1) + 'px'; return sctx.measureText(name).width; };
      while (size > 7 && fit() > (s.w - 3) * S) size--;
      Gfx.text(sctx, name, x, y + size * 0.06, { size, align: 'center', base: 'middle', color: s.dark ? '#f2cf7a' : '#3a2a22', outline: false, weight: 800, font: 'title', spacing: size * 0.08 });
    }
    const r = Game.run;
    if (r.ship) {
      const qx = (this.st.quai.x + 70 - cam) * S;
      if (qx > -300 && qx < sctx.canvas.width + 300) Gfx.text(sctx, r.shipName, qx + 60 * S / 2, (gy + 30) * S, { size: Math.round(S * 3.6), align: 'center', color: '#f6efe0', font: 'title', weight: 700 });
    }
  },
};

// ════════════════════════════════════════════════════════════════════
//  Écran titre : décor propre à chaque mer (voir titleScene dans js/seas/)
// ════════════════════════════════════════════════════════════════════
const TitleScene = {
  t: 0, W: 0, H: 0, fx: new Particles(300),
  enter() { this.t = 0; this.W = 0; },
  // le décor est dessiné par la mer en cours (SEA.titleScene), avec TitleScene pour « this »
  layout(W, H) {
    const S = Main.S;
    if (this.W === W && this.H === H && this.layS === S && this.laySea === SEA) return;
    this.W = W; this.H = H; this.layS = S; this.laySea = SEA;
    SEA.titleScene.layout.call(this, W, H, S);
  },
  update(dt) {
    this.t += dt;
    if (R.chance(dt * 0.6)) this.fx.add({ x: -10, y: R.range(20, this.hz * 0.5), vx: R.range(14, 22), vy: 0, life: 40, color: '#2a1a2a', fade: false, layer: 'bird', size: 1, ph: R.range(0, TAU) });
    this.fx.update(dt);
  },
  draw(ctx, W, H) {
    this.layout(W, H);
    SEA.titleScene.draw.call(this, ctx, W, H);
  },
};

</script>
<script>
'use strict';
// ─── Mers de Jade · la mer : navigation, combats, tempêtes, butin ───

const SAIL_LABELS = ['Voiles ferlées', 'Mi-voile', 'Toute voile'];

class Vessel {
  constructor(o) {
    Object.assign(this, {
      x: 0, y: 0, a: 0, v: 0, sail: 2, turnIn: 0, rl: 0, rr: 0, flash: 0,
      dead: false, sinkT: 0, surrendered: false, ex: 0, ey: 0, boardCd: 4, t: 0,
      hostile: false, ai: 'hunt', react: 0, far: 0, gold: 0, cargo: null, label: null,
    }, o);
    this.r = this.len * 0.36;
    this.hullMax = this.hullMax || this.hull;
  }
}

function polar(rel) {
  return rel < 0.8 ? 0.84 + 0.16 * rel / 0.8 : rel < 1.9 ? 1 : 1 - 0.7 * (rel - 1.9) / (Math.PI - 1.9);
}

const SeaScene = {
  ships: [], balls: [], pending: [], loot: [], storms: [], texts: [],
  fx: new Particles(2600),
  player: null, camX: 0, camY: 0, shake: 0, t: 0, vt: 12,
  dest: null, path: null, wp: 0, auto: true, fast: false,
  spawnT: 2, voyageT: 0, combat: false, calmT: 0, flashT: 0,
  spawnedNamed: {}, stormHit: 0, inEye: false, prompt: null, over: false,
  W: 480, H: 270,

  enter(dest) {
    const r = Game.run, st = Game.stats();
    const from = World.ports.find(p => p.id === r.lastPort) || World.ports[0];
    this.ships = []; this.balls = []; this.pending = []; this.loot = []; this.storms = []; this.texts = [];
    this.fx.list.length = 0;
    this.t = 0; this.voyageT = 0; this.combat = false; this.calmT = 0; this.shake = 0; this.over = false;
    this.spawnedNamed = {}; this.spawnT = 3; this.inEye = false; this.stormWasIn = false; this.escapeWatch = 0;
    this.starved = 0; this.starveT = 0; this.wangSent = false; this.grounded = 0;
    this.critters = []; this.rings = [];
    this.capturedBy = null; this.shutWarned = null;
    this.vt = hourOf(r.day);
    const [gx, gy] = World.grad(from.x, from.y);
    this.player = new Vessel({
      kind: 'player', style: st.style, len: st.len, scheme: Game.playerScheme(), name: r.shipName,
      x: from.x + gx * 6, y: from.y + gy * 6, a: Math.atan2(gy, gx), v: 0, sail: 1,
      hull: r.ship.hull, hullMax: st.hullMax, guns: r.ship.cannons, crew: r.ship.crew, oars: st.oars, stormMul: st.stormMul,
      speedMax: st.speed, turn: st.turn, reload: st.reload, dmg: st.dmg, range: st.range,
    });
    this.ships.push(this.player);
    this.camX = this.player.x - this.W / 2; this.camY = this.player.y - this.H / 2;
    this.setDest(dest);
    World.warm(this.player.x, this.player.y, 360);
    // tempêtes de la saison
    const m = monthOf(r.day), p = TYPHOON_SEASON[m];
    if (this.path && R.chance(p)) this.spawnStorm(true);
    if (R.chance(0.25)) this.spawnStorm(false);
    // quelques marchands
    for (let i = 0; i < 2; i++) if (R.chance(0.6)) this.spawnMerchant(true);
    Sound.play('sea');
    Sound.ambient('sea', 0.16);
  },
  setDest(pid) {
    this.dest = pid;
    const p = this.player;
    const port = World.ports.find(q => q.id === pid);
    this.path = port ? World.findPath(p.x, p.y, port.x, port.y) : null;
    this.wp = 1;
    this.auto = !!this.path;
    if (this.path) p.sail = 2;
  },

  // ── Apparitions ──
  freeSpot(ang, d0, d1) {
    const p = this.player;
    for (let i = 0; i < 16; i++) {
      const a = ang + R.range(-1.3, 1.3), d = R.range(d0, d1);
      const x = p.x + Math.cos(a) * d, y = p.y + Math.sin(a) * d;
      if (World.inBounds(x, y, 40) && World.sdf(x, y) > 22) return [x, y];
    }
    return null;
  },
  makeEnemy(typeKey, x, y, o) {
    const T = PIRATE_TYPES[typeKey], r = Game.run;
    const grow = 1 + r.day / 365 * 0.55;
    const hull = Math.round(T.hull * grow * ((o && o.hullMul) || 1));
    const cargo = zeros();
    for (let k = 0; k < 3; k++) cargo[R.int(0, GOODS.length - 1)] += Math.round(T.cargo / 3 * R.range(0.5, 1.2));
    const v = new Vessel(Object.assign({
      kind: 'pirate', style: T.style, len: T.len, scheme: T.sail, name: T.name,
      x, y, a: R.range(-Math.PI, Math.PI), v: T.speed * 0.5, sail: 2,
      hull, hullMax: hull, guns: Math.round(T.guns * ((o && o.gunsMul) || 1)), crew: Math.round(T.crew * R.range(0.85, 1.15) * ((o && o.hullMul) ? 1.3 : 1)),
      speedMax: T.speed * R.range(0.94, 1.02), turn: T.turn, boarder: !!T.boarder, reload: 3.5 - T.tier * 0.12, dmg: 4.5 + T.tier * 0.8, range: 135 + T.tier * 6, spread: 0.075,
      gold: Math.round(R.int(T.gold[0], T.gold[1]) * (1 + r.day / 220)), cargo, hostile: true, tier: T.tier, oars: T.oars || 0,
    }, o || {}));
    return v;
  },
  spawnPirates(danger) {
    const r = Game.run, p = this.player;
    const tier = Game.stats().tier;
    const T = danger * 0.8 + r.day / 365 * 0.9 + (tier - 1) * 0.3;
    const groups = SEA.pirateGroups.find(x => T < x[0])[1];
    // la toute première rencontre de la partie : un petit pirate isolé, pour apprendre
    const first = r.stats.sunk === 0 && !r.flags.metPirates;
    const g = first ? SEA.firstPirate : R.pick(groups);
    r.flags.metPirates = true;
    if (first && Game.meta.runs < 2) setTimeout(() => Bus.emit('toast', { t: Input.touch
      ? 'Vos canons tirent sur les côtés : présentez votre flanc au pirate, puis appuyez sur FEU du bon côté.'
      : `Vos canons tirent sur les côtés : présentez votre flanc au pirate, puis ${Input.label('KeyQ')} (bâbord) ou ${Input.label('KeyE')} (tribord), ou cliquez de son côté.`, k: 'gold' }), 1800);
    const base = this.freeSpot(p.a, 330, 420);
    if (!base) return;
    for (let i = 0; i < g.length; i++) {
      const x = base[0] + R.range(-40, 40), y = base[1] + R.range(-40, 40);
      if (World.sdf(x, y) < 18) continue;
      const e = this.makeEnemy(g[i], x, y);
      e.a = Math.atan2(p.y - y, p.x - x);
      this.ships.push(e);
    }
    this.alert(g.length > 1 ? 'VOILES PIRATES !' : 'UN PIRATE !', g.length > 1 ? `${g.length} navires vous prennent en chasse` : PIRATE_TYPES[g[0]].name + ' en approche', 'red');
  },
  spawnNamed(np) {
    const r = Game.run, p = this.player;
    this.spawnedNamed[np.id] = true;
    const lx = lonX(np.lon), ly = latY(np.lat);
    let spot = null;
    for (let i = 0; i < 20 && !spot; i++) {
      const x = lx + R.range(-120, 120), y = ly + R.range(-120, 120);
      if (World.sdf(x, y) > 24 && Math.hypot(x - p.x, y - p.y) > 260) spot = [x, y];
    }
    if (!spot) spot = this.freeSpot(p.a, 320, 400);
    if (!spot) return;
    const boss = this.makeEnemy(np.type, spot[0], spot[1], { hullMul: np.hullMul, gunsMul: np.gunsMul || 1.3, named: np.id, name: np.name, label: np.name, scheme: np.scheme || PIRATE_TYPES[np.type].sail });
    boss.gold = Math.round(np.bounty * 0.4);
    boss.reload *= 0.85;
    boss.dmg *= np.dmgMul || 1.15;
    if (np.lenBonus) { boss.len += np.lenBonus; boss.r = boss.len * 0.36; }
    this.ships.push(boss);
    for (const e of np.escorts) {
      const x = spot[0] + R.range(-60, 60), y = spot[1] + R.range(-60, 60);
      if (World.sdf(x, y) > 18) this.ships.push(this.makeEnemy(e, x, y, np.escortScheme ? { scheme: np.escortScheme } : null));
    }
    this.alert(np.name.toUpperCase(), np.alert || 'Le pirate recherché est en vue !', 'red');
    Sound.sfxPlay('gong');
  },
  spawnMerchant(initial) {
    const p = this.player;
    const spot = initial ? this.freeSpot(R.range(-Math.PI, Math.PI), 200, 380) : this.freeSpot(p.a + Math.PI * R.range(0.5, 1.5), 340, 440);
    if (!spot) return;
    const M = SEA.merchants, style = R.pick(M.styles);
    const len = M.lens[style];
    const v = new Vessel({ kind: 'merchant', style, len, scheme: R.chance(M.navy) ? 'navy' : 'merchant', name: 'Marchand', x: spot[0], y: spot[1], a: R.range(-Math.PI, Math.PI), v: 30, sail: R.chance(0.7) ? 2 : 1, hull: 60, guns: 0, crew: 12, speedMax: R.range(40, 55), turn: 1.2, reload: 9, dmg: 0, range: 0, ai: 'cruise' });
    v.gold = R.int(100, 400);

  spawnWang() {
    const spot = this.freeSpot(this.player.a, 320, 400);

  spawnStorm(onRoute) {
    const p = this.player;
    let x, y;
    if (onRoute && this.path && this.path.length > 1) {
      const L = World.pathLength(this.path);
      let target = L * R.range(0.35, 0.7), acc = 0;
      for (let i = 1; i < this.path.length; i++) {
        const a = this.path[i - 1], b = this.path[i], seg = Math.hypot(b[0] - a[0], b[1] - a[1]);
        if (acc + seg >= target) { const k = (target - acc) / seg; x = a[0] + (b[0] - a[0]) * k; y = a[1] + (b[1] - a[1]) * k; break; }
        acc += seg;
      }
      if (x === undefined) { x = p.x + 600; y = p.y; }
      x += R.range(-120, 120); y += R.range(-120, 120);
    } else {
      const s = this.freeSpot(R.range(-Math.PI, Math.PI), 500, 800) || [p.x + 700, p.y];
      x = s[0]; y = s[1];
    }
    const big = onRoute, size = SEA.stormSize || 1, drift = SEA.stormSpeed || 1;   // une mer étroite (l'Adriatique…) a des coups de vent plus petits, et plus brefs
    const ang = R.range(Math.PI * 0.9, Math.PI * 1.25);
    this.storms.push({ x, y, r: (big ? R.range(150, 210) : R.range(80, 110)) * size, str: big ? R.range(0.8, 1.1) : 0.45, vx: Math.cos(ang) * R.range(8, 16) * drift, vy: Math.sin(ang) * R.range(8, 16) * drift, rot: R.range(0, TAU), big, warned: false });
    if (big && !this.stormSprite) this.stormSprite = this.makeStormSprite();
    if (!this.stormSprite) this.stormSprite = this.makeStormSprite();
  },
  // spirale de nuages du typhon (points doux superposés, œil dégagé)
  makeStormSprite() {
    const S = 512, [c, x] = makeCanvas(S, S), cx = S / 2;
    const rng = new RNG(9);
    for (let arm = 0; arm < 5; arm++) {
      for (let i = 0; i < 150; i++) {
        const t = i / 150, a = arm * TAU / 5 + t * 4.6 + rng.range(-0.08, 0.08), rr = 26 + t * (cx - 60);
        const px = cx + Math.cos(a) * rr, py = cx + Math.sin(a) * rr;
        const size = 16 + t * 52 + rng.range(-6, 6);
        x.globalAlpha = 0.1 + 0.12 * (1 - t);
        x.drawImage(Gfx.soft(i % 4 ? '#e6e9ef' : '#8f98ab'), px - size, py - size, size * 2, size * 2);
      }
    }
    x.globalAlpha = 0.5;
    x.drawImage(Gfx.soft('#c9ced9'), cx - 90, cx - 90, 180, 180);
    x.globalCompositeOperation = 'destination-out'; x.globalAlpha = 1;
    x.drawImage(Gfx.soft('#000000', 1), cx - 34, cx - 34, 68, 68);
    return c;
  },

  // ── Combat ──
  fire(v, side) {
    const key = side < 0 ? 'rl' : 'rr';
    if (v[key] > 0 || v.guns <= 0 || v.dead || v.surrendered) return false;
    let n = Math.max(1, Math.ceil(v.guns / 2));
    if (v !== this.player) n = Math.min(n, 7);
    const dir = v.a + side * Math.PI / 2;
    for (let i = 0; i < n; i++) {
      const u = n === 1 ? 0 : (i / (n - 1) - 0.5) * v.len * 0.55;
      this.pending.push({ t: i * 0.075 + R.range(0, 0.03), v, u, dir });
    }
    let reload = v.reload;
    if (v.kind === 'player') {
      const need = Math.max(4, v.guns * 1.6);
      reload *= 1 + Math.max(0, 1 - v.crew / need) * 1.2;
    }
    v[key] = reload; v[key + 'Max'] = reload;
    return true;
  },
  spawnBall(s) {

    const d = s.dir + R.gauss() * (v.spread || 0.045), sp = 172;
    this.balls.push({ x: bx, y: by, vx: Math.cos(d) * sp + ca * v.v * 0.25, vy: Math.sin(d) * sp + sa * v.v * 0.25, life: v.range / sp * R.range(0.92, 1.06), t: 0, owner: v, dmg: v.dmg });
    for (let k = 0; k < 6; k++) this.fx.add({ x: bx, y: by, vx: Math.cos(d) * R.range(10, 34) + R.range(-8, 8), vy: Math.sin(d) * R.range(10, 34) + R.range(-8, 8), vz: R.range(4, 10), life: R.range(1, 1.9), colors: ['#ffffff', '#e4e4ea', '#b4b6c0'], alpha: 0.75, size: R.range(2.4, 4), grow: 3.2, drag: 1.5, soft: true, layer: 'smoke' });
    this.fx.add({ x: bx, y: by, vx: 0, vy: 0, life: 0.12, color: '#ffd27a', size: 5, glow: true, layer: 'smoke' });
    for (let k = 0; k < 3; k++) this.fx.add({ x: bx, y: by, vx: Math.cos(d + R.range(-0.3, 0.3)) * R.range(60, 110), vy: Math.sin(d + R.range(-0.3, 0.3)) * R.range(60, 110), life: R.range(0.12, 0.25), color: '#ffb347', size: 1.2, glow: true, drag: 6, layer: 'smoke' });
    const pan = U.clamp((bx - this.camX) / this.W * 2 - 1, -1, 1);

  hitShip(s, b) {
    const dmg = b.dmg * R.range(0.8, 1.2);

    if (s.crew > 1 && R.chance(0.28)) s.crew--;
    for (let k = 0; k < 8; k++) this.fx.add({ x: b.x, y: b.y, vx: R.range(-40, 40), vy: R.range(-40, 40), vz: R.range(20, 45), grav: 90, life: 1.2, color: R.pick(['#8a5a30', '#b07a48', '#5a3a22']), size: R.range(1, 1.8), layer: 'fx' });
    for (let k = 0; k < 4; k++) this.fx.add({ x: b.x, y: b.y, vx: R.range(-6, 6), vy: R.range(-6, 6), vz: 6, life: R.range(1.2, 2.2), colors: ['#5a5a62', '#8a8c96', '#c0c2ca'], alpha: 0.7, size: 3, grow: 3.5, soft: true, layer: 'smoke' });
    this.fx.add({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.18, color: '#ffc46a', size: 4, glow: true, layer: 'smoke' });

    }

  // coque à zéro sous les coups d'un ennemi : une mer peut faire saisir le navire du joueur plutôt que le couler (les corsaires barbaresques)

  sink(s, killer) {

    for (let k = 0; k < 12; k++) this.fx.add({ x: s.x + R.range(-4, 4), y: s.y + R.range(-4, 4), vx: R.range(-20, 20), vy: R.range(-20, 20), vz: 8, life: R.range(1.8, 3.4), colors: ['#2e2e36', '#5e5e68', '#9a9aa6'], alpha: 0.7, size: 4.5, grow: 4.5, soft: true, layer: 'smoke' });

  namedDown(s) {

  dropLoot(s, k) {
    const add = (type, extra) => this.loot.push(Object.assign({ x: s.x + R.range(-12, 12), y: s.y + R.range(-12, 12), type, t: 0, ph: R.range(0, TAU) }, extra));
    if (s.gold > 0) add('gold', { v: Math.round(s.gold * k) });
    if (s.cargo) {
      const idx = s.cargo.map((n, i) => [n, i]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, 3);
      for (const [n, gi] of idx) add('cargo', { g: gi, n: Math.max(1, Math.round(n * k)) });
    }
    if (s.kind === 'pirate' && (s.tier || 1) >= 2 && R.chance(0.07) && !Game.run.treasures.some(t => !t.found)) add('map');
    if (R.chance(0.05)) add('bottle');

  playerSunk() {

  // abordage par les pirates
  enemyBoards(e) {
    const p = this.player, r = Game.run, st = Game.stats();
    e.boardCd = 12;
    const P = Math.max(1, p.crew) * st.board * R.range(0.85, 1.2), E = e.crew * R.range(0.85, 1.2);
    Sound.sfxPlay('swords'); Sound.sfxPlay('shout', { vol: 0.6 });
    if (E > P) {
      if (SEA.rules && SEA.rules.captured && SEA.rules.captured(e, P, E)) return;   // corsaires : capture et rançon
      const stolen = Math.round(r.cash * R.range(0.3, 0.5));
      r.cash -= stolen;
      let space = Math.round(e.len * 1.5), taken = [];
      const order = r.cargo.map((n, i) => [GOODS[i].base, i]).sort((a, b) => b[0] - a[0]);
      for (const [, gi] of order) {
        if (space <= 0) break;
        const n = Math.min(r.cargo[gi], space);
        if (n > 0) { r.cargo[gi] -= n; space -= n; taken.push(`${n} ${GOODS[gi].name.toLowerCase()}`); }
      }
      const lost = Math.min(p.crew - 1, Math.max(1, Math.round(p.crew * R.range(0.25, 0.4))));
      p.crew -= lost; r.ship.crew = p.crew;
      e.crew = Math.max(1, Math.round(e.crew * 0.8));
      e.ai = 'flee'; e.sated = true;
      this.alert('ABORDÉS !', `Les pirates emportent ${fmt(stolen)} ${TXT.money}${taken.length ? ' et ' + taken.join(', ') : ''}. ${lost} marins perdus.`, 'red');
      Game.log(`Abordé par des pirates : ${fmt(stolen)} ${TXT.money} volés.`);
      this.shake = 6;
    } else {
      const lost = Math.min(p.crew - 1, Math.max(0, Math.round(e.crew * 0.2 * R.range(0.5, 1))));
      p.crew -= lost; r.ship.crew = p.crew;
      e.crew = Math.max(1, Math.round(e.crew * 0.35));
      this.surrender(e);
      this.alert('ABORDAGE REPOUSSÉ !', `L'ennemi se rend. ${lost} marins perdus.`, 'jade');
    }
  },
  // abordage par le joueur (résolu par l'interface)
  boardTarget() {
    const p = this.player;
    let best = null, bd = 1e9;
    for (const s of this.ships) {
      if (s === p || s.dead || s.kind === 'merchant') continue;
      if (!(s.surrendered || s.hull < s.hullMax * 0.45)) continue;
      const d = Math.hypot(s.x - p.x, s.y - p.y) - s.r - p.r;
      if (d < 14 && d < bd) { bd = d; best = s; }
    }
    return best;
  },
  resolveBoarding(e) {
    const p = this.player, st = Game.stats();
    const P = Math.max(1, p.crew) * st.board * R.range(0.85, 1.25), E = e.crew * (e.surrendered ? 0.3 : 1) * R.range(0.85, 1.15);
    const win = P >= E;
    let lost;
    if (win) lost = Math.min(p.crew - 1, Math.round(E * 0.28 * R.range(0.6, 1)));
    else lost = Math.min(p.crew - 1, Math.round(p.crew * R.range(0.3, 0.5)));
    lost = Math.max(0, lost);
    return { win, lost, P, E };
  },
  applyBoarding(e, res) {
    const p = this.player, r = Game.run;
    p.crew -= res.lost; r.ship.crew = p.crew;
    if (res.win) {
      e.dead = true; e.captured = true; e.sinkT = 0;
      r.stats.boarded++; Game.unlock('abordage');
      if (e.kind !== 'merchant') { r.stats.sunk++; Game.onPirateSunk(); }
      if (e.named) this.namedDown(e);
    } else {
      e.boardCd = 8;
      this.alert('ABORDAGE REPOUSSÉ', `${res.lost} marins perdus. Reprenez le large !`, 'red');
    }
  },

  alert(title, sub, kind) { Bus.emit('banner', { title, sub, kind }); },
  float(x, y, t, color) { this.texts.push({ x, y, t, color, life: 1.4, age: 0 }); },
  // onde circulaire à la surface (éclaboussures, naufrages)
  ring(x, y, r0, r1, life, a) { if (this.rings.length < 60) this.rings.push({ x, y, r0, r1, life, a: a || 0.6, t: 0 }); },

  // ── Mise à jour ──
  update(dt) {
    if (this.over) { this.updateFx(dt); return; }
    this.handleInput();
    const steps = this.fast && !this.combat && !this.inStorm() ? 3 : 1;
    for (let i = 0; i < steps && !this.over; i++) this.sim(dt);
    this.updateFx(dt);
  },
  // actions ponctuelles : lues une seule fois par image, même en temps accéléré
  handleInput() {
    const p = this.player;
    if (this.over || !p) return;
    if (Input.hit('up')) p.sail = Math.min(2, p.sail + 1);
    if (Input.hit('down')) p.sail = Math.max(0, p.sail - 1);
    if (Input.hit('auto')) this.toggleAuto();
    if (Input.hit('fast')) this.fast = !this.fast;
    if (Input.hit('fireL')) this.fire(p, -1);
    if (Input.hit('fireR')) this.fire(p, 1);
    if (Input.hit('fire')) this.smartFire();
    const pt = Input.pointer;
    if (pt.clicked && !Input.blocked && !Main.fadeDir && pt.type === 'mouse' && Main.bufPoint) {
      const bp = Main.bufPoint(pt.x, pt.y);
      const wx = bp.x + this.camX, wy = bp.y + this.camY;
      const cross = Math.cos(p.a) * (wy - p.y) - Math.sin(p.a) * (wx - p.x);
      this.fire(p, cross < 0 ? -1 : 1);
    }
    if (Input.hit('board')) { const t = this.boardTarget(); if (t) Bus.emit('board', t); }
    if (Input.hit('dock') && this.prompt && this.prompt.kind === 'dock') this.dock(this.prompt.pid);
    else if (Input.hit('dock') && this.prompt && this.prompt.kind === 'dig') this.dig(this.prompt.tr);
  },
  inStorm() { const p = this.player; return this.storms.some(s => Math.hypot(s.x - p.x, s.y - p.y) < s.r + 40); },
  updateFx(dt) {
    this.fx.update(dt);
    for (const tx of this.texts) tx.age += dt;
    this.texts = this.texts.filter(t => t.age < t.life);
    for (const rg of this.rings) rg.t += dt;
    this.rings = this.rings.filter(rg => rg.t < rg.life);
    this.shake = Math.max(0, this.shake - dt * 12);
    this.flashT = Math.max(0, this.flashT - dt);
    // caméra
    const p = this.player;
    const tx = p.x + Math.cos(p.a) * p.v * 0.7 - this.W / 2, ty = p.y + Math.sin(p.a) * p.v * 0.7 - this.H / 2;
    this.camX += (tx - this.camX) * Math.min(1, dt * 3);
    this.camY += (ty - this.camY) * Math.min(1, dt * 3);
    this.camX = U.clamp(this.camX, 0, WORLD.W - this.W);
    this.camY = U.clamp(this.camY, 0, WORLD.H - this.H);
  },
  sim(dt) {
    const r = Game.run, p = this.player;
    this.t += dt; this.voyageT += dt;
    this.vt = (this.vt + dt * 24 / 150) % 24;
    // temps de calendrier (ralenti pendant les combats)
    const dd = dt * DAYS_PER_SEC * (this.combat ? 0.15 : 1);
    Game.advance(dd);
    // la solde impayée peut faire déserter des marins pendant le voyage
    if (r.ship) p.crew = Math.min(p.crew, r.ship.crew);
    const fdBefore = Game.foodDays();
    if (Game.consumeFood(p.rowing && SEA.rowEat ? dd * SEA.rowEat : dd)) {
      this.starveT = (this.starveT || 0) + dd;
      if (this.starveT > 3 && p.crew > 1) {
        this.starveT = 0; p.crew--; r.ship.crew = p.crew; this.starved = (this.starved || 0) + 1;
        if (this.starved === 1 || this.starved % 4 === 0) Bus.emit('toast', { t: 'Plus de vivres : la faim décime l\'équipage ! Accostez vite.', k: 'bad' });
      }
    } else if (fdBefore > 3 && Game.foodDays() <= 3) Bus.emit('toast', { t: 'Il ne reste que 3 jours de vivres.', k: 'bad' });
    if (Game.isYearOver()) { this.over = true; Bus.emit('year-over'); return; }
    // entrées du joueur
    let turn = 0;
    if (Input.down('left')) turn -= 1;
    if (Input.down('right')) turn += 1;
    if (turn && this.auto) { this.auto = false; }
    if (this.auto && this.path) {
      const w = this.path[Math.min(this.wp, this.path.length - 1)];
      if (Math.hypot(w[0] - p.x, w[1] - p.y) < 20 && this.wp < this.path.length - 1) this.wp++;
      const des = Math.atan2(w[1] - p.y, w[0] - p.x);
      turn = U.clamp(U.angDiff(p.a, des) * 2.4, -1, 1);
      const destP = World.ports.find(q => q.id === this.dest);
      if (destP && Math.hypot(destP.x - p.x, destP.y - p.y) < 70) p.sail = 1;
    }
    p.turnIn = turn;
    // vaisseaux
    const wind = World.wind(r.day, p.x, p.y);
    this.wind = wind;
    for (const s of this.ships) {
      if (s.dead) { s.sinkT += dt; continue; }
      s.t += dt;
      s.rl = Math.max(0, s.rl - dt); s.rr = Math.max(0, s.rr - dt);
      s.flash = Math.max(0, s.flash - dt);
      s.boardCd = Math.max(0, s.boardCd - dt);
      if (s !== p) this.think(s, dt);
      this.move(s, dt, s === p ? wind : World.wind(r.day, s.x, s.y));
    }
    this.ships = this.ships.filter(s => !(s.dead && s.sinkT > 4) && !(s !== p && Math.hypot(s.x - p.x, s.y - p.y) > 1100));
    // collisions entre navires
    for (let i = 0; i < this.ships.length; i++) for (let j = i + 1; j < this.ships.length; j++) {
      const a = this.ships[i], b = this.ships[j];
      if (a.dead || b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = (a.r + b.r) * 0.85;
      if (d < m && d > 0.01) {
        const push = (m - d) / 2, nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
        const rel = Math.hypot(Math.cos(a.a) * a.v - Math.cos(b.a) * b.v, Math.sin(a.a) * a.v - Math.sin(b.a) * b.v);
        if (rel > 34) {
          const dmg = rel * 0.08;
          a.hull -= dmg * b.len / a.len; b.hull -= dmg * a.len / b.len;
          a.v *= 0.5; b.v *= 0.5;
          Sound.sfxPlay('hit', { vol: 0.7 });
          if (a === p || b === p) this.shake = 5;
          if (a.hull <= 0) this.sinkOrSeize(a, b); if (b.hull <= 0) this.sinkOrSeize(b, a);
        }
        const other = a === p ? b : b === p ? a : null;
        if (other && other.hostile && !other.surrendered && !other.sated && other.boardCd <= 0 && other.crew >= p.crew * 0.9 && rel < 50) this.enemyBoards(other);
      }
    }
    // tirs programmés et boulets
    for (const s of this.pending) s.t -= dt;
    const due = this.pending.filter(s => s.t <= 0);
    this.pending = this.pending.filter(s => s.t > 0);
    for (const s of due) this.spawnBall(s);
    for (const b of this.balls) {
      b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.t > 0.06) {
        for (const s of this.ships) {
          if (s === b.owner || s.dead) continue;
          if (b.owner !== p && s !== p && s.kind !== 'merchant') continue; // les pirates ne se tirent pas dessus
          if (Math.hypot(s.x - b.x, s.y - b.y) < s.r * 1.15 + (b.owner === p ? 4 : 2)) { this.hitShip(s, b); b.hit = true; break; }
        }
      }
      if (!b.hit && b.t >= b.life) {
        b.hit = true;
        const land = World.sdf(b.x, b.y) < 0;
        for (let k = 0; k < (land ? 4 : 9); k++) this.fx.add({ x: b.x, y: b.y, vx: R.range(-14, 14), vy: R.range(-14, 14), vz: R.range(25, 60), grav: 120, life: 0.9, color: land ? '#a08a60' : R.pick(['#ffffff', '#dff3fb', '#b8e3f2']), size: R.range(0.9, 1.6), layer: 'fx' });
        if (!land) { this.fx.add({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.7, color: '#eef6f0', size: 2.5, grow: 5, alpha: 0.55, soft: true, layer: 'wake' }); this.ring(b.x, b.y, 1, 7, 0.9, 0.55); }
        if (Math.hypot(b.x - p.x, b.y - p.y) < 380) Sound.sfxPlay('splash', { pan: U.clamp((b.x - this.camX) / this.W * 2 - 1, -1, 1), vol: 0.5 });
      }
    }
    this.balls = this.balls.filter(b => !b.hit);
    // sillages : trace de la poupe (dessinée en rubans) et embruns d'étrave
    for (const s of this.ships) {
      if (!s.trail) s.trail = [];
      if (s.dead) continue;
      s.trailT = (s.trailT || 0) + dt;
      if (s.trailT > 0.08 && s.v > 3) {
        s.trailT = 0;
        s.trail.push({ x: s.x - Math.cos(s.a) * s.len * 0.46, y: s.y - Math.sin(s.a) * s.len * 0.46, a: s.a, v: s.v, t: this.t });
        if (s.trail.length > 44) s.trail.shift();
      }
      if (s.v < 8) continue;
      if (R.chance(dt * s.v * 0.28)) {
        const fx = s.x + Math.cos(s.a) * s.len * 0.5, fy = s.y + Math.sin(s.a) * s.len * 0.5, side = R.chance(0.5) ? 1 : -1;
        this.fx.add({ x: fx, y: fy, vx: Math.cos(s.a + side * 2.2) * 14, vy: Math.sin(s.a + side * 2.2) * 14, life: 0.9, color: '#ffffff', alpha: 0.7, size: 1.6, grow: 2, soft: true, layer: 'wake' });
      }
    }
    this.updateLoot(dt);
    this.updateStorms(dt);
    this.spawnCheck(dt);
    this.updateCritters(dt);
    // état de combat
    const hostiles = this.ships.filter(s => {
      if (!s.hostile || s.dead || s.surrendered || s.sated) return false;
      const d = Math.hypot(s.x - p.x, s.y - p.y);
      return d < (s.fleeing ? 240 : 560);
    });
    if (hostiles.length) {
      if (!this.combat) {
        this.combat = true;
        if (this.auto) { this.auto = false; Bus.emit('toast', { t: 'Branle-bas de combat ! Vous reprenez la barre.', k: 'bad' }); }
        this.fast = false;
        Sound.play('battle');
      }
      this.calmT = 0;
    } else if (this.combat) {
      this.calmT += dt;
      if (this.calmT > 3.5) {
        this.combat = false;
        Sound.play('sea');
        const fled = this.ships.some(s => s.hostile && !s.dead && !s.surrendered);
        if (fled) { r.stats.escapes++; if (r.stats.escapes >= 5) Game.unlock('fuite'); }
        if (this.path) Bus.emit('toast', { t: Input.touch ? 'Le calme revient. Touchez « Pilote » pour reprendre la route.' : 'Le calme revient. Pilote automatique : touche R.', k: '' });
      }
    }
    for (const s of this.ships) if (s.hostile && !s.dead && Math.hypot(s.x - p.x, s.y - p.y) > 700) { s.far += dt; if (s.far > 6) { s.dead = true; s.sinkT = 99; } } else s.far = 0;
    // invites contextuelles
    this.updatePrompt();
    // arrivée automatique
    const destP = World.ports.find(q => q.id === this.dest);
    if (destP && Math.hypot(destP.x - p.x, destP.y - p.y) < 22 && !this.combat) this.dock(destP.id);
    // état du navire → partie
    r.ship.hull = Math.max(0, p.hull); r.ship.crew = p.crew;
  },
  updatePrompt() {
    const p = this.player, r = Game.run;
    let pr = null;
    const bt = this.boardTarget();
    if (bt) pr = { kind: 'board', text: `Aborder ${bt.surrendered ? 'le navire rendu' : bt.name}`, key: 'B' };
    if (!pr) for (const port of World.ports) {
      const d = Math.hypot(port.x - p.x, port.y - p.y);
      if (port.id === r.lastPort && this.voyageT < 8) continue;
      if (d < 46 && port.id !== this.dest && !this.combat) { pr = { kind: 'dock', pid: port.id, text: `Accoster à ${PORT[port.id].name}`, key: 'Entrée' }; break; }
    }
    if (!pr) for (const tr of r.treasures) {
      if (tr.found) continue;
      if (Math.hypot(tr.x - p.x, tr.y - p.y) < 34) { pr = { kind: 'dig', tr, text: p.v < 20 ? 'Déterrer le trésor' : 'Ralentissez pour déterrer le trésor', key: 'Entrée' }; break; }
    }
    this.prompt = pr;
  },
  toggleAuto() {
    if (!this.dest) return;
    this.auto = !this.auto;
    if (this.auto) { this.setDest(this.dest); Bus.emit('toast', { t: 'Pilote automatique engagé.', k: '' }); }
  },
  smartFire() {
    const p = this.player;
    let best = null, bd = 1e9;
    for (const s of this.ships) {
      if (!s.hostile || s.dead || s.surrendered) continue;
      const d = Math.hypot(s.x - p.x, s.y - p.y);
      if (d < bd) { bd = d; best = s; }
    }
    if (!best) { this.fire(p, -1); this.fire(p, 1); return; }
    const cross = Math.cos(p.a) * (best.y - p.y) - Math.sin(p.a) * (best.x - p.x);
    if (!this.fire(p, cross < 0 ? -1 : 1)) this.fire(p, cross < 0 ? 1 : -1);
  },
  move(v, dt, wind) {
    const rel = Math.abs(U.angDiff(v.a, wind.a));
    let vt = v.speedMax * [0, 0.55, 1][v.sail] * (0.5 + 0.5 * polar(rel) * wind.s);
    // galères : à la rame, la vitesse ne doit rien au vent (calme plat, vent debout)
    if (v.oars) { const row = v.speedMax * v.oars * [0, 0.7, 1][v.sail]; v.rowing = row > vt; if (v.rowing) vt = row; }
    vt *= 0.6 + 0.4 * U.clamp(v.hull / v.hullMax * 1.4, 0, 1);
    if (v === this.player) {
      const r = Game.run, st = Game.stats();
      if (v.crew < st.crewMin) vt *= 0.55 + 0.45 * v.crew / st.crewMin;
      vt *= 1 - 0.12 * U.clamp(Game.used() / st.hold, 0, 1);
      if (r.ship.food <= 0) vt *= 0.72;
      if (Game.buff('vent')) vt *= 1.1;
    }
    if (v.surrendered) vt = 0;
    v.v = U.approach(v.v, vt, v.speedMax * 0.38 * dt);
    const turnK = 0.4 + 0.6 * Math.min(1, v.v / 22);
    v.a = U.angNorm(v.a + v.turnIn * v.turn * turnK * dt);
    v.x += Math.cos(v.a) * v.v * dt + v.ex * dt;
    v.y += Math.sin(v.a) * v.v * dt + v.ey * dt;
    const k = Math.max(0, 1 - 1.5 * dt); v.ex *= k; v.ey *= k;
    const sd = World.sdf(v.x, v.y), lim = 2.2;
    if (sd < lim) {
      const [gx, gy] = World.grad(v.x, v.y);
      v.x += gx * (lim - sd); v.y += gy * (lim - sd);
      // glisser le long de la côte plutôt que de s'arrêter net
      const into = Math.cos(v.a) * gx + Math.sin(v.a) * gy;
      if (into < -0.3) {
        if (v.v > 26 && v === this.player && !this.grounded) {
          v.hull -= v.v * 0.1 * (SEA.groundDmg || 1); this.shake = 4; Sound.sfxPlay('hit', { vol: 0.6 });
          this.float(v.x, v.y - 14, 'Échoué !', '#ffd87a');
          this.grounded = 1.5;
        }
        v.v *= 0.75;
      }
    }
    if (this.grounded) this.grounded = Math.max(0, this.grounded - dt) || 0;
    for (const rf of World.reefs) {
      if (Math.hypot(v.x - rf.x, v.y - rf.y) < rf.r && v.v > 16 && v === this.player && R.chance(dt * 2)) {
        v.hull -= 2; v.v *= 0.8; this.float(v.x, v.y - 14, 'Récif !', '#ffd87a'); Sound.sfxPlay('hit', { vol: 0.5 });
      }
    }
    v.x = U.clamp(v.x, 30, WORLD.W - 30); v.y = U.clamp(v.y, 30, WORLD.H - 30);
    if (v.hull <= 0 && !v.dead) this.sink(v, null);
  },
  think(s, dt) {
    const p = this.player;
    if (s.kind === 'merchant') {
      if (!s.cruise) s.cruise = s.a;
      let des = s.cruise;
      if (s.hull < s.hullMax) des = Math.atan2(s.y - p.y, s.x - p.x);
      const look = World.sdf(s.x + Math.cos(s.a) * 50, s.y + Math.sin(s.a) * 50);
      if (look < 16) { const [gx, gy] = World.grad(s.x + Math.cos(s.a) * 50, s.y + Math.sin(s.a) * 50); des = Math.atan2(gy, gx); s.cruise = des; }
      s.turnIn = U.clamp(U.angDiff(s.a, des) * 2, -1, 1);
      return;
    }
    if (s.surrendered) { s.turnIn = 0; s.sail = 0; return; }
    const dx = p.x - s.x, dy = p.y - s.y, d = Math.hypot(dx, dy);
    const angTo = Math.atan2(dy, dx);
    let des = angTo, sail = 2;
    const fleeing = s.ai === 'flee' || (!s.named && !s.wang && s.hull < s.hullMax * 0.25);
    s.fleeing = fleeing;
    if (p.dead) { des = angTo + Math.PI; }
    else if (fleeing) { des = angTo + Math.PI; }
    else {
      const boarder = s.crew >= p.crew * 0.9 && (s.boarder || s.crew > p.crew * 1.3);
      if (boarder && d < 220) {
        const lead = d / 70;
        des = Math.atan2(p.y + Math.sin(p.a) * p.v * lead - s.y, p.x + Math.cos(p.a) * p.v * lead - s.x);
      } else if (d > s.range * 1.05) {
        const lead = d / 150;
        des = Math.atan2(p.y + Math.sin(p.a) * p.v * lead - s.y, p.x + Math.cos(p.a) * p.v * lead - s.x);
      } else {
        const o1 = angTo + Math.PI / 2, o2 = angTo - Math.PI / 2;
        des = Math.abs(U.angDiff(s.a, o1)) < Math.abs(U.angDiff(s.a, o2)) ? o1 : o2;
        if (d < s.range * 0.42) des += (des === o1 ? 0.5 : -0.5);
        sail = d < s.range * 0.6 ? 1 : 2;
      }
      // tir
      s.react -= dt;
      if (s.react <= 0 && d < s.range * 0.98) {
        for (const side of [-1, 1]) {
          const sideAng = s.a + side * Math.PI / 2;
          if (Math.abs(U.angDiff(sideAng, angTo)) < 0.32 && this.fire(s, side)) { s.react = R.range(0.2, 0.6); break; }
        }
      }
    }
    // éviter la côte
    const lx = s.x + Math.cos(s.a) * 45, ly = s.y + Math.sin(s.a) * 45;
    if (World.sdf(lx, ly) < 14) { const [gx, gy] = World.grad(lx, ly); des = Math.atan2(gy, gx); }
    s.sail = sail;
    s.turnIn = U.clamp(U.angDiff(s.a, des) * 2.2, -1, 1);
  },
  updateLoot(dt) {
    const p = this.player, r = Game.run;
    for (const l of this.loot) {
      l.t += dt;
      if (l.gone) continue;
      const d = Math.hypot(l.x - p.x, l.y - p.y);
      if (d < p.r + 8) {
        if (l.type === 'gold') { r.cash += l.v; r.stats.loot += l.v; this.float(l.x, l.y - 8, `+${fmt(l.v)} ${TXT.money}`, '#ffd87a'); Sound.sfxPlay('coin'); l.gone = true; }
        else if (l.type === 'cargo') {
          const n = Math.min(l.n, Game.free());
          if (n <= 0) { if (!l.warned) { this.float(l.x, l.y - 8, 'Cale pleine !', '#ff9a8a'); l.warned = true; } continue; }
          r.cargo[l.g] += n; l.n -= n;
          this.float(l.x, l.y - 8, `+${n} ${GOODS[l.g].name.toLowerCase()}`, GOODS[l.g].color);
          Sound.sfxPlay('coin');
          if (l.n <= 0) l.gone = true;
        } else if (l.type === 'map') {
          l.gone = true;
          const tr = this.placeTreasure();
          if (tr) { r.treasures.push(tr); this.alert('CARTE AU TRÉSOR !', 'Une croix rouge est marquée sur votre carte.', 'jade'); Sound.sfxPlay('levelup'); }
        } else if (l.type === 'bottle') {
          l.gone = true;
          const ru = Game.hearRumorFree ? Game.hearRumorFree() : null;
          Bus.emit('toast', { t: 'Une bouteille à la mer : ' + (ru ? ru.text : R.pick(TAVERN_LINES)), k: 'gold' });
        } else if (l.type === 'raft') {
          l.gone = true;
          const st = Game.stats(), n = Math.max(0, Math.min(l.n, st.crewMax - p.crew));
          p.crew += n; r.ship.crew = p.crew;
          this.float(l.x, l.y - 8, n ? `+${n} marins` : 'Plus de place à bord', '#8fe3bb');
          Bus.emit('toast', { t: n ? `Vous recueillez ${n} naufragés. Ils rejoignent l'équipage !` : 'Des naufragés… mais votre navire est plein. Vous leur lancez des vivres.', k: 'good' });
          Sound.sfxPlay('levelup');
        }
      }
    }
    this.loot = this.loot.filter(l => !l.gone && l.t < 60);
  },
  // ── Faune marine (dauphins, baleines, poissons volants) ──
  updateCritters(dt) {
    const p = this.player;
    if (!this.combat && R.chance(dt * 0.07) && this.critters.length < 6) {
      const a = R.range(-Math.PI, Math.PI), d = R.range(70, 150);
      const x = p.x + Math.cos(a) * d, y = p.y + Math.sin(a) * d;
      if (World.sdf(x, y) > 18) {
        const h = p.a + R.range(-0.6, 0.6), n = R.int(2, 4);
        for (let i = 0; i < n; i++) this.critters.push({ kind: 'dauphin', x: x + R.range(-10, 10), y: y + R.range(-8, 8), a: h, sp: R.range(52, 64), t: -i * 0.35 - R.range(0, 0.2), life: R.range(5, 8) });
      }
    }
    if (!this.combat && R.chance(dt * 0.012) && !this.critters.some(c => c.kind === 'baleine')) {
      const a = R.range(-Math.PI, Math.PI), d = R.range(90, 170);
      const x = p.x + Math.cos(a) * d, y = p.y + Math.sin(a) * d;
      if (World.sdf(x, y) > 70) this.critters.push({ kind: 'baleine', x, y, a: R.range(-Math.PI, Math.PI), sp: 8, t: 0, life: 7 });
    }
    if (p.v > 45 && R.chance(dt * 0.6)) {
      const side = R.chance(0.5) ? 1 : -1, a = p.a + side * R.range(0.6, 1.2);
      for (let i = 0; i < 3; i++) this.fx.add({ x: p.x + Math.cos(p.a) * p.len * 0.5, y: p.y + Math.sin(p.a) * p.len * 0.5, vx: Math.cos(a) * R.range(50, 80), vy: Math.sin(a) * R.range(50, 80), vz: R.range(8, 14), grav: 30, life: 0.9, color: '#dfe8f6', size: 1, layer: 'fx', floor: true });
    }
    for (const c of this.critters) {
      c.t += dt;
      if (c.t < 0) continue;
      c.x += Math.cos(c.a) * c.sp * dt; c.y += Math.sin(c.a) * c.sp * dt;
      if (c.kind === 'dauphin') {
        const ph = (c.t * 1.4) % 1;
        if (Math.abs(ph - 0.02) < dt * 1.4 || Math.abs(ph - 0.55) < dt * 1.4) for (let k = 0; k < 4; k++) this.fx.add({ x: c.x, y: c.y, vx: R.range(-10, 10), vy: R.range(-10, 10), vz: R.range(10, 22), grav: 90, life: 0.5, color: '#e2f6ee', size: 1, layer: 'fx' });
      } else if (c.kind === 'baleine' && c.t > 1.5 && c.t < 3.5 && R.chance(dt * 10)) {
        this.fx.add({ x: c.x + R.range(-1, 1), y: c.y, vx: R.range(-4, 4), vy: R.range(-4, 4), vz: R.range(30, 45), grav: 40, life: 1.2, color: '#f2fbff', alpha: 0.9, size: 1, layer: 'fx' });
      }
    }
    this.critters = this.critters.filter(c => c.t < c.life && World.sdf(c.x, c.y) > 6);
  },
  drawCritters(ctx) {
    for (const c of this.critters) {
      if (c.t < 0) continue;
      if (c.kind === 'dauphin') {
        const ph = (c.t * 1.4) % 1;
        if (ph > 0.55) { ctx.fillStyle = 'rgba(10,40,60,0.2)'; Gfx.ellipse(ctx, c.x, c.y, 3.4, 1.1, c.a); ctx.fill(); continue; }
        const k = ph / 0.55, lift = Math.sin(k * Math.PI) * 4.5;
        ctx.fillStyle = 'rgba(6,26,44,0.22)'; Gfx.ellipse(ctx, c.x + 1, c.y + 1.4, 3.2, 1, c.a); ctx.fill();
        ctx.save(); ctx.translate(c.x, c.y - lift); ctx.rotate(c.a);
        ctx.fillStyle = '#6d8cab';
        ctx.beginPath(); ctx.moveTo(4.3, 0); ctx.quadraticCurveTo(1, -1.6, -3, -0.6); ctx.lineTo(-4.5, -1.5); ctx.lineTo(-4, 0); ctx.lineTo(-4.5, 1.5); ctx.lineTo(-3, 0.6); ctx.quadraticCurveTo(1, 1.6, 4.3, 0); ctx.fill();
        ctx.fillStyle = '#b3c9dd'; Gfx.ellipse(ctx, 1.2, -0.35, 2.2, 0.45); ctx.fill();
        ctx.restore();
      } else {
        const vis = c.t < 1 ? c.t : c.t > c.life - 1.5 ? (c.life - c.t) / 1.5 : 1;
        ctx.save(); ctx.globalAlpha = U.clamp(vis, 0, 1) * 0.85;
        ctx.translate(c.x, c.y); ctx.rotate(c.a);
        ctx.fillStyle = '#233650';
        ctx.beginPath(); ctx.moveTo(6.5, 0); ctx.bezierCurveTo(5, -2.6, -3, -2.4, -5.5, -0.6); ctx.lineTo(-8, -2.2); ctx.quadraticCurveTo(-7, 0, -8, 2.2); ctx.lineTo(-5.5, 0.6); ctx.bezierCurveTo(-3, 2.4, 5, 2.6, 6.5, 0); ctx.fill();
        ctx.fillStyle = 'rgba(160,190,215,0.35)'; Gfx.ellipse(ctx, 2, -0.8, 3.2, 0.7); ctx.fill();
        ctx.restore();
      }
    }
  },
  placeTreasure() {
    for (let i = 0; i < 200; i++) {
      const x = R.range(200, WORLD.W - 200), y = R.range(200, WORLD.H - 200);
      const sd = World.sdf(x, y);
      if (sd > 8 && sd < 16 && !World.ports.some(p => Math.hypot(p.x - x, p.y - y) < 200)) return { x, y, found: false, v: R.int(3000, 9000) + Math.round(Game.run.day * 30) };
    }
    return null;
  },
  dig(tr) {
    const p = this.player, r = Game.run;
    if (p.v > 20) return;
    tr.found = true;
    r.cash += tr.v;
    let jade = 0;
    const tg = GOOD[SEA.treasureGood];   // la marchandise précieuse des trésors (en mer de Chine : le jade)
    if (R.chance(0.5)) { jade = Math.min(Game.free(), R.int(3, 10)); r.cargo[tg.idx] += jade; }
    Game.unlock('tresor');
    const tn = tg.name.toLowerCase();
    Game.log(`Trésor déterré : ${fmt(tr.v)} ${TXT.money}${jade ? ` et ${jade} ${tn}` : ''}.`);
    this.alert('TRÉSOR !', `+${fmt(tr.v)} ${TXT.money}${jade ? ` et ${jade} ${tn}` : ''}`, 'jade');
    Sound.sfxPlay('cash');
    for (let k = 0; k < 34; k++) this.fx.add({ x: tr.x, y: tr.y, vx: R.range(-30, 30), vy: R.range(-30, 30), vz: R.range(30, 60), grav: 90, life: 1.4, color: R.pick(['#ffd87a', '#f2c14e', '#fff2c0']), size: R.range(1, 2), glow: R.chance(0.4), layer: 'fx' });
    this.ring(tr.x, tr.y, 2, 16, 1.2, 0.7);
  },
  updateStorms(dt) {
    const p = this.player, r = Game.run;
    let rainVol = 0, inAny = false;
    for (const s of this.storms) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.rot += dt * 0.35;
      const d = Math.hypot(s.x - p.x, s.y - p.y);
      if (d < s.r + 260 && !s.warned && s.big) { s.warned = true; this.alert(TXT.storm[0], TXT.storm[1], 'red'); Sound.sfxPlay('thunder'); }
      rainVol = Math.max(rainVol, U.clamp(1 - (d - s.r * 0.6) / 220, 0, 1) * s.str);
      if (d < s.r) {
        inAny = true;
        const k = 1 - d / s.r;
        const eye = d < s.r * 0.16;
        if (eye && s.big) this.inEye = true;
        if (!eye) {
          const tang = Math.atan2(s.y - p.y, s.x - p.x) + Math.PI / 2;
          p.ex += Math.cos(tang) * 30 * s.str * k * dt * 3;
          p.ey += Math.sin(tang) * 30 * s.str * k * dt * 3;
          this.stormHit += dt;
          if (this.stormHit > 1.2) {
            this.stormHit = 0;
            const prot = (Game.buff('calme') ? 0.5 : 1) * (1 - 0.25 * Game.her('mazu'));
            if (R.chance(0.6)) {
              const dmg = (2 + 4 * s.str * k) * prot * (p.stormMul || 1);
              p.hull -= dmg; p.flash = 0.12;
              this.float(p.x, p.y - 12, '-' + Math.round(dmg), '#ff9a8a');
              if (p.hull <= 0) { this.sink(p, null); return; }
            }
            if (R.chance(0.25 * s.str * prot)) {
              const gi = Game.roleIdx('fragile');
              if (gi >= 0 && r.cargo[gi] > 0) { const l = Math.max(1, Math.round(r.cargo[gi] * 0.06)); r.cargo[gi] -= l; this.float(p.x, p.y - 22, `-${l} ${GOODS[gi].name.toLowerCase()}`, '#8ab4ff'); }
              else if (p.crew > 3 && R.chance(0.4)) { p.crew--; r.ship.crew = p.crew; this.float(p.x, p.y - 22, 'Un homme à la mer !', '#ffffff'); }
            }
          }
          if (R.chance(dt * 0.35 * s.str)) { this.flashT = 0.12; Sound.sfxPlay('thunder', { vol: 0.8 }); }
        }
      }
    }
    if (this.stormWasIn && !inAny) {
      r.stats.storms++;
      if (this.inEye && p.hull > 0) { Game.unlock('typhon'); this.alert(TXT.stormEye[0], TXT.stormEye[1], 'jade'); }
      this.inEye = false;
    }
    this.stormWasIn = inAny;
    this.rain = rainVol;
    Sound.ambient('rain', rainVol * 0.35);
    Sound.ambient('wind', rainVol * 0.25);
    this.storms = this.storms.filter(s => Math.hypot(s.x - p.x, s.y - p.y) < 2200);
  },
  spawnCheck(dt) {
    this.spawnT -= dt;
    if (this.spawnT > 0) return;
    this.spawnT = 1;
    const r = Game.run, p = this.player;
    // pirates recherchés
    for (const np of NAMED_PIRATES.concat([DRAGON])) {
      if (r.hunts[np.id] === 'active' && !this.spawnedNamed[np.id] && Math.hypot(lonX(np.lon) - p.x, latY(np.lat) - p.y) < 430) this.spawnNamed(np);
    }
    if (!r.flags.dragonDead && !this.spawnedNamed[DRAGON.id] && r.day > DRAGON.roamDay && Game.worth() > DRAGON.roamWorth && World.danger(p.x, p.y) > 0.3 && R.chance(0.004)) this.spawnNamed(DRAGON);
    const hostile = this.ships.filter(s => s.hostile && !s.dead).length;
    if (hostile < 2 && this.voyageT > 5) {
      const danger = World.danger(p.x, p.y);
      let rate = 0.03 * danger * 3;
      if (SEA.pirateSeason) rate *= SEA.pirateSeason[monthOf(r.day)];   // saison des corsaires
      const val = Game.cargoValue(r.cargo) + r.cash * 0.3;
      rate *= 0.5 + Math.min(1.6, val / 15000);
      if (r.day < 12) rate *= 0.3;
      if (Game.buff('protection')) rate *= 0.15;
      if (Game.buff('paix')) rate *= 0.5;
      if (r.flags.dragonDead) rate *= 0.6;
      if (R.chance(rate)) this.spawnPirates(danger);
    }
    if (Game.debtOverdue() && !this.wangSent && R.chance(0.012)) { this.wangSent = true; this.spawnWang(); }
    // épaves et naufragés
    if (this.voyageT > 6 && !this.combat && R.chance(0.012) && this.loot.length < 4) {
      const s = this.freeSpot(p.a, 220, 320);
      if (s) {
        const kind = R.weighted(['raft', 'cargo', 'bottle', 'gold'], k => ({ raft: 3, cargo: 4, bottle: 2, gold: 1 })[k]);
        this.loot.push({ x: s[0], y: s[1], type: kind, t: 0, ph: R.range(0, TAU), n: kind === 'raft' ? R.int(2, 4) : R.int(3, 9), g: R.int(0, 4), v: R.int(60, 260) });
      }
    }
    if (this.ships.filter(s => s.kind === 'merchant').length < 2 && R.chance(0.06)) this.spawnMerchant(false);
  },
  dock(pid) {
    if (this.over) return;
    const shut = Game.portClosed(pid);
    if (shut) {
      if (this.shutWarned !== pid) { this.shutWarned = pid; this.auto = false; this.alert(shut[0].toUpperCase(), shut[1], 'red'); Bus.emit('toast', { t: 'Choisissez une autre destination sur la carte.', k: 'bad' }); }
      return;
    }
    this.over = true;
    Sound.sfxPlay('bell');
    Bus.emit('dock', pid);
  },

  // ── Rendu (repère logique ; la mer elle-même est peinte en WebGL sous ce calque) ──
  draw(ctx, W, H) {
    this.W = W; this.H = H;
    const sh = this.shake;
    const cx = this.camX + (sh ? R.range(-sh, sh) : 0), cy = this.camY + (sh ? R.range(-sh, sh) : 0);
    this.viewX = cx; this.viewY = cy;
    const t = this.t, wind = this.wind || { a: 0, s: 1 };
    if (!SeaGL.render(cx, cy, W, H, t, wind)) World.drawTerrain(ctx, cx, cy, W, H);
    const inView = (x, y, m) => x > cx - m && y > cy - m && x < cx + W + m && y < cy + H + m;
    ctx.save();
    ctx.translate(-cx, -cy);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // villes, jetées, phares, destination
    const k = Gfx.k();
    for (const port of World.ports) {
      if (!inView(port.x, port.y, 50)) continue;
      const town = World.town(port, k);
      ctx.drawImage(town.c, port.x - town.ox, port.y - town.oy, town.w, town.h);
      this.drawPier(ctx, port);
      if (port.id === this.dest) {
        const f = (t * 0.6) % 1;
        ctx.strokeStyle = `rgba(247,213,138,${(0.6 * (1 - f)).toFixed(3)})`; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.arc(port.x, port.y, 4 + f * 14, 0, TAU); ctx.stroke();
        const bob = Math.sin(t * 3) * 1.2, py = port.y - 13 + bob;
        ctx.fillStyle = 'rgba(6,16,30,0.3)'; Gfx.ellipse(ctx, port.x + 0.8, port.y + 0.8, 2, 0.8); ctx.fill();
        ctx.fillStyle = PAL.gold;
        ctx.beginPath(); ctx.moveTo(port.x, py + 6); ctx.bezierCurveTo(port.x - 3.6, py + 1, port.x - 3.6, py - 3.4, port.x, py - 3.4); ctx.bezierCurveTo(port.x + 3.6, py - 3.4, port.x + 3.6, py + 1, port.x, py + 6); ctx.fill();
        ctx.fillStyle = '#6a4512'; ctx.beginPath(); ctx.arc(port.x, py - 0.2, 1.2, 0, TAU); ctx.fill();
      }
    }
    // ondes circulaires
    for (const rg of this.rings) {
      const f = rg.t / rg.life;
      ctx.strokeStyle = `rgba(238,246,242,${(rg.a * (1 - f)).toFixed(3)})`; ctx.lineWidth = 0.5 + (1 - f) * 0.6;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r0 + (rg.r1 - rg.r0) * U.easeOut(f), 0, TAU); ctx.stroke();
    }
    // trésors : croix rouge et cercle qui pulse
    for (const tr of Game.run.treasures) {
      if (tr.found || !inView(tr.x, tr.y, 20)) continue;
      const pulse = 5.5 + Math.sin(t * 3) * 0.8;
      ctx.setLineDash([1.4, 1.4]); ctx.strokeStyle = 'rgba(216,71,43,0.7)'; ctx.lineWidth = 0.6;
      ctx.beginPath(); ctx.arc(tr.x, tr.y, pulse, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = PAL.red; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(tr.x - 3, tr.y - 3); ctx.lineTo(tr.x + 3, tr.y + 3); ctx.moveTo(tr.x + 3, tr.y - 3); ctx.lineTo(tr.x - 3, tr.y + 3); ctx.stroke();
    }
    // butin flottant
    for (const l of this.loot) {
      if (!inView(l.x, l.y, 20)) continue;
      this.drawLoot(ctx, l, t);
    }
    this.drawWakes(ctx);
    this.fx.draw(ctx, 0, 0, 'wake');
    this.drawCritters(ctx);
    // navires (du plus lointain au plus proche)
    const vis = this.ships.filter(s => inView(s.x, s.y, 70)).sort((a, b) => a.y - b.y);
    const sailOv = Game.sailScheme();
    for (const s of vis) {
      const target = s.sail === 0 || s.surrendered ? 0 : U.clamp(U.angDiff(s.a, wind.a) * 0.5, -1.25, 1.25);
      s.sheetV = U.lerp(s.sheetV || 0, target, 0.06);
      const ov = s.kind === 'player' ? sailOv : null;
      if (s.dead) {
        const kk = U.clamp(s.sinkT / 3, 0, 1);
        if (kk >= 1) continue;
        ctx.globalAlpha = 1 - kk;
        ShipTop.draw(ctx, s, { furled: true, sailOv: ov, t: t + s.len, windA: wind.a, scale: 1 - kk * 0.25, noShadow: kk > 0.25 });
        ctx.globalAlpha = 1;
        if (R.chance(0.35)) this.fx.add({ x: s.x + R.range(-6, 6), y: s.y + R.range(-4, 4), vx: 0, vy: 0, life: 0.9, color: '#eef6f0', size: R.range(1, 2), grow: 1.5, soft: true, layer: 'wake' });
        continue;
      }
      const bobA = Math.sin(s.t * 2 + s.len) * 0.012;
      ShipTop.draw(ctx, { style: s.style, len: s.len, scheme: s.scheme, x: s.x, y: s.y, a: s.a + bobA },
        { furled: s.sail === 0 || s.surrendered, sailOv: ov, sheet: s.sheetV, t: t + s.len, windA: wind.a, flash: s.flash, white: s.surrendered, row: s.rowing ? t + s.len : null });
      if (s.hull < s.hullMax * 0.4 && R.chance(0.14)) this.fx.add({ x: s.x + R.range(-3, 3), y: s.y + R.range(-3, 3), vx: Math.cos(wind.a) * 7, vy: Math.sin(wind.a) * 7, vz: 4, life: 2.4, colors: ['#3e3e46', '#74747e', '#a8a8b2'], alpha: 0.45, size: 2, grow: 3, soft: true, layer: 'smoke' });
      if (s !== this.player && s.hostile && s.hull < s.hullMax) {
        const bw = s.len * 0.8, bx = s.x - bw / 2, by = s.y - s.len * 0.64, f = U.clamp(s.hull / s.hullMax, 0, 1);
        Gfx.rr(ctx, bx - 0.5, by - 0.5, bw + 1, 2.5, 1.25); ctx.fillStyle = 'rgba(8,12,22,0.72)'; ctx.fill();
        Gfx.rr(ctx, bx, by, Math.max(1.5, bw * f), 1.5, 0.75); ctx.fillStyle = f > 0.45 ? '#ee6e52' : '#f2c14e'; ctx.fill();
      }
    }
    // boulets : ombre sur l'eau, boulet en l'air
    for (const b of this.balls) {
      const kk = b.t / b.life, z = Math.sin(kk * Math.PI) * 9;
      ctx.fillStyle = 'rgba(4,14,26,0.25)'; Gfx.ellipse(ctx, b.x, b.y, 1.3, 0.8); ctx.fill();
      ctx.fillStyle = '#1b1b21'; ctx.beginPath(); ctx.arc(b.x, b.y - z, 1.15, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(b.x - 0.4, b.y - z - 0.4, 0.4, 0, TAU); ctx.fill();
    }
    this.fx.draw(ctx, 0, 0, 'fx');
    this.fx.draw(ctx, 0, 0, 'smoke');
    ctx.restore();
    // typhons : ciel assombri et spirale de nuages
    for (const s of this.storms) {
      const x = s.x - cx, y = s.y - cy;
      if (x < -s.r * 1.4 || y < -s.r * 1.4 || x > W + s.r * 1.4 || y > H + s.r * 1.4) continue;
      const g = ctx.createRadialGradient(x, y, s.r * 0.12, x, y, s.r * 1.3);
      g.addColorStop(0, 'rgba(8,16,30,0.04)'); g.addColorStop(0.45, `rgba(8,16,30,${(0.34 * s.str).toFixed(3)})`); g.addColorStop(1, 'rgba(8,16,30,0)');
      ctx.fillStyle = g; ctx.fillRect(x - s.r * 1.3, y - s.r * 1.3, s.r * 2.6, s.r * 2.6);
      ctx.save(); ctx.translate(x, y); ctx.rotate(s.rot); ctx.globalAlpha = 0.86;
      const size = s.r * 2.3;
      ctx.drawImage(this.stormSprite, -size / 2, -size / 2, size, size);
      ctx.restore();
    }
    // pluie
    if (this.rain > 0.02) {
      ctx.fillStyle = `rgba(12,20,36,${(this.rain * 0.32).toFixed(3)})`; ctx.fillRect(0, 0, W, H);
      const n = Math.round(this.rain * 230), dx = Math.cos(wind.a) * 3, dy = 8;
      ctx.strokeStyle = 'rgba(205,222,245,0.32)'; ctx.lineWidth = 0.35; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const mw = W + 40, mh = H + 40;
        const x = ((hash2(i, 1, 9) * mw + t * 70 * Math.cos(wind.a)) % mw + mw) % mw - 20;
        const y = ((hash2(i, 2, 9) * mh + t * 380) % mh + mh) % mh - 20;
        ctx.moveTo(x, y); ctx.lineTo(x + dx, y + dy);
      }
      ctx.stroke();
    }
    // nuit : bleu profond, lanternes et phares
    const sky = skyAt(this.vt), dark = sky.dark * 0.95;
    if (dark > 0.02) {
      ctx.fillStyle = `rgba(6,14,40,${dark.toFixed(3)})`; ctx.fillRect(0, 0, W, H);
      const la = Math.min(1, dark * 1.6);
      for (const s of vis) {
        if (s.dead) continue;
        const gx = s.x - Math.cos(s.a) * s.len * 0.42 - cx, gy = s.y - Math.sin(s.a) * s.len * 0.42 - cy;
        Gfx.glow(ctx, gx, gy, 9 + s.len * 0.14, '#ffbe62', la * 0.9);
        Gfx.glow(ctx, gx, gy, 2.2, '#fff4d0', la);
      }
      for (const port of World.ports) {
        const x = port.x - cx, y = port.y - cy;
        if (x < -120 || y < -120 || x > W + 120 || y > H + 120) continue;
        Gfx.glow(ctx, x, y, 30, '#ffb85c', la * 0.35);
        const lh = this.pierEnd(port), lx = lh.x - cx, ly = lh.y - cy;
        Gfx.glow(ctx, lx, ly, 12, '#fff0c0', la);
        ctx.save(); ctx.translate(lx, ly); ctx.rotate(t * 1.3 + port.x);

    // vignette

    vg.addColorStop(0, 'rgba(4,10,22,0)'); vg.addColorStop(1, 'rgba(4,10,22,0.34)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  },
  pierEnd(port) {
    if (!port.pier) { const [gx, gy] = World.grad(port.x, port.y); port.pier = { gx, gy }; }
    return { x: port.x - port.pier.gx * 3 - port.pier.gy * 2.6, y: port.y - port.pier.gy * 3 + port.pier.gx * 2.6 };
  },
  drawPier(ctx, port) {

    ctx.lineCap = 'round';

    ctx.fillStyle = '#f3ede0'; ctx.beginPath(); ctx.arc(e.x, e.y, 2.1, 0, TAU); ctx.fill();
    ctx.fillStyle = PAL.red; ctx.beginPath(); ctx.arc(e.x, e.y, 1.25, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe6a8'; ctx.beginPath(); ctx.arc(e.x - 0.3, e.y - 0.3, 0.45, 0, TAU); ctx.fill();
  },

      Gfx.rr(ctx, x - 3.2, y - 2.8, 6.4, 1.9, 0.8); ctx.fillStyle = '#8e5c32'; ctx.fill();
      ctx.fillStyle = PAL.gold; ctx.fillRect(x - 3.2, y - 1.1, 6.4, 0.7); ctx.fillRect(x - 0.5, y - 1.5, 1, 1.6);

      ctx.fillStyle = GOODS[l.g].color; ctx.fillRect(x - 2.2, y - 2.2, 4.4, 1.8);
      ctx.strokeStyle = 'rgba(60,36,20,0.6)'; ctx.lineWidth = 0.35; ctx.beginPath(); ctx.moveTo(x - 2.4, y + 2.4); ctx.lineTo(x + 2.4, y); ctx.stroke();
    } else if (l.type === 'map') {

      ctx.fillStyle = PAL.red; ctx.beginPath(); ctx.arc(0, 0, 0.8, 0, TAU); ctx.fill();
