    } else if (l.type === 'raft') {
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = '#8a6a3a'; for (let i = 0; i < 5; i++) Gfx.rr(ctx, -4.5 + i * 1.8, -2.4, 1.6, 4.8, 0.5), ctx.fill();
      ctx.fillStyle = '#e7c9a0'; ctx.beginPath(); ctx.arc(-1.4, -0.6, 0.9, 0, TAU); ctx.arc(1.6, 0.4, 0.9, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#5c3a22'; ctx.lineWidth = 0.35; ctx.beginPath(); ctx.moveTo(3.4, 1.8); ctx.lineTo(3.4, -5); ctx.stroke();
      const wv = Math.sin(t * 5 + l.ph) * 0.8;
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(3.4, -5); ctx.lineTo(6.4, -4.4 + wv); ctx.lineTo(3.4, -3.2); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else {
      ctx.save(); ctx.translate(x, y); ctx.rotate(-0.6 + Math.sin(t * 1.3 + l.ph) * 0.2);
      Gfx.rr(ctx, -2.6, -1, 4.2, 2, 1); ctx.fillStyle = 'rgba(120,190,150,0.9)'; ctx.fill();
      ctx.fillStyle = '#b08a52'; ctx.fillRect(1.5, -0.5, 1.2, 1);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(-1.8, -0.7, 2.4, 0.4);
      ctx.restore();
    }
  },
  // sillages en rubans : bras en V qui s'écartent et s'effacent, remous au centre
  drawWakes(ctx) {
    const now = this.t, life = 1.9;
    for (const s of this.ships) {
      const tr = s.trail;
      if (!tr || !tr.length) continue;
      const pts = tr.filter(p => now - p.t < life);
      if (!s.dead && s.v > 3) pts.push({ x: s.x - Math.cos(s.a) * s.len * 0.46, y: s.y - Math.sin(s.a) * s.len * 0.46, a: s.a, v: s.v, t: now });
      if (pts.length < 2) continue;
      const B = s.len * (SHIP_MODELS[s.style] || SHIP_MODELS.junk).beam;
      const chunks = Math.min(7, pts.length - 1);
      for (const side of [0, -1, 1]) {
        for (let c = 0; c < chunks; c++) {
          const i0 = Math.floor((pts.length - 1) * c / chunks), i1 = Math.ceil((pts.length - 1) * (c + 1) / chunks);
          const pm = pts[(i0 + i1) >> 1], age = now - pm.t, fa = Math.pow(Math.max(0, 1 - age / life), 1.6);
          if (fa <= 0.01) continue;
          const sp = U.clamp(pm.v / 45, 0.15, 1.1);
          ctx.beginPath();
          for (let i = i0; i <= i1; i++) {
            const p = pts[i], ag = now - p.t;
            const off = side * (B * 0.36 + ag * (4 + p.v * 0.13));
            const x = p.x - Math.sin(p.a) * off, y = p.y + Math.cos(p.a) * off;
            if (i === i0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          if (side === 0) { ctx.strokeStyle = `rgba(232,244,240,${(0.16 * fa * sp).toFixed(3)})`; ctx.lineWidth = B * 0.34 + age * 1.3; }
          else { ctx.strokeStyle = `rgba(240,248,245,${(0.42 * fa * sp).toFixed(3)})`; ctx.lineWidth = 0.45 + age * 0.3; }
          ctx.stroke();
        }
      }
    }
  },
  // textes nets par-dessus (pixels réels)
  overlay(sctx, S) {
    const cx = this.viewX != null ? this.viewX : this.camX, cy = this.viewY != null ? this.viewY : this.camY, W = this.W, H = this.H;
    const cw = sctx.canvas.width, ch = sctx.canvas.height;
    // sur téléphone, la scène est petite : les textes gardent une taille lisible (au moins 11 px pour les ports)
    const tk = UI.isMobile() ? Math.max(1, 11 * (Main.dpr || 1) / (S * 4.6)) : 1;
    for (const port of World.ports) {
      const x = (port.x - cx) * S, y = (port.y - cy - 24) * S;
      if (x < -200 || y < -80 || x > cw + 200 || y > ch + 80) continue;
      const dest = port.id === this.dest;
      Gfx.text(sctx, PORT[port.id].name, x, y, { size: Math.round(S * 4.6 * tk), align: 'center', color: dest ? '#f7d58a' : '#f6efe0', font: 'title', weight: 800 });
      if (PORT[port.id].zh) Gfx.text(sctx, PORT[port.id].zh, x, y + S * 4.4 * tk, { size: Math.round(S * 3.1 * tk), align: 'center', color: dest ? '#f7d58a' : '#e6dcc6', font: 'title', weight: 700, alpha: 0.85, spacing: S * 0.6 });
    }
    for (const s of this.ships) {
      if (!s.label || s.dead) continue;
      Gfx.text(sctx, s.label, (s.x - cx) * S, (s.y - cy - s.len * 0.78) * S, { size: Math.round(S * 3.4 * tk), align: 'center', color: '#ffb2a0', weight: 800 });
    }
    for (const tx of this.texts) {
      const k = tx.age / tx.life, pop = 1 + 0.4 * Math.max(0, 1 - tx.age * 7);
      Gfx.text(sctx, tx.t, (tx.x - cx) * S, (tx.y - cy - U.easeOut(k) * 16) * S, { size: Math.round(S * 3.7 * pop * tk), align: 'center', color: tx.color, weight: 800, alpha: 1 - k * k });
    }
    // indicateurs hors écran
    const p = this.player, st = Game.stats();
    const range = 430 * (st ? st.vigie : 1) * (Game.buff('vigie') ? 1.5 : 1);
    const arrows = [];
    for (const s of this.ships) {
      if (s === p || s.dead) continue;
      if (Math.hypot(s.x - p.x, s.y - p.y) > range) continue;
      const x = s.x - cx, y = s.y - cy;
      if (x > 0 && y > 0 && x < W && y < H) continue;
      arrows.push({ x: s.x, y: s.y, c: s.hostile && !s.surrendered ? '#ff7a64' : '#f3ebda' });
    }
    for (const s of this.storms) {
      const x = s.x - cx, y = s.y - cy;
      if (Math.hypot(s.x - p.x, s.y - p.y) - s.r > range || (x > 0 && y > 0 && x < W && y < H)) continue;
      arrows.push({ x: s.x, y: s.y, c: '#b9c4dc' });
    }
    const destP = World.ports.find(q => q.id === this.dest);
    if (destP) { const x = destP.x - cx, y = destP.y - cy; if (!(x > 0 && y > 0 && x < W && y < H)) arrows.push({ x: destP.x, y: destP.y, c: '#f7d58a', dest: true }); }
    const mx = W * S / 2, my = H * S / 2;
    for (const a of arrows) {
      const ang = Math.atan2(a.y - (cy + H / 2), a.x - (cx + W / 2));
      const rx = W * S / 2 - 28 * S / 3, ry = H * S / 2 - 28 * S / 3;
      const kk = Math.min(rx / Math.abs(Math.cos(ang) || 1e-6), ry / Math.abs(Math.sin(ang) || 1e-6));
      const x = mx + Math.cos(ang) * kk, y = my + Math.sin(ang) * kk;
      sctx.save(); sctx.translate(x, y); sctx.rotate(ang);
      const z = S * 2.1;
      sctx.shadowColor = 'rgba(4,10,20,0.6)'; sctx.shadowBlur = z * 2;
      sctx.fillStyle = a.c; sctx.lineJoin = 'round';
      sctx.beginPath(); sctx.moveTo(z * 2.2, 0); sctx.lineTo(-z, -z * 1.5); sctx.lineTo(-z * 0.25, 0); sctx.lineTo(-z, z * 1.5); sctx.closePath(); sctx.fill();
      sctx.restore();
      if (a.dest) Gfx.text(sctx, PORT[this.dest].name, x - Math.cos(ang) * 34, y - Math.sin(ang) * 34 + 5, { size: Math.round(S * 3.4 * tk), align: 'center', color: '#f7d58a', font: 'title', weight: 800 });
    }
  },

  // ── Boussole des allures et mini-carte (HUD) ──
  hudCanvas(c, fallback) {
    const dpr = Main.dpr || 1, size = c.clientWidth || fallback, px = Math.max(1, Math.round(size * dpr));
    if (c.width !== px) { c.width = px; c.height = px; }
    const x = c.getContext('2d');
    x.setTransform(px / size, 0, 0, px / size, 0, 0);
    return [x, size];
  },
  drawCompass(c) {
    const [x, w] = this.hudCanvas(c, 72), cx = w / 2;
    x.clearRect(0, 0, w, w);
    const wind = this.wind || { a: 0, s: 1 }, p = this.player;
    x.fillStyle = 'rgba(11,18,30,0.8)'; x.beginPath(); x.arc(cx, cx, cx - 1, 0, TAU); x.fill();
    // anneau des allures : vert = bon cap par rapport au vent
    const r0 = cx - 3.5, r1 = cx - 8;
    for (let i = 0; i < 72; i++) {
      const a0 = i / 72 * TAU, a1 = (i + 1) / 72 * TAU + 0.004, am = (a0 + a1) / 2;
      const f = polar(Math.abs(U.angDiff(am, wind.a)));
      x.fillStyle = f > 0.95 ? '#3fae8a' : f > 0.8 ? '#9cc36a' : f > 0.6 ? '#e8b54a' : '#d8472b';
      x.beginPath(); x.arc(cx, cx, r0, a0, a1); x.arc(cx, cx, r1, a1, a0, true); x.closePath(); x.fill();
    }
    x.strokeStyle = 'rgba(243,235,218,0.35)'; x.lineWidth = 1;
    for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; x.beginPath(); x.moveTo(cx + Math.cos(a) * (r1 - 1), cx + Math.sin(a) * (r1 - 1)); x.lineTo(cx + Math.cos(a) * (r1 - 5), cx + Math.sin(a) * (r1 - 5)); x.stroke(); }
    // vent
    const wl = cx - 17;
    x.strokeStyle = '#9cc2e6'; x.fillStyle = '#9cc2e6'; x.lineWidth = 2; x.lineCap = 'round';
    x.beginPath(); x.moveTo(cx - Math.cos(wind.a) * wl, cx - Math.sin(wind.a) * wl); x.lineTo(cx + Math.cos(wind.a) * (wl - 5), cx + Math.sin(wind.a) * (wl - 5)); x.stroke();
    x.save(); x.translate(cx + Math.cos(wind.a) * wl, cx + Math.sin(wind.a) * wl); x.rotate(wind.a);
    x.beginPath(); x.moveTo(3, 0); x.lineTo(-5, -4.5); x.lineTo(-3, 0); x.lineTo(-5, 4.5); x.closePath(); x.fill(); x.restore();
    // cap du navire
    if (p) {
      x.save(); x.translate(cx, cx); x.rotate(p.a);
      x.fillStyle = '#f7d58a'; x.shadowColor = 'rgba(247,213,138,0.8)'; x.shadowBlur = 6;
      x.beginPath(); x.moveTo(cx - 2, 0); x.lineTo(cx - 11, -4.5); x.lineTo(cx - 11, 4.5); x.closePath(); x.fill();
      x.restore();
    }
    x.fillStyle = '#f3ebda'; x.font = `800 10px ${FONT_TITLE}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('N', cx, 14.5);
  },
  drawRadar(c) {
    const p = this.player;
    if (!p) return;
    const [x, w] = this.hudCanvas(c, 136), cx = w / 2;
    const K = 816 / cx;   // unités monde par pixel CSS (même champ à toutes les tailles)
    const CS = World.chartScale || 1, C = WORLD.CELL, sw = w * K / C * CS;
    x.clearRect(0, 0, w, w);
    x.save(); x.beginPath(); x.arc(cx, cx, cx, 0, TAU); x.clip();
    x.fillStyle = '#dfe9e4'; x.fillRect(0, 0, w, w);
    x.imageSmoothingEnabled = true;
    x.drawImage(World.chart, p.x / C * CS - sw / 2, p.y / C * CS - sw / 2, sw, sw, 0, 0, w, w);
    const P = (wx, wy) => [cx + (wx - p.x) / K, cx + (wy - p.y) / K];
    if (this.path && this.auto) {
      x.strokeStyle = 'rgba(216,71,43,0.85)'; x.setLineDash([3, 3]); x.lineWidth = 1.5; x.beginPath();
      x.moveTo(cx, cx);
      for (let i = Math.max(0, this.wp); i < this.path.length; i++) { const [a, b] = P(this.path[i][0], this.path[i][1]); x.lineTo(a, b); }
      x.stroke(); x.setLineDash([]);
    }
    for (const s of this.storms) { const [a, b] = P(s.x, s.y); x.fillStyle = 'rgba(60,70,100,0.35)'; x.beginPath(); x.arc(a, b, s.r / K, 0, TAU); x.fill(); }
    const st = Game.stats(), range = 430 * (st ? st.vigie : 1) * (Game.buff('vigie') ? 1.5 : 1);
    for (const port of World.ports) {
      const [a, b] = P(port.x, port.y);
      x.fillStyle = port.id === this.dest ? '#d8472b' : '#27486a';
      x.beginPath(); x.arc(a, b, port.id === this.dest ? 3.2 : 2.4, 0, TAU); x.fill();
      x.strokeStyle = '#f3ebda'; x.lineWidth = 1; x.stroke();
    }
    for (const l of this.loot) { const [a, b] = P(l.x, l.y); x.fillStyle = '#d99a1e'; x.beginPath(); x.arc(a, b, 1.5, 0, TAU); x.fill(); }
    for (const tr of Game.run.treasures) if (!tr.found) {
      const [a, b] = P(tr.x, tr.y); x.strokeStyle = '#d8472b'; x.lineWidth = 1.6;
      x.beginPath(); x.moveTo(a - 3, b - 3); x.lineTo(a + 3, b + 3); x.moveTo(a + 3, b - 3); x.lineTo(a - 3, b + 3); x.stroke();
    }
    for (const s of this.ships) {
      if (s === p || s.dead) continue;
      if (Math.hypot(s.x - p.x, s.y - p.y) > range) continue;
      const [a, b] = P(s.x, s.y);
      x.fillStyle = s.hostile && !s.surrendered ? '#d8472b' : '#ffffff';
      x.strokeStyle = 'rgba(17,26,40,0.8)'; x.lineWidth = 1;
      x.beginPath(); x.arc(a, b, 2.6, 0, TAU); x.fill(); x.stroke();
    }
    x.save(); x.translate(cx, cx); x.rotate(p.a);
    x.fillStyle = '#237a60'; x.strokeStyle = '#ffffff'; x.lineWidth = 1.2; x.lineJoin = 'round';
    x.beginPath(); x.moveTo(7, 0); x.lineTo(-5, -4.5); x.lineTo(-2.6, 0); x.lineTo(-5, 4.5); x.closePath(); x.stroke(); x.fill();
    x.restore();
    const vg = x.createRadialGradient(cx, cx, cx * 0.7, cx, cx, cx);
    vg.addColorStop(0, 'rgba(17,26,40,0)'); vg.addColorStop(1, 'rgba(17,26,40,0.28)');
    x.fillStyle = vg; x.fillRect(0, 0, w, w);
    x.restore();
  },
};

</script>
<script>
'use strict';
// ─── Mers de Jade · interface : HUD, panneaux, menus ───

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(3)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
function ico(k, cls) { return h('img', { class: 'ico ' + (cls || ''), src: Icons.urls[k] || '', alt: '' }); }
function put(el, ...kids) { el.replaceChildren(...kids.flat(3).filter(k => k != null && k !== false)); }
function btn(label, fn, cls, attrs) {
  return h('button', Object.assign({
    class: 'btn ' + (cls || ''), type: 'button',
    onclick: e => { e.stopPropagation(); Sound.sfxPlay('click'); fn(e); },
  }, attrs || {}), label);
}
function money(n, cls) { return h('b', { class: 'num ' + (cls || '') }, fmt(n)); }
// nom d'un bâtiment dans le port courant : l'enseigne propre au port (« Rialto »…), sinon le nom générique
function bldName(t) { const P = Game.run && PORT[Game.run.port]; return (P && P.signs && P.signs[t]) || BUILDINGS[t].name; }

const UI = {
  stack: [],
  el: {},
  toastQ: [],
  init() {
    for (const id of ['hud', 'objectives', 'seahud', 'portbar', 'touch', 'prompt', 'toasts', 'banner', 'modal']) this.el[id] = document.getElementById(id);
    this.el.compass = document.getElementById('compass');
    this.el.radar = document.getElementById('radar');
    Bus.on('toast', o => this.toast(o.t, o.k));
    Bus.on('banner', o => this.banner(o.title, o.sub, o.kind));
    Bus.on('achievement', a => { this.toast(`Haut fait : ${a.name} (+${a.jade} ${TXT.token})`, 'gold', 'star'); Sound.sfxPlay('levelup'); });
    Bus.on('title', ti => { this.banner(TITLES[ti].name.toUpperCase(), TXT.titleUp, 'jade'); Sound.play('fanfare'); });
    // commandes tactiles
    for (const b of this.el.touch.querySelectorAll('[data-act]')) {
      const act = b.dataset.act;
      const on = e => { e.preventDefault(); Input.press(act); b.classList.add('on'); Bus.emit('audio-unlock'); this.buzz(act.startsWith('fire') ? 18 : 6); };
      const off = e => { e.preventDefault(); Input.release(act); b.classList.remove('on'); };
      b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
    }
    document.getElementById('bt-map').onclick = () => { Sound.sfxPlay('click'); this.chart(false); };
    document.getElementById('bt-auto').onclick = () => { Sound.sfxPlay('click'); SeaScene.toggleAuto(); };
    document.getElementById('bt-fast').onclick = () => { Sound.sfxPlay('click'); SeaScene.fast = !SeaScene.fast; };
    this.el.prompt.onclick = () => this.promptAction && this.promptAction();
    this.el.objectives.onclick = () => { this.objTouched = true; this.el.objectives.classList.toggle('min'); };
    Bus.on('layout', () => this.keyLabels());
    this.keyLabels();
  },
  isMobile() { return document.body.classList.contains('mobile'); },
  // retour haptique discret (Android ; ignoré ailleurs)
  buzz(ms) { try { if (Input.touch && navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* facultatif */ } },
  // panneau en « tiroir » sur mobile : on le fait glisser vers le bas pour le fermer
  swipeToClose(entry) {
    const { panel, o } = entry, head = panel.querySelector('.panel-head');
    if (!head || o.closable === false) return;
    let y0 = null, dy = 0;
    head.addEventListener('pointerdown', e => {
      if (!this.isMobile() || !document.body.classList.contains('portrait') || e.target.closest('button')) return;
      y0 = e.clientY; dy = 0; head.setPointerCapture(e.pointerId); panel.style.transition = 'none';
    });
    head.addEventListener('pointermove', e => {
      if (y0 == null) return;
      dy = Math.max(0, e.clientY - y0);
      panel.style.transform = `translateY(${dy}px)`;
    });
    const end = () => {
      if (y0 == null) return;
      y0 = null; panel.style.transition = '';
      if (dy > 90) { panel.style.transform = 'translateY(110%)'; setTimeout(() => this.close(entry), 160); }
      else panel.style.transform = '';
    };
    head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);
  },
  keyLabels() {
    document.getElementById('gunLk').textContent = Input.label('KeyQ');
    document.getElementById('gunRk').textContent = Input.label('KeyE');
  },

  // ════════════ Modales ════════════
  open(o) {
    const panel = h('div', { class: 'panel ' + (o.cls || ''), role: 'dialog', 'aria-label': o.title });
    const inner = h('div', { class: 'panel-in' });
    const head = h('div', { class: 'panel-head' },
      o.icon ? ico(o.icon, 'big') : null,
      h('div', { class: 'grow' }, h('h3', null, o.title), o.sub ? h('div', { class: 'sub' }, o.sub) : null),
      o.closable === false ? null : h('button', { class: 'x', type: 'button', 'aria-label': 'Fermer', onclick: () => { Sound.sfxPlay('click'); this.close(); } }, 'X'));
    const body = h('div', { class: 'panel-body' });
    if (o.body) body.append(o.body);
    inner.append(head, body);
    if (o.foot) inner.append(h('div', { class: 'panel-foot' }, o.foot));
    panel.append(inner);
    const ov = h('div', { class: 'overlay' + (o.clear ? ' clear' : '') }, panel);
    ov.addEventListener('pointerdown', e => { if (e.target === ov && o.closable !== false && !o.sticky) this.close(); });
    this.el.modal.append(ov);
    const entry = { ov, panel, body, o };
    this.stack.push(entry);
    this.swipeToClose(entry);
    Input.blocked = true;
    setTimeout(() => { const f = panel.querySelector('button.btn:not(:disabled), input'); if (f && !Input.touch) f.focus({ preventScroll: true }); }, 30);
    return entry;
  },
  close(entry) {
    entry = entry || this.stack[this.stack.length - 1];
    if (!entry) return;
    const i = this.stack.indexOf(entry);
    if (i < 0) return;
    this.stack.splice(i, 1);
    entry.ov.remove();
    Input.blocked = this.stack.length > 0;
    // la touche ou le clic qui a fermé la fenêtre ne doit pas agir aussi sur la scène
    Input.hits = Object.create(null);
    Input.virtHits = Object.create(null);
    Input.pointer.clicked = false;
    if (entry.o.onClose) entry.o.onClose();
    this.refresh();
  },
  closeAll() { while (this.stack.length) this.close(); },
  isOpen() { return this.stack.length > 0; },
  onKey(e) {
    if (!this.stack.length) return;
    if (e.code === 'Escape') { const top = this.stack[this.stack.length - 1]; if (top.o.closable !== false) { e.preventDefault(); this.close(); } }
  },
  choice(title, text, options, icon) {
    return new Promise(res => {
      let done = false;
      const finish = v => { if (done) return; done = true; this.close(entry); res(v); };
      const entry = this.open({
        title, icon, cls: 'narrow', closable: false, sticky: true,
        body: h('div', null, ...(Array.isArray(text) ? text : [text]).map(t => typeof t === 'string' ? h('p', null, t) : t)),
        foot: options.map(op => btn(op.label, () => finish(op.value), op.cls, op.disabled ? { disabled: true } : null)),
      });
    });
  },
  confirm(title, text, yes, no, danger) {
    return this.choice(title, text, [{ label: no || 'Annuler', value: false }, { label: yes || 'Confirmer', value: true, cls: danger ? 'red' : 'jade' }]);
  },

  // ════════════ Notifications ════════════
  toast(text, kind, icon) {
    const t = h('div', { class: 'toast ' + (kind || '') }, icon ? ico(icon) : null, h('span', null, text));
    this.el.toasts.append(t);
    while (this.el.toasts.children.length > (this.isMobile() ? 2 : 4)) this.el.toasts.firstChild.remove();
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 420); }, 3600 + Math.min(3000, text.length * 25));
  },
  banner(title, sub, kind, zh) {
    const b = this.el.banner;
    b.hidden = false;
    b.className = 'banner ' + (kind || '');
    b.innerHTML = '';

    this.el.objectives.hidden = !inGame || !Game.global.settings.hints;
    this.el.seahud.hidden = mode !== 'sea';

    this.el.touch.hidden = !(mode === 'sea' && touch);
    document.body.classList.toggle('touch-sea', mode === 'sea' && touch);

    if (inGame && this.isMobile() && !this.objTouched) this.el.objectives.classList.add('min');

    this.el.prompt.innerHTML = '';
    if (mode === 'port') this.buildPortBar();

    if (!Game.run || !this.mode || this.mode === 'title') return;

    const kids = [

    if (r.debt > 0) kids.push(it('debt', money(r.debt), 'debt', `Dette envers ${TXT.lender}`));
    if (s && st) {
      const hp = s.hull / st.hullMax;

      kids.push(it('hull', h('span', { class: 'bar' }, h('i', { class: hp < 0.3 ? 'crit' : hp < 0.6 ? 'warn' : '', style: { width: Math.round(hp * 100) + '%' } })), '', `Coque ${Math.round(s.hull)}/${st.hullMax}`));
      kids.push(it('crew', h('b', { class: 'num' + (s.crew < st.crewMin ? ' neg' : '') }, s.crew), '', `Équipage (min. ${st.crewMin})`));

  anims: [],
  anim(fn) { this.anims.push(fn); },
  // appelé à chaque image
  frame(dt) {
    if (this.anims.length) this.anims = this.anims.filter(fn => { try { return !fn(dt || 1 / 60); } catch (e) { console.error(e); return false; } });
    const mode = this.mode;
    if (mode === 'sea') {
      const p = SeaScene.player;
      if (!p) return;
      SeaScene.drawCompass(this.el.compass);
      if (!this.radarT || performance.now() - this.radarT > 90) { SeaScene.drawRadar(this.el.radar); this.radarT = performance.now(); }
      document.getElementById('sh-speed').textContent = (p.v / 7).toFixed(1) + ' nœuds';
      document.getElementById('sh-sail').textContent = SAIL_LABELS[p.sail] + (Game.buff('vent') ? ' · vent favorable' : '');
      const gl = document.getElementById('gunL'), gr = document.getElementById('gunR');
      const pl = 1 - p.rl / Math.max(0.01, p.rlMax || p.reload), pr2 = 1 - p.rr / Math.max(0.01, p.rrMax || p.reload);
      gl.style.setProperty('--p', Math.round(U.clamp(p.rl > 0 ? pl : 1, 0, 1) * 100) + '%'); gl.classList.toggle('ready', p.rl <= 0);
      gr.style.setProperty('--p', Math.round(U.clamp(p.rr > 0 ? pr2 : 1, 0, 1) * 100) + '%'); gr.classList.toggle('ready', p.rr <= 0);
      // commandes tactiles : l'anneau des boutons de feu montre le rechargement
      if (!this.el.touch.hidden) {
        if (!this.fireBt) this.fireBt = [this.el.touch.querySelector('[data-act=fireL]'), this.el.touch.querySelector('[data-act=fireR]')];
        this.fireBt[0].style.setProperty('--p', gl.style.getPropertyValue('--p')); this.fireBt[0].classList.toggle('ready', p.rl <= 0);
        this.fireBt[1].style.setProperty('--p', gr.style.getPropertyValue('--p')); this.fireBt[1].classList.toggle('ready', p.rr <= 0);
        if ((this.hudTick || 0) % 15 === 0) this.el.touch.style.bottom = document.body.classList.contains('portrait') ? (this.el.seahud.offsetHeight + 14) + 'px' : '';
      }
      const dest = SeaScene.dest ? PORT[SeaScene.dest] : null;
      let dtxt = '';
      if (dest) {
        const pp = World.ports.find(q => q.id === dest.id), d = Math.hypot(pp.x - p.x, pp.y - p.y);
        const days = Math.max(1, Math.round(d * 1.15 / Math.max(20, p.speedMax * 0.85) * DAYS_PER_SEC));
        dtxt = `Cap sur ${dest.name} · ~${days} j` + (SeaScene.auto ? ' · pilote auto' : ' · barre manuelle');
      }
      if (SeaScene.combat) dtxt = 'Combat ! ' + (Input.touch ? 'Visez de flanc et tirez.' : `${Input.label('KeyQ')}/${Input.label('KeyE')} ou clic : bordées · Espace : feu`);
      const de = document.getElementById('sh-dest');
      if (de.textContent !== dtxt) de.textContent = dtxt;
      document.getElementById('bt-auto').classList.toggle('on', SeaScene.auto);
      document.getElementById('bt-fast').classList.toggle('on', SeaScene.fast);
      document.getElementById('tc-board').hidden = !(SeaScene.prompt && SeaScene.prompt.kind === 'board');
      const pr = SeaScene.prompt;
      this.setPrompt(pr ? `${pr.text}` : null, pr && !Input.touch ? pr.key : null, () => {
        if (!pr) return;
        if (pr.kind === 'board') { const t = SeaScene.boardTarget(); if (t) Bus.emit('board', t); }
        else if (pr.kind === 'dock') SeaScene.dock(pr.pid);
        else if (pr.kind === 'dig') SeaScene.dig(pr.tr);
      });
      this.hudTick = (this.hudTick || 0) + 1;
      if (this.hudTick % 20 === 0) this.renderHud();
      if (this.hudTick % 90 === 0) this.renderObjectives();
    } else if (mode === 'port') {
      const n = PortScene.near;
      if (n && !this.isOpen()) this.setPrompt(n.type === 'quai' ? 'Appareiller' : 'Entrer : ' + bldName(n.type), Input.touch ? null : '↑', () => PortScene.open(n));
      else this.setPrompt(null);
    }
  },
  setPrompt(text, key, action) {
    const p = this.el.prompt;
    if (!text || this.isOpen()) { if (!p.hidden) p.hidden = true; this.promptAction = null; return; }
    const html = (key ? `<kbd>${key}</kbd>` : '') + text;
    this.promptTick = (this.promptTick || 0) + 1;
    if (p.innerHTML !== html || p.hidden || this.promptTick % 20 === 0) {
      if (p.innerHTML !== html) p.innerHTML = html;
      // au-dessus de la barre du port ou du HUD de mer, quelle que soit leur hauteur
      const below = this.mode === 'port' ? this.el.portbar : this.el.seahud;
      const hgt = below && !below.hidden ? below.offsetHeight : 0;
      const touchSea = this.mode === 'sea' && !this.el.touch.hidden;
      p.classList.toggle('top', touchSea);
      p.style.bottom = touchSea ? '' : (hgt + 18) + 'px';
    }
    p.hidden = false;
    this.promptAction = action;
  },

  // ── Maison de jeu (en mer de Chine : le fan-tan) ──
  fantan() {
    const r = Game.run;
    const body = h('div', { class: 'fantan-body' });
    this.open({ title: bldName('jeu'), sub: TXT.game.sub, icon: 'jeu', cls: 'narrow', body });
    const [cv, cx] = makeLayer(160, 80, Math.min(4, (window.devicePixelRatio || 1) * 2.8));
    cv.className = 'fantan-cv';
    let pick = 1, bet = Math.min(100, Math.max(10, Math.floor(r.cash / 10) || 10)), busy = false, last = null;
    const bean = (x, y, rot, a) => {
      cx.save(); cx.translate(x, y); cx.rotate(rot); cx.globalAlpha = a == null ? 1 : a;
      cx.fillStyle = 'rgba(0,0,0,0.3)'; Gfx.ellipse(cx, 0.5, 0.8, 1.7, 1.1); cx.fill();
      cx.fillStyle = Gfx.lin(cx, -1.6, -1, 1.6, 1, [[0, '#fbf1d6'], [1, '#cdb58a']]); Gfx.ellipse(cx, 0, 0, 1.7, 1.1); cx.fill();
      cx.restore();
    };
    const drawBeans = (n, removed, cover) => {
      const felt = cx.createRadialGradient(60, 40, 6, 70, 40, 110);
      felt.addColorStop(0, '#2f7a4c'); felt.addColorStop(1, '#154a30');
      cx.fillStyle = felt; cx.fillRect(0, 0, 160, 80);
      cx.strokeStyle = 'rgba(232,181,74,0.7)'; cx.lineWidth = 0.6; Gfx.rr(cx, 4, 4, 152, 72, 6); cx.stroke();
      cx.strokeStyle = 'rgba(232,181,74,0.35)'; cx.beginPath(); cx.arc(40, 40, 32, 0, TAU); cx.stroke();
      const rng = new RNG(n * 7 + 1);
      for (let i = 0; i < n; i++) {
        const x = 40 + rng.range(-26, 26), y = 40 + rng.range(-22, 22), rot = rng.range(0, TAU);
        if (i < removed) { bean(112 + (i % 12) * 3.4, 12 + Math.floor(i / 12) * 4.6, rot, 0.7); continue; }
        bean(x, y, rot);
      }
      if (cover) {
        cx.fillStyle = 'rgba(0,0,0,0.35)'; Gfx.ellipse(cx, 42, 43, 30, 28); cx.fill();
        const dome = cx.createRadialGradient(32, 28, 4, 40, 40, 32);
        dome.addColorStop(0, '#f2cf7a'); dome.addColorStop(0.5, '#b9832a'); dome.addColorStop(1, '#6a4512');
        cx.fillStyle = dome; cx.beginPath(); cx.arc(40, 40, 29, 0, TAU); cx.fill();
        cx.strokeStyle = 'rgba(255,240,200,0.5)'; cx.lineWidth = 0.6; cx.beginPath(); cx.arc(40, 40, 22, 0, TAU); cx.stroke();
        cx.fillStyle = '#6a4512'; cx.beginPath(); cx.arc(40, 40, 4, 0, TAU); cx.fill();
      }
    };
    drawBeans(30, 0, true);
    const render = () => {
      const max = Math.max(10, Math.min(r.cash, 5000));
      const slider = h('input', { type: 'range', min: 10, max, step: 10, value: Math.min(bet, max), id: 'ft-bet', 'aria-label': 'Mise' });
      const out = h('b', { class: 'num' }, fmt(bet));
      slider.addEventListener('input', () => { bet = +slider.value; out.textContent = fmt(bet); });
      put(body, cv,
        h('div', { class: 'row', style: { justifyContent: 'center' } }, ...[1, 2, 3, 4].map(k => btn(String(k), () => { pick = k; render(); }, pick === k ? 'jade' : ''))),
        h('div', { class: 'row', style: { margin: '10px 0' } }, 'Mise', slider, out),
        h('div', { class: 'row', style: { justifyContent: 'center' } }, btn(busy ? 'Le croupier compte…' : `Jouer ${fmt(bet)} sur le ${pick}`, () => play(), 'gold', busy || r.cash < 10 ? { disabled: true } : null)),
        last ? h('p', { class: 'flavor', style: { marginTop: '10px' } }, last) : null,
        h('p', { class: 'hint' }, 'Gain : trois fois la mise, moins 5 % de commission pour la maison.'));
    };
    const play = () => {
      if (busy) return;
      const res = Game.fantan(Math.min(bet, r.cash), pick);
      if (!res) return;
      busy = true; render();
      let removed = 0;
      const target = res.beans - res.rem;
      drawBeans(res.beans, 0, false);
      const step = () => {
        if (removed < target) {
          removed = Math.min(target, removed + 4);
          drawBeans(res.beans, removed, false);
          Sound.sfxPlay('bean');
          setTimeout(step, 90);
        } else {
          busy = false;
          last = res.win ? `Reste ${res.rem} ! Vous gagnez ${monnaie(res.delta)}.` : `Reste ${res.rem}… Vous perdez ${monnaie(-res.delta)}.`;
          Sound.sfxPlay(res.win ? 'cash' : 'error');
          this.after(); render();
        }
      };
      setTimeout(step, 400);
    };
    render();
  },

  // ════════════ Carte marine ════════════
  chart(departing) {
    const r = Game.run;
    const body = h('div');
    const here = departing ? r.port : null;
    let sel = departing ? (this.lastDest && this.lastDest !== here ? this.lastDest : null) : SeaScene.dest;
    let food = true;
    const entry = this.open({ title: departing ? 'Appareiller' : TXT.chartTitle, sub: departing ? 'Choisissez votre destination sur la carte' : (Input.touch ? 'Touchez' : 'Cliquez') + ' un port pour y mettre le cap', icon: 'map', cls: 'wide chartp', body });
    const CS = World.chartScale || 1;
    // une mer en paysage (Méditerranée…) : la carte au-dessus du panneau, à ses proportions
    const land = World.GW > World.GH, ar = World.GW / World.GH;
    const cv = h('canvas', { class: 'chart-cv', width: World.GW * CS, height: World.GH * CS, style: land ? { aspectRatio: `${World.GW} / ${World.GH}`, height: 'auto', width: `min(100%, calc(58vh * ${ar.toFixed(3)}))` } : null });
    const side = h('div', { class: 'chart-side' });
    body.append(h('div', { class: 'chart-wrap' + (land ? ' land' : '') }, cv, side));
    const ctx = cv.getContext('2d');
    const pos = departing ? World.ports.find(p => p.id === here) : SeaScene.player;
    const INK = '#27486a', RED = '#c8402a';
    let LS = 1;   // carte affichée en petit (téléphone, ou carte en paysage) : repères et noms grossis
    const small = land || UI.isMobile();
    const draw = () => {
      LS = small && cv.clientWidth ? U.clamp(0.72 * cv.width / cv.clientWidth, 1, 1.9) : 1;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(World.chart, 0, 0);
      ctx.setTransform(CS, 0, 0, CS, 0, 0);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const C = WORLD.CELL;
      // graticule tous les 5 degrés
      ctx.strokeStyle = 'rgba(39,72,106,0.13)'; ctx.lineWidth = 0.6;
      ctx.font = `600 8px ${FONT_UI}`; ctx.fillStyle = 'rgba(39,72,106,0.55)';
      const GR = SEA.world.chart;
      for (let lon = GR.lon[0]; lon <= GR.lon[1]; lon += GR.step) { const x = lonX(lon) / C; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, World.GH); ctx.stroke(); ctx.textAlign = 'left'; ctx.fillText(Math.abs(lon) + '°' + (lon < 0 ? 'O' : 'E'), x + 2, World.GH - 4); }
      for (let lat = GR.lat[0]; lat <= GR.lat[1]; lat += GR.step) { const y = latY(lat) / C; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(World.GW, y); ctx.stroke(); ctx.textAlign = 'left'; ctx.fillText(Math.abs(lat) + '°' + (lat < 0 ? 'S' : 'N'), 3, y - 2); }
      // rose des vents et lignes de rhumb
      const [rx, ry] = GR.rose;
      ctx.strokeStyle = 'rgba(39,72,106,0.12)'; ctx.lineWidth = 0.6;
      for (let k = 0; k < 16; k++) { const a = k * TAU / 16; ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx + Math.cos(a) * 900, ry + Math.sin(a) * 900); ctx.stroke(); }
      ctx.fillStyle = 'rgba(243,235,218,0.85)'; ctx.beginPath(); ctx.arc(rx, ry, 13, 0, TAU); ctx.fill();
      for (let k = 0; k < 8; k++) {
        const a = k * TAU / 8 - Math.PI / 2, L = k % 2 ? 11 : 20, wv = k % 2 ? 2.4 : 3.6;
        ctx.save(); ctx.translate(rx, ry); ctx.rotate(a);

      // route

        const path = this.routeCache && this.routeCache.key === (Math.round(pos.x) + ',' + Math.round(pos.y) + sel) ? this.routeCache.path : null;
        const pth = path || World.findPath(pos.x, pos.y, dp.x, dp.y);
        this.routeCache = { key: Math.round(pos.x) + ',' + Math.round(pos.y) + sel, path: pth };
        if (pth) {
          const trace = () => { ctx.beginPath(); pth.forEach((p, i) => (i ? ctx.lineTo(p[0] / C, p[1] / C) : ctx.moveTo(p[0] / C, p[1] / C))); };

        const isSel = p.id === sel, isHere = p.id === here;
        if (isSel) { ctx.fillStyle = 'rgba(200,64,42,0.18)'; ctx.beginPath(); ctx.arc(x, y, 12 * LS, 0, TAU); ctx.fill(); }
        ctx.fillStyle = isHere ? '#237a60' : isSel ? RED : INK;
        ctx.beginPath(); ctx.arc(x, y, (isSel ? 6 : 4.6) * LS, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#f7f1e3'; ctx.lineWidth = 1.6; ctx.stroke();
        if (Game.portClosed(p.id)) {
          const c9 = 9 * LS, cross = () => { ctx.beginPath(); ctx.moveTo(x - c9, y - c9); ctx.lineTo(x + c9, y + c9); ctx.moveTo(x + c9, y - c9); ctx.lineTo(x - c9, y + c9); ctx.stroke(); };

        }
        ctx.font = `${isSel ? 800 : 700} ${13 * LS}px ${FONT_TITLE}`;
        const lb = P.label || {};

        // noms grossis (petite carte) : un nom qui sortirait du cadre passe de l'autre côté de son point
        if (LS > 1) { const tw = ctx.measureText(P.name).width + 9 * LS; if (left && x - tw < 2) left = false; else if (!left && x + tw > World.GW - 2) left = true; }
        ctx.textAlign = left ? 'right' : 'left';
        ctx.lineWidth = 3.4; ctx.strokeStyle = 'rgba(243,235,218,0.92)';

        ctx.save(); ctx.translate(pos.x / C, pos.y / C); ctx.rotate(departing ? 0 : SeaScene.player.a); if (LS !== 1) ctx.scale(LS, LS);
        ctx.fillStyle = '#237a60'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4;

    const renderSide = () => {
      const kids = [];

        const path = this.routeCache && this.routeCache.path;
        const L = path ? World.pathLength(path) : Math.hypot(dp.x - pos.x, dp.y - pos.y) * 1.3;
        const sp = Game.stats() ? Game.stats().speed : 58;
        const days = Math.max(1, Math.round(L / (sp * 0.82) * DAYS_PER_SEC));
        let danger = 0;
        if (path) { let n = 0; for (let i = 0; i < path.length; i++) { danger += World.danger(path[i][0], path[i][1]); n++; } danger /= Math.max(1, n); }
        const dl = danger > 0.45 ? ['Élevé', 'red'] : danger > 0.25 ? ['Moyen', 'gold'] : ['Faible', 'jade'];
        kids.push(h('div', { class: 'card' },

        if (k) {
          kids.push(h('div', { class: 'card prices' }, h('div', { class: 'd' }, k.live ? 'Prix en direct (informateurs)' : `Prix vus il y a ${Math.round(r.day - k.day)} j`),
            ...GOODS.map((g, gi) => h('div', { class: 'stat' }, h('span', null, ico(g.id, 'sm'), ' ', g.name), h('b', null, fmt(k.p[gi]))))));
        } else kids.push(h('p', { class: 'hint' }, 'Prix inconnus : jamais visité.'));
        const cs = r.contracts.filter(c => c.to === sel);
        if (cs.length) kids.push(h('div', { class: 'card' }, h('div', { class: 'd' }, 'Contrats pour ce port :'), ...cs.map(c => h('div', { class: 'd' }, '• ' + Game.contractText(c)))));

          const s = r.ship, st = Game.stats();

  // ════════════ Abordage ════════════
  boarding(enemy) {
    const r = Game.run, st = Game.stats();
    const body = h('div');
    const entry = this.open({ title: 'À l\'abordage !', sub: enemy.surrendered ? 'Le navire s\'est rendu' : `${enemy.name} · ${enemy.crew} hommes`, icon: 'sword', closable: false, sticky: true, body });
    const kb = Math.min(4, (window.devicePixelRatio || 1) * 2.8);
    const [cv, cx] = makeLayer(240, 80, kb);
    cv.className = 'board-cv';
    const res = SeaScene.resolveBoarding(enemy);
    const ps = ShipSide.get(st.style, st.len * 2, Game.playerScheme(), Game.sailScheme(), kb);
    const es = ShipSide.get(enemy.style, enemy.len * 2, enemy.scheme, null, kb);
    let t = 0;
    const bar = h('div', { class: 'duel-bar' });
    const fill = h('div', { class: 'duel-fill' });
    bar.append(fill);
    const info = h('p', { class: 'flavor' }, `Vos ${SeaScene.player.crew} marins contre ${enemy.crew} ${enemy.surrendered ? 'hommes démoralisés' : 'pirates'}…`);
    body.append(cv, bar, info);
    const ratio = res.P / (res.P + res.E);
    Sound.sfxPlay('shout');
    const anim = (dt) => {
      t += dt;
      cx.fillStyle = Gfx.lin(cx, 0, 0, 0, 80, [[0, '#f0b98a'], [0.55, '#8fb4c9'], [0.8, '#2f7fa3'], [1, '#1b4f7a']]); cx.fillRect(0, 0, 240, 80);
      cx.drawImage(ps.c, 28 - ps.x0, 66 - ps.wl, ps.W, ps.H);
      cx.save(); cx.translate(232, 0); cx.scale(-1, 1); cx.drawImage(es.c, 28 - es.x0, 66 - es.wl, es.W, es.H); cx.restore();
      cx.fillStyle = Gfx.lin(cx, 0, 64, 0, 80, [[0, 'rgba(47,127,163,0.75)'], [1, 'rgba(27,79,122,0.95)']]); cx.fillRect(0, 65, 240, 15);
      cx.strokeStyle = 'rgba(230,244,246,0.6)'; cx.lineWidth = 0.5; cx.lineCap = 'round'; cx.beginPath();
      for (let i = 0; i < 12; i++) { const wx = (i * 29 + t * 20) % 250 - 10, wy = 68 + (i % 3) * 4; cx.moveTo(wx, wy); cx.lineTo(wx + 7, wy); }
      cx.stroke();
      for (let i = 0; i < 7; i++) if (Math.random() < 0.55) Gfx.glow(cx, 100 + Math.random() * 40, 28 + Math.random() * 26, 2.2 + Math.random() * 2, Math.random() < 0.5 ? '#fff4d8' : '#ffb347', 0.95);
      if (Math.random() < 0.25) { cx.globalAlpha = 0.35; cx.drawImage(Gfx.soft('#d8d8e0'), 104 + Math.random() * 30, 20 + Math.random() * 20, 18, 18); cx.globalAlpha = 1; }
      const k = U.clamp(t / 2.2, 0, 1);
      const cur = 0.5 + (res.win ? 1 : -1) * Math.abs(ratio - 0.5) * U.easeOut(k) + Math.sin(t * 9) * 0.06 * (1 - k);
      fill.style.width = Math.round(U.clamp(res.win ? Math.max(cur, 0.5 + 0.5 * U.easeOut(k)) : Math.min(cur, 0.5 - 0.5 * U.easeOut(k)), 0.02, 0.98) * 100) + '%';
      if (Math.random() < 0.15) Sound.sfxPlay('swords', { vol: 0.5 });
      if (t < 2.4) return false;
      done();
      return true;
    };
    const done = () => {
      SeaScene.applyBoarding(enemy, res);
      if (!res.win) {
        info.textContent = `Repoussés ! ${res.lost} marins perdus.`;
        entry.panel.querySelector('.panel-in').append(h('div', { class: 'panel-foot' }, btn('Reprendre le combat', () => this.close(entry), 'red')));
        return;
      }
      Sound.sfxPlay('cash');
      const gold = enemy.gold;
      r.cash += gold; r.stats.loot += gold;
      info.textContent = `Victoire ! ${res.lost ? res.lost + ' marins perdus. ' : ''}Vous saisissez ${monnaie(gold)}.`;
      const cargo = enemy.cargo || zeros();
      const list = h('div', { class: 'stack' });
      const renderLoot = () => {
        put(list, h('div', { class: 'hint' }, `Cale libre : ${Game.free()} ${TXT.unit}`),
          ...GOODS.map((g, gi) => cargo[gi] > 0 ? h('div', { class: 'row sb stat' }, h('span', null, ico(g.id), ` ${cargo[gi]} ${g.name.toLowerCase()}`),
            btn('Prendre', () => { const n = Math.min(cargo[gi], Game.free()); r.cargo[gi] += n; cargo[gi] -= n; Sound.sfxPlay('coin'); renderLoot(); this.refresh(); }, 'sm jade', Game.free() <= 0 ? { disabled: true } : null)) : null));
      };
      renderLoot();
      body.append(h('h4', null, 'CARGAISON SAISIE'), list);
      entry.panel.querySelector('.panel-in').append(h('div', { class: 'panel-foot' },
        btn('Tout prendre', () => { GOODS.forEach((g, gi) => { const n = Math.min(cargo[gi], Game.free()); r.cargo[gi] += n; cargo[gi] -= n; }); Sound.sfxPlay('coin'); renderLoot(); this.refresh(); }, 'gold'),
        btn('Saborder et repartir', () => { this.close(entry); Game.checkTitle(); }, 'jade')));
    };
    this.anim(anim);
  },

  // ════════════ Écran titre & méta ════════════
  title() {
    this.closeAll();
    this.hideTitle();
    this.showHud('title');
    const m = Game.meta;
    const has = Game.hasSave();
    const dk = dailyKey();
    const dailyBest = m.daily[dk];
    // sélecteur de mer : affiché dès qu'une extension est installée
    const seas = Seas.list();
    const pick = seas.length < 2 ? null : h('div', { class: 'sea-pick', role: 'group', 'aria-label': 'Choisir la mer' },
      seas.map(id => {
        const d = SEA_DEFS[id], on = id === Seas.current, own = Unlocks.owned(id);
        return btn([h('b', null, d.name), h('small', null, own ? d.yearLabel : 'à débloquer')], () => Main.setSea(id), 'sm' + (on ? ' on' : '') + (own ? '' : ' locked'), { 'aria-pressed': on ? 'true' : 'false' });
      }));
    const root = h('div', { class: 'title-screen' + (pick ? ' multi' : '') },
      h('div', { class: 't-brand' },
        h('p', { class: 't-eyebrow' }, TXT.eyebrow),
        h('h1', { class: 'logo' }, 'Mers de ', h('span', null, 'Jade'), h('i', { class: 't-seal', 'aria-hidden': 'true' }, '翡翠海')),
        h('p', { class: 'tagline' }, TXT.tagline)),
      pick,
      h('div', { class: 'menu' },
        has ? btn('Continuer', () => { root.remove(); Main.continueRun(); }, 'jade big') : null,
        btn('Nouvelle carrière', () => this.newGame('career'), has ? 'big' : 'jade big'),
        btn(`Défi du jour${dailyBest != null ? ' · record ' + fmtShort(dailyBest) : ''}`, () => this.newGame('daily'), 'gold-line'),
        h('div', { class: 'row menu-sub' },
          btn('Héritage', () => this.heritage(), 'sm ghost'), btn('Hauts faits', () => this.achievements(), 'sm ghost'), btn('Records', () => this.records(), 'sm ghost'), btn('Options', () => this.options(), 'sm ghost'), btn('Aide', () => this.help(), 'sm ghost'))),
      h('div', { class: 'row t-stats' },
        h('div', { class: 'jade-count' }, ico('jade'), `${m.jade} ${TXT.tokens}`),
        m.best > 0 ? h('div', { class: 'jade-count gold' }, ico('coin'), `Record ${fmtShort(m.best)} ${TXT.money} · ${TITLES[titleIndex(m.best)].name}`) : null),
      h('div', { class: 'foot-note' }, 'Hommage à Tai-Pan (Ocean, 1986). Jeu original : code, illustrations et musique générés.'));
    this.titleRoot = root;
    this.el.modal.append(root);
  },
  hideTitle() { if (this.titleRoot) { this.titleRoot.remove(); this.titleRoot = null; } },
  newGame(mode) {
    // toujours ouvrir par-dessus l'écran titre, pour qu'« Annuler » ramène au menu
    if (!this.titleRoot && Main.sceneName === 'title') this.title();
    const go = () => {
      const cap = h('input', { type: 'text', value: R.pick(CAPTAIN_NAMES), maxlength: 24, id: 'ng-cap', 'aria-label': 'Nom du capitaine' });
      const ship = h('input', { type: 'text', value: R.pick(SHIP_NAMES), maxlength: 24, id: 'ng-ship', 'aria-label': 'Nom du navire' });
      const intro = h('div', { class: 'stack intro' }, ...INTRO_TEXT.map((t, i) => h('p', { class: i === 0 ? 'intro-date' : '' }, t)));
      const her = HERITAGE.filter(x => Game.her(x.id) > 0);
      const body = h('div', null, intro,
        mode === 'daily' ? h('p', { class: 'pill gold' }, `Défi du jour ${dailyKey()} : mêmes prix, mêmes événements pour tout le monde.`) : null,
        her.length ? h('p', { class: 'hint' }, 'Héritage actif : ' + her.map(x => `${x.name} ${Game.her(x.id)}`).join(', ')) : null,
        h('div', { class: 'cards', style: { marginTop: '10px' } },
          h('label', { class: 'stack' }, h('span', { class: 'hint' }, 'Votre nom'), cap),
          h('label', { class: 'stack' }, h('span', { class: 'hint' }, 'Nom de votre futur navire'), ship)));
      const entry = this.open({
        title: mode === 'daily' ? 'Défi du jour' : 'Nouvelle carrière', icon: 'scroll', body,
        foot: [btn('Annuler', () => this.close(entry)), btn('Lever l\'ancre', () => {
          const o = { captain: cap.value.trim() || 'Capitaine', shipName: ship.value.trim() || 'Hirondelle', mode };
          if (mode === 'daily') { o.dailyKey = dailyKey(); o.seed = Game.dailySeed(o.dailyKey); }
          this.closeAll(); this.hideTitle();
          Main.startRun(o);
        }, 'jade big')],
      });
    };
    if (Game.hasSave()) {
      this.confirm('Nouvelle partie', 'Une carrière est en cours. La commencer à nouveau l\'effacera.', 'Recommencer', 'Annuler', true).then(ok => { if (ok) go(); });
    } else go();
  },
  heritage() {
    const body = h('div');
    const entry = this.open({ title: 'Héritage', sub: 'Chaque carrière prépare la suivante', icon: 'jade', cls: 'wide', body });
    const render = () => {
      const m = Game.meta;
      const cards = h('div', { class: 'cards' });
      for (const x of HERITAGE) {
        const lvl = Game.her(x.id), cost = x.costs[lvl];
        cards.append(h('div', { class: 'card' + (lvl ? ' sel' : '') },
          h('h5', null, x.name), h('div', { class: 'd' }, x.desc),
          h('div', { class: 'row sb' }, h('span', { class: 'lvl' }, ...x.costs.map((_, i) => h('i', { class: i < lvl ? 'on' : '' }))),
            cost == null ? h('span', { class: 'pill jade' }, 'Complet') : btn([ico('jade', 'sm'), ' ' + cost], () => { if (Game.buyHeritage(x.id)) { Sound.sfxPlay('levelup'); render(); } }, 'sm jade', m.jade < cost ? { disabled: true } : null))));
      }
      const sails = h('div', { class: 'cards' });
      const g = Game.global;
      for (const s of SAIL_COLORS) {
        const own = g.sails.includes(s.id);
        sails.append(h('div', { class: 'card' + (g.sail === s.id ? ' sel' : '') },
          h('div', { class: 'swatch', style: { background: `linear-gradient(90deg, ${s.sail} 72%, ${s.trim} 72%)` } }),
          h('h5', null, s.name),
          g.sail === s.id ? h('span', { class: 'pill jade' }, 'Hissées') : btn(own ? 'Hisser' : [ico('jade', 'sm'), ' ' + s.cost], () => { if (Game.buySail(s.id)) { ShipTop.cache.clear(); ShipSide.cache.clear(); Sound.sfxPlay('coin'); render(); } }, 'sm', !own && m.jade < s.cost ? { disabled: true } : null)));
      }
      put(body, h('div', { class: 'row', style: { marginBottom: '10px' } }, h('span', { class: 'jade-count' }, ico('jade'), `${m.jade} ${TXT.tokens}`), h('span', { class: 'hint' }, 'Gagnés à chaque fin de carrière selon votre fortune, et avec les hauts faits.')),
        cards, h('h4', { style: { marginTop: '14px' } }, 'COULEURS DES VOILES'), sails);
    };
    render();
    return entry;
  },
  achievements() {
    const m = Game.meta;
    const n = Object.keys(m.ach).length;
    const cards = h('div', { class: 'cards' }, ...ACHIEVEMENTS.map(a => {
      const got = m.ach[a.id];
      return h('div', { class: 'card' + (got ? ' sel' : ' locked') }, h('h5', null, ico(got ? 'star' : 'skull', 'sm'), ' ', a.name), h('div', { class: 'd' }, a.desc), h('div', { class: 'row sb' }, h('span', { class: 'pill jade' }, ico('jade', 'sm'), ' ' + a.jade), got ? h('span', { class: 'hint' }, new Date(got).toLocaleDateString('fr-FR')) : null));
    }));
    this.open({ title: 'Hauts faits', sub: `${n} / ${ACHIEVEMENTS.length} accomplis`, icon: 'star', cls: 'wide', body: cards });
  },
  records() {
    const m = Game.meta;
    const rows = m.records.map((x, i) => h('tr', null, h('td', null, i + 1), h('td', { class: 'r' }, fmt(x.worth)), h('td', null, x.title), h('td', null, x.captain), h('td', null, x.ship), h('td', null, x.mode === 'daily' ? 'Défi' : 'Carrière'), h('td', { class: 'hint' }, new Date(x.when).toLocaleDateString('fr-FR'))));
    const body = m.records.length ? h('div', { style: { overflowX: 'auto' } }, h('table', { class: 'ledger' }, h('thead', null, h('tr', null, ...['#', 'FORTUNE', 'TITRE', 'CAPITAINE', 'NAVIRE', 'MODE', 'DATE'].map((t, i) => h('th', { class: i === 1 ? 'r' : '' }, t)))), h('tbody', null, rows)))

  endScreen(res) {
    this.closeAll();
    this.showHud('title');
    const r = res.run;
    const titles = { end: TXT.yearEnd, naufrage: 'Naufrage', retire: 'Retraite' };
    const worthEl = h('div', { class: 'bigworth' }, '0');
    const line = (a, b, cls) => h('tr', null, h('td', null, a), h('td', { class: 'r ' + (cls || '') }, fmt(b)));
    let wares = 0; for (const k in r.ware) wares += Game.cargoValue(r.ware[k]);
    const body = h('div', null,
      h('div', { class: 'seal' }, TXT.supremeSeal && res.ti >= TITLES.findIndex(t => t.supreme) ? h('span', { class: 'seal-zh' }, TXT.supremeSeal) : null, TITLES[res.ti].name),
      worthEl,
      h('p', { style: { textAlign: 'center' } }, `${r.captain} · ${r.shipName} · ${fmtDate(Math.min(r.day, r.endDay - 0.01))}`),
      res.isBest ? h('p', { class: 'pill gold', style: { display: 'flex', justifyContent: 'center' } }, 'NOUVEAU RECORD PERSONNEL !') : h('p', { class: 'hint', style: { textAlign: 'center' } }, `Record personnel : ${monnaie(Game.meta.best)}`),
      res.dailyBest ? h('p', { class: 'pill jade', style: { display: 'flex', justifyContent: 'center' } }, 'Meilleur score du défi du jour !') : null,
      h('table', { class: 'ledger' }, h('tbody', null,
        line(`${TXT.Money} à bord`, r.cash), line('En banque', r.bank), line(`Dette envers ${TXT.lender}`, -r.debt, r.debt > 0 ? 'neg' : ''),
        line('Navire et canons', Game.shipValue(r.ship)), line('Cargaison', Game.cargoValue(r.cargo)), line('Entrepôts', wares))),
      r.lostAtSea ? h('p', { class: 'flavor', style: { marginTop: '8px' } }, `Englouti avec le navire : ${monnaie(r.lostAtSea.cash)} à bord, ${fmt(r.lostAtSea.cargo)} de cargaison et un navire estimé à ${fmt(r.lostAtSea.ship)}. Seuls la banque et les entrepôts comptent.`) : null,
      h('h4', null, 'RÉCOMPENSES'),
      h('div', { class: 'row' }, h('span', { class: 'pill jade' }, ico('jade', 'sm'), ` +${res.jadeEarned} ${TXT.tokens}`), ...r.achRun.map(id => h('span', { class: 'pill gold' }, ico('star', 'sm'), ' ' + ACH_BY_ID[id].name))),
      (() => {
        const m = Game.meta;
        const can = HERITAGE.filter(x => { const c = x.costs[Game.her(x.id)]; return c != null && c <= m.jade; });
        if (!can.length) {
          const next = HERITAGE.map(x => ({ x, c: x.costs[Game.her(x.id)] })).filter(o => o.c != null).sort((a, b) => a.c - b.c)[0];
          return next ? h('p', { class: 'hint', style: { marginTop: '8px' } }, `Encore ${next.c - m.jade} ${TXT.tokens} pour « ${next.x.name} ».`) : null;
        }
        return h('div', { class: 'mk-foot jade-note' }, ico('jade'), h('span', { style: { flex: 1 } }, `Avec ${m.jade} jetons, vous pouvez débloquer : ${can.slice(0, 3).map(x => x.name).join(', ')}${can.length > 3 ? '…' : ''}`), btn('Héritage', () => this.heritage(), 'jade sm'));
      })(),
      h('p', { class: 'hint', style: { marginTop: '8px' } }, `Escales ${r.stats.voyages} · pirates vaincus ${r.stats.sunk} · bénéfices ${monnaie(r.stats.profit)} · contrats ${r.stats.contracts}`));
    this.open({
      title: titles[res.reason] || 'Fin de carrière', sub: res.reason === 'naufrage' ? 'La mer a pris votre navire…' : TXT.endSub, icon: 'scroll', closable: false, sticky: true, body,
      foot: [btn('Héritage', () => this.heritage(), ''), btn('Menu', () => { this.closeAll(); this.title(); }, ''), btn('Nouvelle carrière', () => { this.closeAll(); this.title(); this.newGame('career'); }, 'jade')],
    });
    setTimeout(() => Sound.sfxPlay('stamp'), 500);
    let tt = 0;
    this.anim(dt => {
      tt += dt;
      const k = U.clamp(tt / 1.6, 0, 1);
      worthEl.textContent = monnaie(res.worth * U.easeOut(k));
      return k >= 1;
    });
  },

  // ════════════ Événements d'arrivée ════════════
  async arrivalEvents(list) {
    for (const ev of list) {
      if (ev.kind === 'toast') { this.toast(ev.t, ev.k); continue; }
      if (ev.kind === 'notice') { await this.choice(ev.title, ev.text, [{ label: ev.ok || 'Continuer', value: 1, cls: ev.cls || 'jade' }], ev.icon || 'scroll'); continue; }
      if (ev.kind === 'customs') {
        const r = Game.run;
        const v = await this.choice(TXT.customs, [`Les douaniers ${deLieu(PORT[r.port].name)} montent à bord pour inspecter votre cale. Vous transportez ${ev.n} ${TXT.crates}…`, `Un pot-de-vin de ${monnaie(ev.bribe)} leur ferait sans doute baisser les yeux.`],
          [{ label: 'Laisser fouiller', value: 'search' }, { label: `Soudoyer (${fmt(ev.bribe)})`, value: 'bribe', cls: 'gold', disabled: r.cash < ev.bribe }], 'debt');
        const res = Game.resolveCustoms(ev, v);
        this.toast(res.t, res.ok ? 'good' : 'bad');
        Sound.sfxPlay(res.ok ? 'coin' : 'error');
      } else if (ev.kind === 'wang') {
        const res = Game.wangVisit();
        await this.choice(capFirst(TXT.men), [TXT.usurer.visit, `Ils prennent ${monnaie(res.take)}${res.hurt ? ` et ${res.hurt} de vos marins ne se relèveront pas de sitôt` : ''}.`], [{ label: 'Encaisser', value: 1, cls: 'red' }], 'usurier');
        Sound.sfxPlay('hit');
      } else if (ev.kind === 'emissary') {
        const r = Game.run;
        const v = await this.choice(TXT.emissary.title, [TXT.emissary.text, `${monnaie(ev.cost)} pour 60 jours de tranquillité face aux pirates.`],
          [{ label: 'Refuser', value: false }, { label: `Payer ${fmt(ev.cost)}`, value: true, cls: 'gold', disabled: r.cash < ev.cost }], 'skull');
        if (v && Game.payProtection(ev.cost)) { this.toast(TXT.emissary.paid, 'gold'); Sound.sfxPlay('coin'); }
      }
      this.refresh();
    }
    Game.saveRun();
  },
};

<script>
'use strict';
// ─── Mers de Jade · extension « La Sérénissime » : la Méditerranée, 1500 ───
// Fils d'un marchand vénitien ruiné, le joueur doit racheter le palais familial et viser le titre de Doge.
// Mécaniques propres : galères à rames (par calme plat, mais les rameurs mangent), peste qui ferme les ports
// et quarantaine de 40 jours au lazaret, galères d'État (la muda : place aux enchères, sûre mais chère),
// corsaires barbaresques (capture et rançon), hiver redoutable (mare clausum), mistral et bora.
(function () {

// ════════════ Règles propres ════════════
const med = () => Game.run.med;
const plagueAt = (pid, day) => med().plagues.find(p => p.p === pid && day >= p.start && day <= p.end) || null;
const infectedAt = (pid, day) => med().plagues.find(p => p.p === pid && day >= p.warn && day <= p.end) || null;
// patente brute connue : on vient d'un port où la peste couvait au départ, et elle y est désormais déclarée
function knownFoul() {
  const r = Game.run, b = r.med && r.med.bill;
  if (!b) return null;
  const pl = infectedAt(b.from, b.day);
  return pl && r.day >= pl.start ? pl : null;
}
const quarantineDays = () => [40, 20, 10][Math.min(2, Game.her('patente'))];
// le nom de l'entrepôt d'un port (« Fondaco », « Han »…)
const wareName = pid => (PORT[pid].signs && PORT[pid].signs.entrepot) || BUILDINGS.entrepot.name;
const captivityDays = () => [60, 45, 30][Math.min(2, Game.her('rachat'))];

// les épidémies de l'année : couvent deux semaines, puis ferment le port un à deux mois (jamais deux fois le même port)
function makePlagues(rng) {
  const w = { alexandrie: 3, constantinople: 3, alger: 2, candie: 1.5, raguse: 1, venise: 1, genes: 1, marseille: 1, barcelone: 1 };
  const out = [];
  for (let day = rng.range(35, 70); day < 330 && out.length < 5; day += rng.range(55, 95)) {
    const free = Object.keys(w).filter(k => !out.some(p => p.p === k) && (k !== 'venise' || day >= 60));
    const pid = rng.weighted(free, k => w[k]);
    const start = Math.round(day), dur = rng.int(35, 65);
    out.push({ p: pid, warn: start - 14, start, end: start + dur });
  }
  return out;
}
// la peste dérange les galères d'État : pas de départ d'un port infecté, arrivée repoussée à la réouverture
function plagueConvoys(convoys, plagues) {
  const hit = (pid, d, from) => plagues.find(p => p.p === pid && d >= from(p) && d <= p.end);
  const out = convoys.filter(c => !hit(c.from, c.dep, p => p.warn));
  for (const c of out) { const p = hit(c.to, c.arr, p => p.start); if (p) c.arr = p.end + 2; }
  return out;
}
// les galères d'État : départs de Venise et retours, tarif de base par tonneau
function makeConvoys(rng) {
  const plan = [['candie', 75, 12], ['constantinople', 100, 18], ['alexandrie', 130, 26], ['barcelone', 160, 18], ['constantinople', 190, 18], ['alexandrie', 225, 26], ['candie', 250, 12], ['marseille', 272, 18]];
  const out = [];
  for (const [to, dep0, base] of plan) {
    const days = Math.round(Game.travelDaysEst('venise', to) * 1.3) + rng.int(2, 5);
    const dep = dep0 + rng.int(-4, 4), cap = rng.int(260, 420);
    out.push({ from: 'venise', to, dep, arr: dep + days, cap, rival: Math.round(cap * rng.range(0.55, 0.85)), booked: 0, base });
    const back = dep + days + rng.int(10, 20), capB = rng.int(220, 380);
    out.push({ from: to, to: 'venise', dep: back, arr: back + days, cap: capB, rival: Math.round(capB * rng.range(0.55, 0.85)), booked: 0, base });
  }
  return out;
}
// place aux enchères : les concurrents réservent pendant le mois qui précède le départ ; plus c'est plein, plus c'est cher
const rivalAt = (c, day) => c.rival * U.smooth((day - (c.dep - 30)) / 30);
const convoySpace = (c, day) => Math.max(0, Math.floor(c.cap - rivalAt(c, day) - c.booked));
const convoyPrice = (c, day) => { const fill = U.clamp((rivalAt(c, day) + c.booked) / c.cap, 0, 1); return Math.round(c.base * (0.8 + 1.6 * fill * fill)); };
function bookConvoy(c, gi, n) {
  const r = Game.run, d = r.day, price = convoyPrice(c, d);
  n = Math.min(n, r.cargo[gi], convoySpace(c, d), Math.floor(r.cash / price));
  if (n <= 0) return 0;
  r.cash -= n * price; r.cargo[gi] -= n; if (r.cargo[gi] === 0) r.cost[gi] = 0;
  c.booked += n;
  med().freight.push({ to: c.to, g: gi, n, arr: c.arr, done: false });
  Game.log(`${n} ${GOODS[gi].name.toLowerCase()} confiés à la muda ${deLieu(PORT[c.to].name)} (${monnaie(n * price)}).`);
  return n;
}

// capture par les corsaires : cargaison et argent à bord perdus, une partie de l'équipage aux fers,
// le navire gardé au port d'Alger jusqu'à la rançon (med.captive : la captivité survit à un rechargement)
function capture(e) {
  const r = Game.run, M = med(), p = SeaScene.player;
  const crew = Math.max(3, Math.floor((p ? p.crew : r.ship.crew) * 0.4));
  if (p) p.crew = crew;
  r.ship.crew = crew;
  r.cash = 0; r.cargo = zeros(); r.cost = zeros();
  r.contracts = r.contracts.filter(c => c.type !== 'colis');
  M.captive = { by: e.named ? e.name : 'des corsaires barbaresques' };
  M.captures = (M.captures || 0) + 1;
  Game.log(`Capturé par ${M.captive.by} et emmené captif à Alger.`);
}
function ransom() {
  const v = (1500 + 0.1 * Math.max(0, Game.worth()) + 0.4 * Game.shipValue(Game.run.ship)) * (1 - 0.3 * Game.her('rachat'));
  return Math.round(v / 50) * 50;
}
const canPay = x => Game.run.cash + Game.run.bank + Game.loanMax() >= x;
// la rançon se paie avec l'argent en banque et, au besoin, une lettre de change de Zorzi
function payRansom() {
  const r = Game.run, x = ransom();
  if (!canPay(x)) return false;
  const need = x - r.cash - r.bank;
  if (need > 0) Game.borrow(Math.min(Game.loanMax(), Math.ceil(need / 100) * 100));
  let due = x;
  const c = Math.min(r.cash, due); r.cash -= c; due -= c;
  r.bank -= Math.min(r.bank, due);
  med().captive = null;
  Game.unlock('rachat');
  Game.log(`Rançon de ${monnaie(x)} payée : vous retrouvez votre navire à Alger.`);
  return true;
}
// la prise : navire et équipage emmenés à Alger (abordage perdu, ou navire désemparé par le canon)
function seize(e, sub) {
  capture(e);
  const S = SeaScene;
  S.over = true; S.capturedBy = e;
  S.alert('PRIS PAR LES CORSAIRES !', sub(capFirst(med().captive.by), e.named ? 'emmène' : 'emmènent'), 'red');
  Sound.play('defeat');
  setTimeout(() => Bus.emit('captured', { port: 'alger' }), 2400);
}
// sans rançon : le bagne, puis la confrérie vous rapatrie sur une vieille tartane (Venise, ou le premier port chrétien sain)
function serveCaptivity() {
  const r = Game.run, days = captivityDays();
  med().captive = null;
  r.ship = null;   // (pas de solde à verser pendant le bagne)
  Game.advance(days);
  const ns = Game.makeShip(SEA.start.rescueShip);
  ns.crew = 5; ns.food = 5 * 20;
  r.ship = ns;
  r.port = r.lastPort = ['venise', 'raguse', 'genes', 'candie', 'marseille', 'barcelone'].find(p => !Game.portClosed(p)) || 'venise';
  Game.unlock('rachat');
  Game.log(`${days} jours au bagne d'Alger, puis racheté par la confrérie et rapatrié à ${PORT[r.port].name}. Le navire est perdu.`);
  return days;
}

const rules = {
  onNewRun(run) {
    const rng = new RNG((run.seed ^ 0x9e57e) >>> 0);
    const plagues = makePlagues(rng);
    run.med = { plagues, convoys: plagueConvoys(makeConvoys(rng), plagues), freight: [], heard: [], bill: null, captive: null, captures: 0 };
  },
  onNewDay(d) {
    const r = Game.run, M = r && r.med;
    if (!M) return;
    for (const p of M.plagues) {
      if (d === p.start) Bus.emit('toast', { t: `La peste frappe ${PORT[p.p].name} ! Le port est fermé.`, k: 'bad' });
      else if (d === p.end + 1) Bus.emit('toast', { t: `La peste a quitté ${PORT[p.p].name} : le port rouvre.`, k: 'good' });
      else if (d === p.warn && Game.her('informateurs') >= 1) Bus.emit('toast', { t: `Les espions du Conseil des Dix signalent la peste à ${PORT[p.p].name} : elle frappera d'ici deux semaines.`, k: 'gold' });
    }
    for (const f of M.freight) {
      if (f.done || d < f.arr) continue;
      f.done = true;
      Game.ware(f.to)[f.g] += f.n;
      Bus.emit('toast', { t: `La muda est arrivée à ${PORT[f.to].name} : vos ${f.n} ${GOODS[f.g].name.toLowerCase()} attendent au ${wareName(f.to)}.`, k: 'gold' });
      Game.log(`La muda a livré ${f.n} ${GOODS[f.g].name.toLowerCase()} au ${wareName(f.to)} ${deLieu(PORT[f.to].name)}.`);
      Game.unlock('muda');
    }
  },
  onDepart(from) { med().bill = { from, day: Game.run.day }; },
  onArrive(pid, out) {
    const r = Game.run, M = med(), P = PORT[pid];
    if (M.bill && r.day - M.bill.day >= 10 && [11, 0, 1].includes(monthOf(r.day))) Game.unlock('hiver');
    const pl = knownFoul();
    if (pl && P.lazaret) {
      const days = quarantineDays();
      Game.advance(days);
      M.bill = null;
      Game.unlock('lazaret');
      Game.log(`Quarantaine de ${days} jours au lazaret ${deLieu(P.name)}.`);
      out.push({ kind: 'notice', title: 'Quarantaine', icon: 'debt', ok: 'Sortir du lazaret', text: [
        `Vous arrivez ${deLieu(PORT[pl.p].name)}, où la peste a éclaté. Le provéditeur à la santé vous envoie au lazaret ${deLieu(P.name)}.`,
        `${days} jours de quarantaine : l'équipage est payé, la cargaison aérée… et le temps passe. Nous voici le ${fmtDate(r.day)}.`] });
    }
  },
  closed(pid) {
    const r = Game.run;
    if (!r || !r.med) return null;
    const p = plagueAt(pid, r.day);
    return p ? ['Port fermé', `La peste sévit à ${PORT[pid].name} jusqu'au ${fmtDate(p.end, true)}.`] : null;
  },
  rumor() {
    const r = Game.run, d = r.day, M = med();
    const cand = M.plagues.filter(p => d >= p.warn - 10 && d < p.start && !M.heard.includes(p.p + p.start));
    if (!cand.length) return null;
    if (Game.her('informateurs') < 1 && !R.chance(0.6)) return null;
    const p = R.pick(cand);
    M.heard.push(p.p + p.start);
    return { text: `On murmure que la peste couve à ${PORT[p.p].name} : on y enterre des morts en secret. Le port fermera d'ici ${Math.max(1, Math.round(p.start - d))} jours.` };
  },
  // galères : Arsenal et rameurs libres
  stats(st, S) {
    if (!S.oars) return;
    st.oars = S.oars * (1 + 0.08 * Game.her('arsenal') + 0.06 * Game.her('rameurs'));
    st.hullMax = Math.round(st.hullMax * (1 + 0.15 * Game.her('arsenal')));
  },
  eat(s) { return (SHIPS[s.type].eat || 1) * (1 - 0.15 * Game.her('rameurs')); },
  worth() { return U.sum(med().freight.filter(f => !f.done), f => f.n * GOODS[f.g].base * 0.9); },
  captured(e, P, E) {
    if (e.wang || E < P * 1.25) return false;   // les bravi de Zorzi pillent ; un corsaire à peine plus fort aussi
    seize(e, (by, verb) => `${by} vous ${verb} captif à Alger.`);
    return true;
  },
  // les corsaires ne coulent pas une prise : le navire désemparé est remorqué à Alger (la tempête et les récifs, eux, coulent)
  sunkBy(e) {
    if (!e || e.kind !== 'pirate' || e.wang) return false;
    const p = SeaScene.player;
    p.hull = Math.max(1, Math.round(p.hullMax * 0.08)); Game.run.ship.hull = p.hull;
    seize(e, (by, verb) => `Votre navire désemparé est pris en remorque : ${by} vous ${verb} captif à Alger.`);
    return true;
  },
  // à chaque entrée au port : une captivité en cours (même après un rechargement) rouvre le choix de la rançon
  onEnterPort() { const M = Game.run && Game.run.med; if (M && M.captive) setTimeout(() => rules.captivity(), 500); },
  // au bagne d'Alger : payer la rançon (banque et lettre de change de Zorzi) ou attendre la confrérie
  captivity() {
    const M = med();
    if (!M.captive || rules.asking) return;
    rules.asking = true;
    const x = ransom(), days = captivityDays();
    UI.choice('Captif à Alger', [
      `Capturé par ${M.captive.by}, vous voici au bagne d'Alger. Votre cargaison et l'argent à bord sont perdus ; votre navire attend au port.`,
      `Rançon demandée : ${monnaie(x)} pour vous et votre navire. Vos banquiers et Zorzi peuvent payer par lettre de change.`,
      `Sans rançon, la Confrérie du rachat des captifs vous libérera dans ${days} jours et vous rapatriera en terre chrétienne, mais le navire sera vendu.`],
    [{ label: `Payer (${fmt(x)})`, value: 'pay', cls: 'gold', disabled: !canPay(x) }, { label: `Attendre la confrérie (${days} j)`, value: 'wait' }], 'skull').then(v => {
      rules.asking = false;
      if (v === 'pay' && payRansom()) { UI.toast('Rançon payée : vous retrouvez votre navire.', 'gold'); UI.after('cash'); return; }
      serveCaptivity();
      Main.transition(() => {
        Main.enterPort(Game.run.port);
        UI.banner('Racheté', `La confrérie vous rapatrie à ${PORT[Game.run.port].name} sur une vieille ${SHIPS[SEA.start.rescueShip].name.toLowerCase()}.`, 'jade');
      });
    });
  },
  // pour le banc d'essai : même choix, sans fenêtre
  freeCaptive(pay) { return pay && payRansom() ? 'rançon' : (serveCaptivity(), 'confrérie'); },
  ransom,
  hud(it) {
    return knownFoul() ? [it(null, h('b', null, 'Patente brute'), 'debt', 'Vous venez d\'un port pestiféré : quarantaine dans les ports chrétiens')] : [];
  },
  chartSide(sel, departing) {
    const out = [], pl = knownFoul();
    if (pl && PORT[sel].lazaret) out.push(h('p', { class: 'neg' }, `Patente brute (vous venez ${deLieu(PORT[pl.p].name)}) : ${quarantineDays()} jours de quarantaine au lazaret ${deLieu(PORT[sel].name)}.`));
    if (departing && [10, 11, 0, 1].includes(monthOf(Game.run.day))) out.push(h('p', { class: 'hint' }, 'Mare clausum : l\'hiver, les tempêtes sont fréquentes et les galères y sont fragiles.'));
    // une cargaison précieuse et peu de canons, à la belle saison : les corsaires rôdent
    const r = Game.run, s = r.ship, st = Game.stats(), m = monthOf(r.day);
    if (departing && s && m >= 3 && m <= 9 && Game.cargoValue(r.cargo) + r.cash > 8000 && s.cannons < st.gunsMax / 2)
      out.push(h('p', { class: 'neg' }, `Cargaison précieuse et seulement ${s.cannons} canon${s.cannons > 1 ? 's' : ''} sur ${st.gunsMax} : d'avril à octobre, les corsaires rôdent. Armez-vous au chantier naval.`));
    return out;
  },
  tavern(pid, render) {
    return [h('h4', null, 'ATTENDRE AU PORT'), h('div', { class: 'row' },
      btn('Attendre une semaine', () => { Game.advance(7); UI.toast('Une semaine passe…', ''); UI.after(); render(); }, 'sm'),
      h('span', { class: 'hint' }, 'Pour laisser passer l\'hiver, une épidémie ou le départ d\'un convoi.'))];
  },
  // les galères d'État, au fondaco (entrepôt)
  warehouse(pid, render) {
    const r = Game.run, d = r.day, M = med();
    const list = M.convoys.filter(c => c.from === pid && c.dep > d + 0.5 && c.dep - d < 60);
    const going = M.freight.filter(f => !f.done);
    if (!list.length && !going.length) return null;
    const box = h('div', { style: { marginTop: '12px' } }, h('h4', null, 'GALÈRES D\'ÉTAT (MUDA)'));
    for (const c of list) {
      const space = convoySpace(c, d), price = convoyPrice(c, d);
      const held = GOODS.map((g, gi) => [g, gi]).filter(([, gi]) => r.cargo[gi] > 0);
      box.append(h('div', { class: 'card', style: { marginBottom: '6px' } },
        h('h5', null, `Muda ${deLieu(PORT[c.to].name)}`),
        h('div', { class: 'd' }, `Départ le ${fmtDate(c.dep, true)}, arrivée vers le ${fmtDate(c.arr, true)} · ${space} ${TXT.unit} libres · ${monnaie(price)} le ${TXT.unitOne}`),
        h('div', { class: 'row' }, space <= 0 ? h('span', { class: 'hint' }, 'Complet.') : held.length ? held.map(([g, gi]) => {
          const n = Math.min(r.cargo[gi], space), cost = n * price;
          return btn(`${n} ${g.name.toLowerCase()} · ${fmt(cost)}`, () => { const k = bookConvoy(c, gi, n); if (k) { UI.toast(`${k} ${g.name.toLowerCase()} embarqués sur la muda ${deLieu(PORT[c.to].name)}.`, 'gold', 'scroll'); UI.after('cash'); } render(); }, 'sm gold', r.cash < price ? { disabled: true } : null);
        }) : h('span', { class: 'hint' }, 'Votre cale est vide.'))));
    }
    for (const f of going) box.append(h('div', { class: 'stat' }, h('span', null, `En route : ${f.n} ${GOODS[f.g].name.toLowerCase()} → ${PORT[f.to].name}`), h('b', null, `vers le ${fmtDate(f.arr, true)}`)));
    box.append(h('p', { class: 'hint' }, 'La place se vend aux enchères : plus le départ approche, plus elle est chère. Vos marchandises voyagent à l\'abri des corsaires et vous attendent au fondaco d\'arrivée.'));
    return box;
  },
  // pour le banc d'essai
  convoys: () => med().convoys, convoySpace, convoyPrice, bookConvoy, knownFoul, plagueAt,
  closedAt: (pid, day) => !!plagueAt(pid, day),
  quarantineIf(from, to, day, days) { const pl = infectedAt(from, day); return pl && PORT[to].lazaret && day + days >= pl.start ? quarantineDays() : 0; },
};

// ════════════ Façades propres : église, maison du prêteur, ridotto ════════════
const facades = {
  temple(it, cul, o) {
    const x = this.x, { x0, w, h, top } = o;
    const nw = w - 22, ncx = x0 + 2 + nw / 2, tx = x0 + w - 18;
    // campanile
    x.fillStyle = Gfx.lin(x, tx, 0, tx + 16, 0, [[0, '#d2c09c'], [0.5, '#e8dcc0'], [1, '#c4b28c']]);
    x.fillRect(tx, top - 34, 16, h + 29);
    this.rr(tx - 1, top - 37, 18, 3, 0.4, '#f6efe0');
    for (const bx of [tx + 2.4, tx + 9.2]) { x.fillStyle = '#3a2a22'; x.beginPath(); x.moveTo(bx, top - 22); x.lineTo(bx, top - 30); x.arc(bx + 2.2, top - 30, 2.2, Math.PI, 0); x.lineTo(bx + 4.4, top - 22); x.fill(); }
    this.poly([tx - 1.5, top - 37, tx + 8, top - 54, tx + 17.5, top - 37], cul.roof);
    this.line(tx + 8, top - 54, tx + 8, top - 60, '#caa040', 0.6); this.line(tx + 6, top - 58, tx + 10, top - 58, '#caa040', 0.6);
    // nef et fronton
    x.fillStyle = Gfx.lin(x, 0, top, 0, GY, [[0, '#f3ead8'], [1, '#d8cbb0']]); x.fillRect(x0 + 2, top, nw, h - 5);
    for (const px of [x0 + 4, x0 + nw - 3]) { x.fillStyle = Gfx.lin(x, px, 0, px + 4, 0, [[0, '#d8ccb2'], [0.5, '#fbf6ea'], [1, '#cbbd9e']]); x.fillRect(px, top + 3, 4, GY - 8 - top); }
    this.eaveShadow(x0 + 2, top, nw, 6);
    this.poly([x0 - 1, top + 1, ncx, top - 18, x0 + nw + 5, top + 1], cul.roof);
    this.poly([x0 + 4, top - 0.5, ncx, top - 13, x0 + nw, top - 0.5], '#f3ead8');
    this.rr(x0 - 1, top - 0.6, nw + 6, 2, 0.4, '#f6efe0');
    // rosace
    x.fillStyle = '#e8dcc0'; x.beginPath(); x.arc(ncx, top + 13, 7, 0, TAU); x.fill();
    x.fillStyle = Gfx.lin(x, ncx - 5, 0, ncx + 5, 0, [[0, '#4d6f94'], [1, '#22384f']]); x.beginPath(); x.arc(ncx, top + 13, 5.2, 0, TAU); x.fill();
    x.strokeStyle = '#e8dcc0'; x.lineWidth = 0.6;
    for (let k = 0; k < 8; k++) { const a = k * TAU / 8; x.beginPath(); x.moveTo(ncx, top + 13); x.lineTo(ncx + Math.cos(a) * 5.2, top + 13 + Math.sin(a) * 5.2); x.stroke(); }
    // portail en plein cintre
    const dw = 16, dx = ncx - dw / 2, dy = GY - 30;
    x.fillStyle = '#e8dcc0'; x.beginPath(); x.moveTo(dx - 2, GY - 5); x.lineTo(dx - 2, dy + dw / 2); x.arc(ncx, dy + dw / 2, dw / 2 + 2, Math.PI, 0); x.lineTo(dx + dw + 2, GY - 5); x.fill();
    x.fillStyle = Gfx.lin(x, 0, dy, 0, GY, [[0, '#3a2418'], [1, '#5a3a24']]); x.beginPath(); x.moveTo(dx, GY - 5); x.lineTo(dx, dy + dw / 2); x.arc(ncx, dy + dw / 2, dw / 2, Math.PI, 0); x.lineTo(dx + dw, GY - 5); x.fill();
    this.line(ncx, dy + 2, ncx, GY - 5, '#2a1a10', 0.5);
    this.sign(it, ncx - 20, top + 23, 40, 8, 'white');
    it.roofTop = top - 54;
    this.lantern(dx - 5, dy + 2, cul.lantern); this.lantern(dx + dw + 5, dy + 2, cul.lantern);
  },
  usurier(it, cul, o) {
    const x = this.x, { x0, w, top, cx } = o;
    // étage noble : fenêtres et balcon
    for (const wx of [x0 + 10, x0 + w - 17]) this.window(cul.win, wx, top + 7, 7, 10, cul);
    this.rr(x0 + 6, top + 19.5, w - 12, 1.6, 0.4, '#f3ead8');
    // arcade du rez-de-chaussée : le comptoir du prêteur
    const ay = GY - 23;
    x.fillStyle = '#241812'; x.fillRect(x0 + 4, ay, w - 8, 18);
    for (let i = 0; i <= 3; i++) { const px = x0 + 4 + i * (w - 8) / 3 - 1.4; this.rr(px, ay - 1, 2.8, 19, 0.3, '#e8dcc0'); }
    x.fillStyle = '#e8dcc0';
    for (let i = 0; i < 3; i++) { const ax = x0 + 4 + i * (w - 8) / 3, aw = (w - 8) / 3; x.beginPath(); x.moveTo(ax, ay); x.lineTo(ax + aw, ay); x.lineTo(ax + aw, ay + 3); x.quadraticCurveTo(ax + aw / 2, ay - 1.2, ax, ay + 3); x.closePath(); x.fill(); }
    this.rr(x0 + 7, GY - 11, w - 14, 5.5, 0.6, '#6b4526');
    x.fillStyle = PAL.gold; for (let i = 0; i < 6; i++) { x.beginPath(); x.arc(x0 + 11 + i * (w - 22) / 5, GY - 11.6, 1, 0, TAU); x.fill(); }
    this.lights.push({ x: cx, y: ay + 8, wx: x0 + 5, wy: ay + 1, w: w - 10, h: 8, kind: 'win', on: true, warm: true });
    it.roofTop = this.roof(cul.roofType, x0, top, w, cul);
    this.sign(it, cx - 22, top + 23.5, 44, 8, 'dark');
  },
  jeu(it, cul, o) {
    const x = this.x, { x0, w, top, cx } = o;
    if (['ottoman', 'barbary', 'mamluk'].includes(PortScene.P.culture)) {
      // le tripot d'Orient : mur chaulé, porte en fer à cheval, tapis pendus, lampes de cuivre
      for (const wx of [x0 + 9, x0 + w - 16]) this.window(cul.win, wx, top + 6, 7, 9, cul);
      const dw = 15, dy = GY - 24;
      x.fillStyle = cul.trim; x.beginPath(); x.moveTo(cx - dw / 2 - 2, GY - 5); x.lineTo(cx - dw / 2 - 2, dy); x.arc(cx, dy, dw / 2 + 2, Math.PI * 0.82, Math.PI * 2.18); x.lineTo(cx + dw / 2 + 2, GY - 5); x.fill();
      x.fillStyle = '#2a1410'; x.beginPath(); x.moveTo(cx - dw / 2, GY - 5); x.lineTo(cx - dw / 2, dy); x.arc(cx, dy, dw / 2, Math.PI * 0.8, Math.PI * 2.2); x.lineTo(cx + dw / 2, GY - 5); x.fill();
      x.fillStyle = '#8e2a2a'; x.beginPath(); x.moveTo(cx - dw / 2, dy - 2); x.quadraticCurveTo(cx - 2, dy + 6, cx - 1, GY - 5); x.lineTo(cx - dw / 2, GY - 5); x.fill();
      this.lights.push({ x: cx, y: GY - 14, wx: cx + 1, wy: dy - 3, w: dw / 2 - 1, h: GY - 5 - dy, kind: 'win', on: true, warm: true });
      for (const [rx, col] of [[x0 + 4, '#b8322a'], [x0 + w - 13, '#2f5a8a']]) {
        this.rr(rx, top + 19, 9, 15, 0.4, col);
        x.strokeStyle = '#e0b040'; x.lineWidth = 0.5; x.strokeRect(rx + 1.2, top + 20.2, 6.6, 12.6);
        x.fillStyle = '#e0b040'; x.beginPath(); x.moveTo(rx + 4.5, top + 23); x.lineTo(rx + 7, top + 26.5); x.lineTo(rx + 4.5, top + 30); x.lineTo(rx + 2, top + 26.5); x.fill();
      }
      this.sign(it, cx - 20, top + 20, 40, 8, 'dark');
      it.roofTop = this.roof(cul.roofType, x0, top, w, cul);
      this.lantern(cx - dw / 2 - 5, dy - 2, '#e0b040'); this.lantern(cx + dw / 2 + 5, dy - 2, '#e0b040');
      return;
    }
    x.fillStyle = Gfx.lin(x, 0, top, 0, GY, [[0, '#8e2a2a'], [1, '#6a1e1e']]); x.fillRect(x0, top, w, GY - 5 - top);
    for (let i = 0; i < 3; i++) this.window(cul.win, x0 + 9 + i * (w - 25) / 2, top + 7, 7, 10, cul);
    this.rr(x0 + 3, top + 21, w - 6, 1.8, 0.4, '#e0b040');
    this.door(cx - 8, GY - 23, 16, 18, '#2a1010');
    this.lights.push({ x: cx, y: GY - 14, wx: cx - 6, wy: GY - 22, w: 12, h: 16, kind: 'win', on: true, warm: true });
    // masques du carnaval au-dessus de la porte
    for (const [mx, col] of [[cx - 13, '#f6efe0'], [cx + 13, '#e0b040']]) { x.fillStyle = col; x.beginPath(); x.ellipse(mx, GY - 27, 3.4, 2.2, 0, 0, TAU); x.fill(); x.fillStyle = '#2a1010'; x.beginPath(); x.arc(mx - 1.3, GY - 27.3, 0.6, 0, TAU); x.arc(mx + 1.3, GY - 27.3, 0.6, 0, TAU); x.fill(); }
    this.sign(it, cx - 22, top + 25, 44, 9, 'dark');
    it.roofTop = this.roof(cul.roofType, x0, top, w, cul);
    for (let i = 0; i < 4; i++) this.lantern(x0 + 7 + i * (w - 14) / 3, top + 1, i % 2 ? '#e0b040' : '#e0402a');
  },
};
