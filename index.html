<script>
'use strict';
// ─── Mers de Jade · le monde : côtes, champ de distance, terrain, carte, vents ───

const WORLD = { LON0: 99, LAT0: 36.5, K: 64, W: 34 * 64, H: 46 * 64, CELL: 4, NAV: 8, TILE: 128 };
function lonX(lon) { return (lon - WORLD.LON0) * WORLD.K; }
function latY(lat) { return (WORLD.LAT0 - lat) * WORLD.K; }

function ell(lon, lat, rx, ry, n) {
  n = n || 12; const pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * TAU; pts.push([lon + Math.cos(a) * rx, lat + Math.sin(a) * ry]); }
  return pts;
}

// Côtes de la mer en cours (longitude, latitude), simplifiées puis « froissées » par une fractale : voir js/seas/
let GEO = null;

const World = {
  sdfGrid: null, GW: 0, GH: 0,
  nav: null, NW: 0, NH: 0,
  tiles: new Map(),
  reefs: [],
  ports: [],
  chart: null,

  // (re)construit le monde de la mer en cours (au démarrage et à chaque changement de mer)
  init() {
    const t0 = performance.now();
    this.tiles.clear(); this.townCache.clear(); this.RAMP = null; this.routes.clear();
    const { W, H, CELL } = WORLD;
    this.GW = Math.ceil(W / CELL); this.GH = Math.ceil(H / CELL);
    // polygones en pixels monde + froissage fractal des côtes
    const polys = GEO.lands.map((poly, pi) => this.roughen(poly.map(p => [lonX(p[0]), latY(p[1])]), pi));
    this.polys = polys;
    // masque terre/mer à la résolution de la grille
    const [mc, mx] = makeCanvas(this.GW, this.GH);
    mx.fillStyle = '#fff';
    for (const poly of polys) {
      mx.beginPath();
      poly.forEach((p, i) => (i ? mx.lineTo(p[0] / CELL, p[1] / CELL) : mx.moveTo(p[0] / CELL, p[1] / CELL)));
      mx.closePath(); mx.fill();
    }
    // chenaux et bassins portuaires creusés
    mx.globalCompositeOperation = 'destination-out';
    mx.lineCap = 'round'; mx.lineJoin = 'round';
    for (const ch of GEO.channels) {
      mx.lineWidth = ch.w / CELL; mx.beginPath();
      ch.pts.forEach((p, i) => (i ? mx.lineTo(lonX(p[0]) / CELL, latY(p[1]) / CELL) : mx.moveTo(lonX(p[0]) / CELL, latY(p[1]) / CELL)));
      mx.stroke();
    }
    this.ports = PORTS.map(p => ({ id: p.id, x: lonX(p.lon), y: latY(p.lat) }));
    for (const p of this.ports) { mx.beginPath(); mx.arc(p.x / CELL, p.y / CELL, 12 / CELL, 0, TAU); mx.fill(); }
    mx.globalCompositeOperation = 'source-over';
    const md = mx.getImageData(0, 0, this.GW, this.GH).data;
    const n = this.GW * this.GH;
    const land = new Uint8Array(n);
    for (let i = 0; i < n; i++) land[i] = md[i * 4 + 3] > 127 ? 1 : 0;
    this.land = land;
    // distances signées (Felzenszwalb) : positif en mer, négatif à terre
    const dToLand = this.edt(land, 1), dToSea = this.edt(land, 0);
    const sdf = new Float32Array(n);
    for (let i = 0; i < n; i++) sdf[i] = land[i] ? -(dToSea[i] - 0.5) * CELL : (dToLand[i] - 0.5) * CELL;
    this.sdfGrid = sdf;
    // récifs : ceux de la carte, puis un semis au hasard de hauts-fonds
    const rz = SEA.world.randomReefs, rr = new RNG(rz ? rz.seed : 1);
    this.reefs = GEO.reefs.map(r => ({ x: lonX(r[0]), y: latY(r[1]), r: r[2] * WORLD.K }));
    if (rz) for (let i = 0; i < rz.n; i++) this.reefs.push({ x: lonX(rr.range(rz.lon[0], rz.lon[1])), y: latY(rr.range(rz.lat[0], rz.lat[1])), r: rr.range(rz.r[0], rz.r[1]) });
    this.buildNav();
    this.buildRelief();
    this.buildChart();
    this.initMs = performance.now() - t0;
  },

  // ── Relief : altitude lissée et ombrage (lumière du nord-ouest) à la résolution de la grille ──
  buildRelief() {
    const GW = this.GW, GH = this.GH, C = WORLD.CELL, s = this.sdfGrid, n = GW * GH;
    let elev = new Float32Array(n);
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
      const i = y * GW + x, e = -s[i];
      if (e <= 0) continue;
      const wx = (x + 0.5) * C, wy = (y + 0.5) * C;
      let hgt = 1 - Math.exp(-e / 55);
      const inland = U.clamp((e - 8) / 70, 0, 1);
      if (inland > 0) {
        const m = fbm(wx * 0.0045, wy * 0.0045, 44, 3);
        const r = 1 - Math.abs(2 * fbm(wx * 0.009, wy * 0.009, 45, 3) - 1);
        hgt += inland * (Math.max(0, m - 0.45) * 2.4 + 0.3 * r * r);
      }
      elev[i] = hgt;
    }
    // deux passes de flou pour adoucir les arêtes du champ de distance
    let tmp = new Float32Array(n);
    for (let pass = 0; pass < 2; pass++) {
      for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
        let acc = 0, cnt = 0;
        for (let dy = -1; dy <= 1; dy++) { const yy = y + dy; if (yy < 0 || yy >= GH) continue; for (let dx = -1; dx <= 1; dx++) { const xx = x + dx; if (xx < 0 || xx >= GW) continue; acc += elev[yy * GW + xx]; cnt++; } }
        tmp[y * GW + x] = s[y * GW + x] > 0 ? 0 : acc / cnt;
      }
      [elev, tmp] = [tmp, elev];
    }
    const shadeA = new Float32Array(n);
    const K = 26, lx = -0.55, ly = -0.65, lz = 0.9, ll = Math.hypot(lx, ly, lz);
    for (let y = 1; y < GH - 1; y++) for (let x = 1; x < GW - 1; x++) {
      const i = y * GW + x;
      const dx = (elev[i + 1] - elev[i - 1]) * K, dy = (elev[i + GW] - elev[i - GW]) * K;
      const nl = Math.hypot(dx, dy, 1);
      const d = (-dx * lx - dy * ly + lz) / (nl * ll);
      shadeA[i] = U.clamp(0.5 + (d - lz / ll) * 1.6, 0, 1);
    }
    for (let i = 0; i < n; i++) if (s[i] > 0) shadeA[i] = 0.5;
    this.elev = elev; this.shade = shadeA;
  },
  // valeur interpolée d'une grille (altitude, ombrage) en coordonnées monde
  gridAt(arr, x, y) {
    const C = WORLD.CELL, GW = this.GW, GH = this.GH;
    let gx = U.clamp(x / C - 0.5, 0, GW - 1.001), gy = U.clamp(y / C - 0.5, 0, GH - 1.001);
    const ix = gx | 0, iy = gy | 0, fx = gx - ix, fy = gy - iy, i = iy * GW + ix;
    const a = arr[i], b = arr[i + 1], c = arr[i + GW], d = arr[i + GW + 1];
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  },

  roughen(pts, seed) {
    const out = [];
    const rec = (a, b, depth) => {
      const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
      if (len < 5 || depth > 6) { out.push(b); return; }
      const mxp = (a[0] + b[0]) / 2, myp = (a[1] + b[1]) / 2;
      const h = hash2(Math.round(mxp * 3), Math.round(myp * 3), 99 + seed * 0) - 0.5;
      const off = h * len * 0.32;
      const m = [mxp - dy / len * off, myp + dx / len * off];
      rec(a, m, depth + 1); rec(m, b, depth + 1);
    };
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      if (i === 0) out.push(a);
      rec(a, b, 0);
    }
    out.pop();
    return out;
  },

  // transformée de distance euclidienne exacte (en cellules)
  edt(mask, featureVal) {
    const w = this.GW, h = this.GH, INF = 1e20;
    const f = new Float64Array(Math.max(w, h)), d = new Float64Array(Math.max(w, h));
    const v = new Int32Array(Math.max(w, h)), z = new Float64Array(Math.max(w, h) + 1);
    const grid = new Float64Array(w * h);
    for (let i = 0; i < w * h; i++) grid[i] = mask[i] === featureVal ? 0 : INF;
    const pass = (len) => {
      let k = 0; v[0] = 0; z[0] = -INF; z[1] = INF;
      for (let q = 1; q < len; q++) {
        let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
        while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
        k++; v[k] = q; z[k] = s; z[k + 1] = INF;
      }
      k = 0;
      for (let q = 0; q < len; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
    };
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) f[y] = grid[y * w + x];
      pass(h);
      for (let y = 0; y < h; y++) grid[y * w + x] = d[y];
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) f[x] = grid[y * w + x];
      pass(w);
      for (let x = 0; x < w; x++) grid[y * w + x] = Math.sqrt(d[x]);
    }
    return grid;
  },

  sdf(x, y) {
    const C = WORLD.CELL, GW = this.GW, GH = this.GH;
    let gx = x / C - 0.5, gy = y / C - 0.5;
    if (gx < 0) gx = 0; else if (gx > GW - 1.001) gx = GW - 1.001;
    if (gy < 0) gy = 0; else if (gy > GH - 1.001) gy = GH - 1.001;
    const ix = gx | 0, iy = gy | 0, fx = gx - ix, fy = gy - iy;
    const s = this.sdfGrid, i = iy * GW + ix;
    const a = s[i], b = s[i + 1], c = s[i + GW], d = s[i + GW + 1];
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  },
  grad(x, y) {
    const e = 3;
    const gx = this.sdf(x + e, y) - this.sdf(x - e, y), gy = this.sdf(x, y + e) - this.sdf(x, y - e);
    const l = Math.hypot(gx, gy) || 1;
    return [gx / l, gy / l];
  },
  inBounds(x, y, m) { m = m || 0; return x > m && y > m && x < WORLD.W - m && y < WORLD.H - m; },

  // ── Navigation : A* sur grille de 8 px ──
  buildNav() {
    const S = WORLD.NAV;
    this.NW = Math.ceil(WORLD.W / S); this.NH = Math.ceil(WORLD.H / S);
    const nav = new Float32Array(this.NW * this.NH);
    for (let y = 0; y < this.NH; y++) for (let x = 0; x < this.NW; x++) nav[y * this.NW + x] = this.sdf(x * S + S / 2, y * S + S / 2);
    this.nav = nav;
  },
  findPath(x0, y0, x1, y1) {
    const S = WORLD.NAV, NW = this.NW, NH = this.NH, nav = this.nav;
    const cell = (x, y) => U.clamp(Math.floor(y / S), 0, NH - 1) * NW + U.clamp(Math.floor(x / S), 0, NW - 1);
    const passable = i => nav[i] > 2.5;
    const nearest = (i0) => {
      if (passable(i0)) return i0;
      let best = -1, bd = 1e9;

  clearLine(x0, y0, x1, y1, margin) {

  // ── Vent (mousson + variations) ──
  wind(day, x, y) {

    if (x !== undefined && SEA.windZones) {
      for (const z of SEA.windZones) {
        if (!z.months.includes(m)) continue;
        const dist = Math.hypot(x - lonX(z.lon), y - latY(z.lat)) / WORLD.K;
        if (dist >= z.r) continue;
        const k = Math.pow(1 - dist / z.r, 0.7) * z.k * (0.6 + 0.8 * noise1(day / 3 + z.lon, 17));

  danger(x, y) {

  // ── Palette du terrain (tuiles de secours, villes, carte) ──

  ramp(v, out) {

precision highp float;
precision highp int;
uniform sampler2D uTex;
uniform vec2 uTexSize;
uniform vec2 uCam;
uniform float uScale;
uniform vec2 uRes;

uint hsh(uint x) { x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }

    // caustiques des hauts-fonds
    if (d < 16.0) {
      float mask = smoothstep(0.35, 0.75, vn(wp * 0.045 + vec2(uTime * 0.05, 0.0), 72u));
      col += ${glv(G.caustic)} * caustic(wp * 0.17, uTime) * 0.085 * mask * (1.0 - smoothstep(2.0, 16.0, d));
    }
    // houle : courtes crêtes perpendiculaires au vent
    vec2 wd = normalize(uWind + vec2(1e-4, 0.0));
    vec2 pd = vec2(-wd.y, wd.x);
    float along = dot(wp, wd), across = dot(wp, pd);
    float ph = along * 0.13 - uTime * 1.5 + vn(wp * 0.011, 5u) * 9.0;
    float crest = smoothstep(0.97, 1.0, sin(ph));
    float dash = smoothstep(0.6, 0.82, vn(vec2(across * 0.09, along * 0.03), 6u));
    col += crest * dash * smoothstep(8.0, 26.0, d) * 0.06 * ${glv(G.crest)};
    // reflets de soleil qui scintillent
    vec2 gp = (wp - wd * uTime * 2.5) / 3.2;
    ivec2 gq = ivec2(floor(gp));
    float gh = h2(gq, 61u);
    if (gh > 0.9 && d > 5.0) {
      vec2 gc = vec2(gq) + 0.5 + (c2(gq, 62u) - 0.5) * 0.6;
      float tw = max(0.0, sin(uTime * (1.6 + gh * 3.0) + gh * 50.0));
      col += (1.0 - smoothstep(0.0, 0.22, length(gp - gc))) * tw * tw * 0.3;
    }
    // récifs
    for (int i = 0; i < 24; i++) {
      if (i >= uNReef) break;
      vec4 R = uReef[i];
      vec2 q = wp - R.xy;
      if (abs(q.x) > R.z + 6.0 || abs(q.y) > R.z + 6.0) continue;
      float rd = length(q) + (vn(wp * 0.3, 9u) - 0.5) * 5.0;
      if (rd < R.z) {
        col = mix(col, ${glv(G.reef)}, 0.5 + 0.35 * smoothstep(R.z, R.z * 0.5, rd));
        float sp = h2(ivec2(floor(wp * 1.1)), 31u);
        if (sp > 0.9) col = mix(col, foamC, 0.75); else if (sp > 0.83) col = mix(col, ${glv(G.reefRock)}, 0.6);
      } else if (rd < R.z + 2.6) col = mix(col, foamC, 0.55 * (1.0 - (rd - R.z) / 2.6));
    }
    // écume du rivage : liseré fixe + vagues qui déferlent
    float edge = 1.0 - smoothstep(0.35, 1.5, d);
    float wave = sin(d * 1.05 - uTime * 1.8 + vn(wp * 0.05, 12u) * 6.2831);
    float band = smoothstep(0.72, 0.97, wave) * (1.0 - smoothstep(1.0, 8.5, d));
    col = mix(col, foamC, max(edge, band * 0.55));
  } else {
    float e = -d, elev = T.g, sh = T.b;
    float lat = ${glf(lat0)} - wp.y / ${glf(k)};
    float zN = smoothstep(${glf(G.north[0])}, ${glf(G.north[1])}, lat), zS = 1.0 - smoothstep(${glf(G.south[0])}, ${glf(G.south[1])}, lat);
    vec3 grass = mix(mix(${glv(G.grass[0])}, ${glv(G.grass[1])}, zN), ${glv(G.grass[2])}, zS);
    vec3 forest = mix(mix(${glv(G.forest[0])}, ${glv(G.forest[1])}, zN), ${glv(G.forest[2])}, zS);
    float mo = vn(wp * 0.02, 31u);
    float beachW = 2.0 + vn(wp * 0.08, 21u) * 1.6;
    bool rocky = fbm3(wp * 0.05, 22u) > 0.63;
    vec3 sand = rocky ? ${glv(G.rock)} : mix(${glv(G.sand[0])}, ${glv(G.sand[1])}, smoothstep(0.2, 1.3, e));
    float veg = smoothstep(beachW, beachW + 1.4, e);
    float forestK = smoothstep(7.0, 14.0, e + (mo - 0.5) * 10.0);
    vec3 base = mix(grass, forest, forestK);
    float hi = smoothstep(0.85, 1.05, elev + (mo - 0.5) * 0.2);
    base = mix(base, ${glv(G.high)}, hi);
    float rk = smoothstep(1.15, 1.35, elev + (vn(wp * 0.03, 33u) - 0.5) * 0.25);
    base = mix(base, ${glv(G.stone)}, rk);
    base = mix(base, ${glv(G.snow)}, smoothstep(1.45, 1.6, elev) * smoothstep(${glf(G.snowLat[0])}, ${glf(G.snowLat[1])}, lat));
    // arbres : houppiers ronds éclairés du nord-ouest, ombre portée au sud-est
    float dens = forestK * (1.0 - hi) * 0.92 + (1.0 - forestK) * 0.1;${G.arid ? `
    dens *= 1.0 - zS * ${glf(G.arid)};   // désert : presque pas d'arbres` : ''}
    if (dens > 0.02 && veg > 0.3) {
      vec2 g = wp / 2.7, gi = floor(g), gf = g - gi;
      float best = 9.0, bh = 0.0; vec2 bo = vec2(0.0);
      for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
        ivec2 q = ivec2(gi) + ivec2(x, y);
        if (h2(q, 41u) > dens) continue;
        vec2 o = vec2(float(x), float(y)) + 0.2 + 0.6 * c2(q, 42u) - gf;
        float dd = length(o);
        if (dd < best) { best = dd; bo = o; bh = h2(q, 43u); }
      }
      if (best < 2.0) {
        float r = 0.4 + bh * 0.18;
        float shadow = 1.0 - smoothstep(r - 0.12, r, length(bo + vec2(0.17, 0.21)));
        base *= 1.0 - shadow * 0.3;
        float blob = 1.0 - smoothstep(r - 0.07, r, best);
        float lit = clamp(0.5 + dot(-bo / r, vec2(-0.707, -0.707)) * 0.55, 0.0, 1.0);
        vec3 tc = forest * (0.86 + bh * 0.22) * (0.8 + 0.42 * lit);
        base = mix(base, tc, blob * veg);
      }
    }
    col = mix(sand, base, veg);
    col *= 0.8 + sh * 0.42;
    // liseré de sable mouillé contre l'eau
    col = mix(col, ${glv(G.wet)}, (1.0 - smoothstep(0.0, 0.8, e)) * 0.6);
    col = mix(foamC, col, smoothstep(0.0, px1 * 1.2, e));
  }
  // ombres des nuages qui passent
  vec2 cw = uWind * uTime * 3.5;
  float cl = smoothstep(0.5, 0.78, vn((wp - cw) * 0.0032, 91u) * 0.65 + vn((wp - cw) * 0.009, 92u) * 0.35);
  col *= 1.0 - cl * 0.13;
  outColor = vec4(col, 1.0);
}`;

const SeaGL = {
  ok: false, gl: null, cv: null, prog: null, tex: null, u: {}, q: 1, lastKey: '',
  init(cv) {
    this.cv = cv;
    let gl = null;
    try { gl = cv.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'high-performance' }); } catch (e) { gl = null; }
    if (!gl) { cv.hidden = true; return false; }
    this.gl = gl;
    try { this.build(); } catch (e) { console.warn('WebGL indisponible :', e.message); this.ok = false; cv.hidden = true; return false; }
    cv.addEventListener('webglcontextlost', e => { e.preventDefault(); this.ok = false; cv.hidden = true; }, false);
    cv.addEventListener('webglcontextrestored', () => { try { this.build(); } catch (e) { this.ok = false; } }, false);
    return this.ok;
  },
  // programme et texture du monde de la mer en cours (au démarrage et à chaque changement de mer)
  build() {
    const gl = this.gl;
    if (this.prog) { gl.deleteProgram(this.prog); this.prog = null; }
    if (this.tex) { gl.deleteTexture(this.tex); this.tex = null; }
    if (this.vao) { gl.deleteVertexArray(this.vao); this.vao = null; }
    const sh = (type, src) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, SEA_VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, seaFS(SEA.palette.gl, WORLD.LAT0, WORLD.K)));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    this.prog = p;
    for (const n of ['uTex', 'uTexSize', 'uCam', 'uScale', 'uRes', 'uTime', 'uWind', 'uReef', 'uNReef']) this.u[n] = gl.getUniformLocation(p, n);
    this.vao = gl.createVertexArray();
    // texture : distance signée, altitude, ombrage
    const GW = World.GW, GH = World.GH, n = GW * GH, data = new Float32Array(n * 4);
    for (let i = 0; i < n; i++) { data[i * 4] = World.sdfGrid[i]; data[i * 4 + 1] = World.elev[i]; data[i * 4 + 2] = World.shade[i]; }
    this.tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, GW, GH, 0, gl.RGBA, gl.FLOAT, data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const reefs = new Float32Array(96);
    World.reefs.slice(0, 24).forEach((r, i) => { reefs[i * 4] = r.x; reefs[i * 4 + 1] = r.y; reefs[i * 4 + 2] = r.r; });
    this.reefs = reefs; this.nReef = Math.min(24, World.reefs.length);
    const err = gl.getError();
    if (err) throw new Error('GL ' + err);
    this.ok = true; this.lastKey = '';
  },
  // taille en pixels réels ; au-delà de ~2,4 Mpx on rend un peu plus petit et on laisse le navigateur agrandir
  resize(w, h) {
    if (!this.gl) return;
    const q = Math.min(1, Math.sqrt(2.4e6 / (w * h)));
    this.q = q;
    this.cv.width = Math.max(1, Math.round(w * q)); this.cv.height = Math.max(1, Math.round(h * q));
    this.lastKey = '';
  },
  show(on) { if (this.cv) this.cv.hidden = !(on && this.ok); },
  render(camX, camY, W, H, t, wind) {
    if (!this.ok) return false;
    const gl = this.gl, cv = this.cv;
    const wa = wind ? wind.a : 0, ws = wind ? wind.s : 1;
    const key = camX.toFixed(2) + ',' + camY.toFixed(2) + ',' + t.toFixed(3) + ',' + cv.width + ',' + W.toFixed(2);
    if (key === this.lastKey) return true;
    this.lastKey = key;
    gl.viewport(0, 0, cv.width, cv.height);
    gl.useProgram(this.prog);
    gl.bindVertexArray(this.vao);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.tex);
    const u = this.u;
    gl.uniform1i(u.uTex, 0);
    gl.uniform2f(u.uTexSize, World.GW * WORLD.CELL, World.GH * WORLD.CELL);
    gl.uniform2f(u.uCam, camX, camY);
    gl.uniform1f(u.uScale, cv.width / W);
    gl.uniform2f(u.uRes, cv.width, cv.height);
    gl.uniform1f(u.uTime, t % 3600);
    gl.uniform2f(u.uWind, Math.cos(wa) * ws, Math.sin(wa) * ws);
    gl.uniform4fv(u.uReef, this.reefs);
    gl.uniform1i(u.uNReef, this.nReef);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    return true;
  },
};

</script>
<script>
'use strict';
// ─── Mers de Jade · logique de partie : état, économie, temps, contrats, héritage ───

const RUN_VERSION = 3;
const GLOBAL_KEY = 'mdj.global';   // réglages, couleurs des voiles et dernière mer choisie : communs à toutes les mers
// chaque mer a sa méta (héritage, hauts faits, records, défis du jour) et sa partie en cours ;
// la mer de Chine garde les clés d'origine (sauvegardes d'avant les extensions)
const metaKey = id => (id === 'chine' ? 'mdj.meta' : 'mdj.' + id + '.meta');
const runKey = id => (id === 'chine' ? 'mdj.run' : 'mdj.' + id + '.run');

function zeros() { return GOODS.map(() => 0); }
function dailyKey(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

const Game = {
  meta: null,      // progression de la mer en cours (jetons, héritage, hauts faits, records)
  run: null,
  global: null,    // réglages et voiles, communs à toutes les mers

  // ════════════ Réglages communs ════════════
  defaultGlobal() {
    return {
      v: 1, sea: 'chine', sail: 'creme', sails: ['creme'],
      settings: { music: 0.5, sfx: 0.8, muted: false, touch: 'auto', hints: true },
    };
  },
  loadGlobal() {
    const d = this.defaultGlobal(), g = Store.get(GLOBAL_KEY, null);
    if (g) {
      this.global = Object.assign(d, g);
      this.global.settings = Object.assign(this.defaultGlobal().settings, g.settings || {});
      return;
    }
    // première ouverture depuis l'arrivée des extensions : réglages et voiles repris de la mer de Chine
    const m = Store.get(metaKey('chine'), null) || {};
    Object.assign(d.settings, m.settings || {});
    if (Array.isArray(m.sails)) d.sails = m.sails.slice();
    if (m.sail) d.sail = m.sail;
    this.global = d;
    this.saveGlobal();
  },
  saveGlobal() { Store.set(GLOBAL_KEY, this.global); },
  // tout effacer : toutes les mers et les réglages
  // efface la progression d'une mer (la mer en cours par défaut) ; les autres mers, les voiles et les réglages restent
  eraseSea(id) {
    id = id || Seas.current;
    Store.del(metaKey(id)); Store.del(runKey(id));
  },

  // ════════════ Méta-progression (propre à chaque mer) ════════════
  defaultMeta() {
    return {
      v: 1, jade: 0, jadeTotal: 0, her: {}, ach: {}, records: [], daily: {}, runs: 0,
      best: 0, tutorialDone: false,
    };
  },
  loadMeta() {
    const m = Store.get(metaKey(Seas.current), null) || {};
    this.meta = Object.assign(this.defaultMeta(), m);
  },
  saveMeta() { Store.set(metaKey(Seas.current), this.meta); },
  her(id) { return (this.meta && this.meta.her[id]) || 0; },
  // couleurs des voiles du joueur ; la toile d'origine prend celles de la mer si elle en propose
  sailScheme() {
    const s = SAIL_COLORS.find(c => c.id === this.global.sail) || SAIL_COLORS[0];
    if (s.id === 'creme' && SEA.playerSail) return { sail: SEA.playerSail.sail, trim: SEA.playerSail.trim };
    return { sail: s.sail, trim: s.trim };
  },
  playerScheme() { return SEA.playerScheme || 'player'; },   // coque et pont du navire du joueur
  // graine du défi du jour : la même pour tout le monde, propre à chaque mer
  dailySeed(key) { return strHash((Seas.current === 'chine' ? 'mdj-' : 'mdj-' + Seas.current + '-') + key); },
  buyHeritage(id) {
    const h = HERITAGE_BY_ID[id], lvl = this.her(id);
    if (!h || lvl >= h.costs.length) return false;
    const c = h.costs[lvl];
    if (this.meta.jade < c) return false;
    this.meta.jade -= c; this.meta.her[id] = lvl + 1;
    this.saveMeta();
    return true;
  },
  // les voiles se paient en jetons de la mer en cours, mais servent dans toutes les mers
  buySail(id) {
    const s = SAIL_COLORS.find(c => c.id === id), g = this.global;
    if (!s) return false;
    if (!g.sails.includes(id)) {
      if (this.meta.jade < s.cost) return false;
      this.meta.jade -= s.cost; g.sails.push(id);
      this.saveMeta();
    }
    g.sail = id; this.saveGlobal();
    return true;
  },
  unlock(id) {
    if (!this.meta || this.meta.ach[id]) return false;
    const a = ACH_BY_ID[id];
    if (!a) return false;
    this.meta.ach[id] = Date.now();
    this.meta.jade += a.jade; this.meta.jadeTotal += a.jade;
    if (this.run) this.run.achRun.push(id);
    this.saveMeta();
    Bus.emit('achievement', a);
    return true;
  },

  // ════════════ Partie ════════════
  newRun(o) {
    o = o || {};
    const seed = o.seed != null ? o.seed >>> 0 : R.int(1, 2e9);
    const run = {
      v: RUN_VERSION, sea: Seas.current, seed, mode: o.mode || 'career', dailyKey: o.dailyKey || null,
      captain: o.captain || 'Capitaine', shipName: o.shipName || 'Hirondelle',
      day: 0.33, endDay: SEA.days, port: SEA.start.port, lastPort: SEA.start.port,
      cash: SEA.start.cash + SEA.start.capitalStep * this.her('capital'), bank: 0, debt: 0, debtSince: null, debtPeak: 0,
      ship: null, cargo: zeros(), cost: zeros(),
      ware: {}, stock: {}, known: {}, contracts: [], offers: {}, hunts: {},
      events: [], rumors: [], buffs: {}, flags: {},
      stats: { voyages: 0, sold: 0, bought: 0, profit: 0, profitSales: 0, bestSale: 0, sunk: 0, boarded: 0, escapes: 0, contracts: 0, offerings: 0, fantan: 0, contraband: 0, storms: 0, maxWorth: 0, loot: 0 },
      journal: [], visited: { [SEA.start.port]: 1 }, achRun: [], titleIdx: 1, insuranceUsed: false, treasures: [], cid: 1,
    };
    const nav = this.her('navire');
    if (nav > 0) {
      run.ship = this.makeShip(SEA.start.familyShips[nav - 1]);
      run.ship.crew = Math.min(SHIPS[run.ship.type].crew, 8 + 4 * this.her('equipage'));
      run.ship.food = run.ship.crew * 30;
    }
    this.run = run;
    this.genEvents();
    if (SEA.rules && SEA.rules.onNewRun) SEA.rules.onNewRun(run);   // calendrier propre à la mer (peste, convois…)
    this.recordPrices(SEA.start.port);
    // des prix connus au départ, vieux de quelques semaines (en mer de Chine : le carnet de bord du père)
    const K = SEA.start.known, fr = new RNG(seed ^ 0xca27e7);
    for (const pid of K.ports) {
      const d = -fr.int(K.age[0], K.age[1]);
      run.known[pid] = { day: d, p: GOODS.map((g, i) => Math.round(this.basePrice(pid, i, d))), prev: null, father: true };
    }
    this.log(TXT.startLog);
    this.checkTitle(true);
    return run;
  },
  makeShip(type) {
    const S = SHIPS[type];
    return { type, hull: S.hull, cannons: Math.min(S.guns, Math.max(2, Math.floor(S.guns / 3))), crew: 0, food: 0, upg: {} };
  },
  saveRun() { if (this.run && !this.run.over) Store.set(runKey(Seas.current), this.run); },
  hasSave() { const r = Store.get(runKey(Seas.current), null); return !!(r && r.v === RUN_VERSION && !r.over); },
  loadRun() {
    const r = Store.get(runKey(Seas.current), null);
    if (r && r.v === RUN_VERSION && !r.over) { this.run = r; return r; }
    return null;
  },
  log(t) {
    const r = this.run; if (!r) return;
    r.journal.push({ d: r.day, t });
    if (r.journal.length > 90) r.journal.shift();
  },
  buff(k) { const r = this.run; return !!(r && r.buffs[k] && r.buffs[k] > r.day); },
  addBuff(k, days) { const r = this.run; r.buffs[k] = Math.max(r.buffs[k] || 0, r.day) + days; },

  // ════════════ Navire ════════════
  stats(ship) {
    ship = ship || (this.run && this.run.ship);
    if (!ship) return null;
    const S = SHIPS[ship.type], u = ship.upg || {};
    const st = {
      hullMax: Math.round(S.hull * (1 + 0.2 * (u.coque || 0)) * (u.cuivre ? 1.1 : 1)),
      hold: Math.floor(S.hold * (1 + 0.15 * (u.cale || 0)) * (1 + 0.1 * this.her('cale'))),
      speed: S.speed * (1 + 0.06 * (u.voiles || 0)) * (u.cuivre ? 1.08 : 1) * (1 + 0.05 * this.her('navigateur')),
      turn: S.turn, gunsMax: S.guns, crewMax: S.crew, crewMin: S.crewMin,
      reload: 2.7 * (1 - 0.1 * this.her('canonniers')),
      dmg: 8 * (u.lourds ? 1.3 : 1) * (1 + 0.1 * this.her('canonniers')),
      range: 150 * (u.longs ? 1.25 : 1),
      board: 1 + (u.armurerie ? 0.35 : 0),
      vigie: u.vigie ? 2 : 1,
      len: S.len, style: S.style, tier: S.tier, name: S.name,
      oars: S.oars || 0, stormMul: S.stormMul || 1,   // galères : vitesse à la rame (part de la vitesse) ; fragilité aux tempêtes
    };
    if (SEA.rules && SEA.rules.stats) SEA.rules.stats(st, S, ship);   // bonus propres à la mer (héritage…)
    return st;
  },
  // une mer peut fermer des ports (la peste…) : [titre, raison] ou null
  portClosed(pid) { return SEA.rules && SEA.rules.closed ? SEA.rules.closed(pid) : null; },
  parcelSpace() { return U.sum(this.run.contracts.filter(c => c.type === 'colis'), c => c.space); },
  used() { const r = this.run; return U.sum(r.cargo) + (r.ship ? r.ship.cannons * CANNON_SPACE : 0) + this.parcelSpace(); },
  free() { const st = this.stats(); return st ? Math.max(0, st.hold - this.used()) : 0; },
  hasBuilding(b, pid) { return PORT[pid || this.run.port].buildings.includes(b); },

  // ════════════ Économie ════════════
  portSeed(pid, gi) { return ((this.run.seed ^ (PORT[pid].idx * 7919 + gi * 104729)) >>> 0) % 100000; },
  mod(pid, gi, day) {
    const g = GOODS[gi], s = this.portSeed(pid, gi);
    return g.vol * (2.2 * (noise1(day / 17 + s * 0.01, s) - 0.5) + 1.3 * (noise1(day / 5.5 + s * 0.013, s + 1) - 0.5));
  },
  // saisons des prix : coefficient du mois pour une marchandise dans certains ports (données de la mer)
  season(pid, gi, m) {
    const g = GOODS[gi].id;
    for (const s of SEA.seasons) if (s.good === g && s.ports.includes(pid)) return s.m[m];
    return 1;
  },
  // fêtes : certaines marchandises s'arrachent dans certains ports pendant quelques jours
  festival(pid, gi, day) {
    const g = GOODS[gi].id;
    for (const f of SEA.festivals) if (day >= f.from && day <= f.to && f.ports.includes(pid) && f.goods.includes(g)) return f.mult;
    return 1;
  },
  festivalOf(day) { return SEA.festivals.find(f => day >= f.from && day <= f.to) || null; },
  festivalName(day) { const f = this.festivalOf(day); return f ? f.name : null; },
  // marchandise tenant un rôle (contrebande, fragile) : indice, ou -1
  roleIdx(role) { return GOODS.findIndex(g => g[role]); },
  genEvents() {
    const r = this.run, rng = new RNG(r.seed ^ 0x5eed);
    const ev = [];
    let id = 0;
    for (let day = 6; day < r.endDay - 5; day += rng.range(6, 12)) {
      const p = rng.pick(PORTS), gi = rng.int(0, GOODS.length - 1);
      const shortage = rng.chance(p.f[gi] >= 1 ? 0.72 : 0.3);
      ev.push({ id: id++, p: p.id, g: gi, mult: shortage ? rng.range(1.9, 3.3) : rng.range(0.32, 0.55), start: Math.round(day + rng.range(0, 4)), dur: rng.int(10, 26), shortage });
    }
    r.events = ev;
  },
  eventMul(pid, gi, day) {
    let m = 1;
    for (const e of this.run.events) {
      if (e.p !== pid || e.g !== gi) continue;
      if (day < e.start - 2 || day > e.start + e.dur + 4) continue;
      let k;
      if (day < e.start) k = (day - (e.start - 2)) / 2;
      else if (day > e.start + e.dur) k = 1 - (day - e.start - e.dur) / 4;
      else k = 1;
      m *= 1 + (e.mult - 1) * U.clamp(k, 0, 1);
    }
    return m;
  },
  activeEvent(pid, gi) {
    const d = this.run.day;
    return this.run.events.find(e => e.p === pid && e.g === gi && d >= e.start - 1 && d <= e.start + e.dur + 2) || null;
  },
  basePrice(pid, gi, day) {
    if (day === undefined) day = this.run.day;
    const P = PORT[pid], g = GOODS[gi];
    return g.base * P.f[gi] * Math.exp(this.mod(pid, gi, day)) * this.season(pid, gi, monthOf(day)) * this.festival(pid, gi, day) * this.eventMul(pid, gi, day);
  },
  stockOf(pid, gi) {
    const s = this.run.stock[pid];
    if (!s || !s[gi]) return 0;
    return s[gi][0] * Math.exp(-(this.run.day - s[gi][1]) * 0.0693);
  },
  setStock(pid, gi, v) { (this.run.stock[pid] = this.run.stock[pid] || {})[gi] = [v, this.run.day]; },
  depth(pid, gi) { return GOODS[gi].depth * PORT[pid].size; },
  midPrice(pid, gi) { return this.basePrice(pid, gi) * Math.exp(-this.stockOf(pid, gi)); },
  tradeMul(buy) {
    const c = this.her('commerce') * 0.02 + (this.buff('commerce') ? 0.05 : 0);
    return buy ? (1 + SPREAD / 2) * (1 - c) : (1 - SPREAD / 2) * (1 + c);
  },
  buyPrice(pid, gi) { return this.midPrice(pid, gi) * this.tradeMul(true); },
  sellPrice(pid, gi) { return this.midPrice(pid, gi) * this.tradeMul(false); },
  buyTotal(pid, gi, n) {
    if (n <= 0) return 0;
    const d = this.depth(pid, gi), P = this.buyPrice(pid, gi);
    return Math.round(P * (Math.exp(n / d) - 1) / (Math.exp(1 / d) - 1));
  },
  sellTotal(pid, gi, n) {
    if (n <= 0) return 0;
    const d = this.depth(pid, gi), P = this.sellPrice(pid, gi);
    return Math.round(P * (1 - Math.exp(-n / d)) / (1 - Math.exp(-1 / d)));
  },
  maxBuy(pid, gi) {
    const r = this.run, d = this.depth(pid, gi), P = this.buyPrice(pid, gi);
    if (r.cash < P) return 0;
    let n = Math.floor(d * Math.log(1 + r.cash * (Math.exp(1 / d) - 1) / P));
    n = Math.max(0, Math.min(n, this.free()));
    while (n > 0 && this.buyTotal(pid, gi, n) > r.cash) n--;
    return n;
  },
  // achats de l'escale en cours : le marchand les reprend au prix payé moins 2 % (pas d'aller-retour gagnant)
  visitOf() {
    const r = this.run;
    if (!r.visit || r.visit.port !== r.port) r.visit = { port: r.port, buys: zeros(), paid: zeros() };
    return r.visit;
  },
  quoteSell(gi, n) {
    const r = this.run, pid = r.port;
    n = Math.min(n, r.cargo[gi]);
    if (n <= 0 || !pid) return { rev: 0, back: 0, n: 0 };
    const v = this.visitOf();
    const back = Math.min(n, v.buys[gi]);
    let rev = 0;
    if (back > 0) rev += Math.round(back * v.paid[gi] / v.buys[gi] * 0.98);
    const rest = n - back;
    if (rest > 0) {
      const d = this.depth(pid, gi), P = this.sellPrice(pid, gi) * Math.exp(-back / d);
      rev += Math.round(P * (1 - Math.exp(-rest / d)) / (1 - Math.exp(-1 / d)));
    }
    return { rev, back, n };
  },
  buy(gi, n) {
    const r = this.run, pid = r.port;
    n = Math.min(n, this.maxBuy(pid, gi));
    if (n <= 0) return 0;
    const cost = this.buyTotal(pid, gi, n);
    r.cash -= cost;
    r.cost[gi] = (r.cost[gi] * r.cargo[gi] + cost) / (r.cargo[gi] + n);
    r.cargo[gi] += n;
    const v = this.visitOf();
    v.buys[gi] += n; v.paid[gi] += cost;
    this.setStock(pid, gi, this.stockOf(pid, gi) - n / this.depth(pid, gi));
    r.stats.bought += cost;
    return cost;
  },
  sell(gi, n) {
    const r = this.run, pid = r.port;
    const q = this.quoteSell(gi, n);
    if (q.n <= 0) return null;
    n = q.n;
    if (q.back > 0) {
      const v = this.visitOf(), unit = v.paid[gi] / v.buys[gi];
      v.paid[gi] -= unit * q.back; v.buys[gi] -= q.back;
    }
    const rev = q.rev;
    const profit = Math.round(rev - r.cost[gi] * n);
    r.cash += rev; r.cargo[gi] -= n;
    if (r.cargo[gi] === 0) r.cost[gi] = 0;
    this.setStock(pid, gi, this.stockOf(pid, gi) + n / this.depth(pid, gi));
    r.stats.sold += rev; r.stats.profit += profit;
    if (profit > 0) { r.stats.profitSales++; this.unlock('profit'); }
    if (profit > r.stats.bestSale) r.stats.bestSale = profit;
    if (profit >= 20000) this.unlock('coup');
    if (GOODS[gi].contraband && PORT[pid].customs > 0.15) {
      r.stats.contraband += n;
      if (r.stats.contraband >= 100) this.unlock('contrebande');
    }
    if (profit >= 4000) this.log(`${n} ${GOODS[gi].name.toLowerCase()} vendus à ${PORT[pid].name} : +${fmt(profit)} ${TXT.money} de bénéfice.`);
    this.checkTitle();
    return { rev, profit, n };
  },
  recordPrices(pid) {
    const r = this.run, prev = r.known[pid];
    r.known[pid] = { day: r.day, p: GOODS.map((g, i) => Math.round(this.midPrice(pid, i))), prev: prev ? prev.p : null };
  },
  knownPrices(pid) {
    const r = this.run;
    if (this.her('informateurs') >= 2) return { day: r.day, p: GOODS.map((g, i) => Math.round(this.midPrice(pid, i))), live: true };
    return r.known[pid] || null;
  },
  bestKnown(gi, exceptPid, wantHigh) {
    let best = null;
    for (const p of PORTS) {
      if (p.id === exceptPid) continue;
      const k = this.knownPrices(p.id);
      if (!k) continue;
      const v = k.p[gi];
      if (!best || (wantHigh ? v > best.v : v < best.v)) best = { pid: p.id, v, age: Math.round(this.run.day - k.day), live: !!k.live };
    }
    return best;
  },

  // ════════════ Vivres ════════════
  foodPrice(pid) { return Math.max(0.3, this.midPrice(pid || this.run.port || this.run.lastPort || SEA.start.port, 0) * 0.05); },   // d'après la denrée de base
  foodDays() { const s = this.run.ship; return s && s.crew > 0 ? s.food / s.crew : 0; },
  foodTopUpCost(days) {
    const s = this.run.ship; if (!s || s.crew <= 0) return { units: 0, cost: 0 };
    const units = Math.max(0, Math.ceil(s.crew * days - s.food));
    return { units, cost: Math.ceil(units * this.foodPrice()) };
  },
  buyFood(days) {
    const r = this.run, { units, cost } = this.foodTopUpCost(days);
    if (units <= 0) return 0;
    if (cost > r.cash) {
      const u = Math.floor(r.cash / this.foodPrice());
      if (u <= 0) return 0;
      r.ship.food += u; const c = Math.ceil(u * this.foodPrice()); r.cash -= c; return c;
    }
    r.ship.food += units; r.cash -= cost;
    return cost;
  },

  // ════════════ Temps ════════════
  advance(dd) {
    const r = this.run;
    if (!r || dd <= 0 || r.over) return;
    const d0 = r.day;
    r.day += dd;
    if (r.debt > 0) { r.debt *= Math.pow(1 + this.debtRate(), dd / 30); r.debtPeak = Math.max(r.debtPeak, r.debt); }
    if (r.bank > 0) r.bank *= Math.pow(1.005, dd / 30);
    for (let d = Math.floor(d0) + 1; d <= Math.floor(r.day); d++) this.onNewDay(d);
  },
  onNewDay(d) {
    const t = dateOf(d);
    if (t.d === 1) this.payWages();
    for (const f of SEA.festivals) if (f.announce && d === f.from) Bus.emit('toast', { t: f.announce, k: 'gold' });
    if (SEA.rules && SEA.rules.onNewDay) SEA.rules.onNewDay(d);
    Bus.emit('day', d);
  },
  consumeFood(dd) {
    const s = this.run.ship; if (!s) return false;
    const k = SEA.rules && SEA.rules.eat ? SEA.rules.eat(s) : 1;   // les rameurs des galères mangent davantage
    s.food = Math.max(0, s.food - (k === 1 ? s.crew * dd : s.crew * dd * k));
    return s.food <= 0 && s.crew > 0;
  },
  payWages() {
    const r = this.run; if (!r.ship || r.ship.crew <= 0) return;
    const w = r.ship.crew * CREW_WAGE;
    if (r.cash >= w) { r.cash -= w; Bus.emit('toast', { t: `Solde mensuelle de l'équipage : -${fmt(w)} ${TXT.money}`, k: '' }); }
    else {
      const leave = Math.max(1, Math.ceil(r.ship.crew * 0.3));
      r.cash = 0; r.ship.crew = Math.max(0, r.ship.crew - leave);
      Bus.emit('toast', { t: `Solde impayée : ${leave} marins désertent !`, k: 'bad' });
      this.log(`Solde impayée : ${leave} marins ont déserté.`);
    }
  },
  daysLeft() { return Math.max(0, this.run.endDay - this.run.day); },
  isYearOver() { return this.run && this.run.day >= this.run.endDay; },

  // ════════════ Fortune ════════════
  shipValue(ship) {
    if (!ship) return 0;
    const S = SHIPS[ship.type], st = this.stats(ship);
    let v = S.price * 0.55 * (0.5 + 0.5 * ship.hull / st.hullMax) + ship.cannons * CANNON_PRICE * 0.5;
    for (const up of UPGRADES) { const l = (ship.upg || {})[up.id] || 0; for (let i = 0; i < l; i++) v += up.cost(S, i) * 0.4; }
    return Math.round(v);
  },
  cargoValue(arr) { return Math.round(arr.reduce((s, n, i) => s + n * GOODS[i].base * 0.9, 0)); },
  worth() {
    const r = this.run;
    let w = r.cash + r.bank - r.debt + this.shipValue(r.ship) + this.cargoValue(r.cargo);
    for (const k in r.ware) w += this.cargoValue(r.ware[k]);
    if (SEA.rules && SEA.rules.worth) w += SEA.rules.worth();   // biens propres à la mer (cargaisons en convoi…)
    return Math.round(w);
  },
  checkTitle(silent) {
    const r = this.run; if (!r) return;
    const w = this.worth(), ti = titleIndex(w);
    if (w > r.stats.maxWorth) r.stats.maxWorth = w;
    for (const [min, id] of SEA.worthAch) if (w >= min) this.unlock(id);
    if (ti > r.titleIdx) {
      r.titleIdx = ti;
      if (!silent) { this.log(`Vous êtes désormais : ${TITLES[ti].name}.`); Bus.emit('title', ti); }
    }
  },

  // ════════════ L'usurier (en mer de Chine : Wang) ════════════
  debtRate() { return Math.max(0.02, 0.05 - 0.01 * this.her('wang')); },
  loanMax() {
    const r = this.run;
    const cap = Math.round((4000 + 1500 * this.her('wang') + Math.max(0, this.worth() + r.debt) * 0.6) / 100) * 100;
    return Math.max(0, cap - Math.round(r.debt));
  },
  borrow(n) {
    const r = this.run; n = Math.min(Math.floor(n), this.loanMax());
    if (n <= 0) return 0;
    r.debt += n; r.cash += n;
    if (r.debtSince == null) r.debtSince = r.day;
    r.debtPeak = Math.max(r.debtPeak, r.debt);
    this.log(`Emprunt de ${fmt(n)} ${TXT.money} à ${TXT.house}.`);
    return n;
  },
  repay(n) {
    const r = this.run; n = Math.min(Math.floor(n), r.cash, Math.ceil(r.debt));
    if (n <= 0) return 0;
    r.cash -= n; r.debt -= n;
    if (r.debt < 1) {
      r.debt = 0; r.debtSince = null;
      if (r.debtPeak >= 1000) this.unlock('dette');
      this.log(`Dette envers ${TXT.lender} entièrement remboursée.`);
    }
    return n;
  },
  debtOverdue() { const r = this.run; return r.debt > 0 && r.debtSince != null && r.day - r.debtSince > 150; },
  debtDueIn() { const r = this.run; return r.debtSince == null ? null : Math.round(r.debtSince + 150 - r.day); },

  // ════════════ Banque ════════════
  deposit(n) { const r = this.run; n = Math.min(Math.floor(n), r.cash); if (n <= 0) return 0; r.cash -= n; r.bank += n; return n; },
  withdraw(n) { const r = this.run; n = Math.min(Math.floor(n), Math.floor(r.bank)); if (n <= 0) return 0; r.bank -= n; r.cash += n; return n; },

  // ════════════ Équipage ════════════
  hireCost() { return Math.round(CREW_HIRE * (1 - 0.2 * this.her('equipage'))); },
  hire(n) {
    const r = this.run, st = this.stats(); if (!st) return 0;
    n = Math.min(n, st.crewMax - r.ship.crew, Math.floor(r.cash / this.hireCost()));
    if (n <= 0) return 0;
    r.cash -= n * this.hireCost(); r.ship.crew += n;
    return n;
  },
  dismiss(n) { const s = this.run.ship; n = Math.min(n, s.crew); s.crew -= n; return n; },
  shanghai() {
    const r = this.run, st = this.stats();
    if (!st || r.ship.crew >= st.crewMax) return { ok: false, full: true };
    r.flags.shanghaiDay = r.day;
    if (R.chance(0.62)) {
      const n = Math.min(st.crewMax - r.ship.crew, R.int(2, 5));
      r.ship.crew += n;
      this.unlock('shanghai');
      return { ok: true, n };
    }
    const fine = Math.min(r.cash, R.int(120, 380));
    r.cash -= fine;
    this.advance(1);
    return { ok: false, fine };
  },

  // ════════════ Chantier ════════════
  repairCost() { const r = this.run, st = this.stats(); return st ? Math.ceil((st.hullMax - r.ship.hull) * 5 * st.tier) : 0; },
  repair() {
    const r = this.run, st = this.stats(); if (!st) return 0;
    const per = 5 * st.tier, missing = st.hullMax - r.ship.hull;
    const hp = Math.min(missing, Math.floor(r.cash / per));
    if (hp <= 0) return 0;
    r.ship.hull += hp; r.cash -= Math.ceil(hp * per);
    if (r.ship.hull > st.hullMax - 0.5) r.ship.hull = st.hullMax;
    return hp;
  },
  buyCannon() {
    const r = this.run, st = this.stats();
    if (!st || r.ship.cannons >= st.gunsMax || r.cash < CANNON_PRICE || this.free() < CANNON_SPACE) return false;
    r.cash -= CANNON_PRICE; r.ship.cannons++;
    if (r.ship.cannons >= 20) this.unlock('flotte');
    return true;
  },
  sellCannon() { const r = this.run; if (!r.ship || r.ship.cannons <= 0) return false; r.ship.cannons--; r.cash += CANNON_PRICE / 2; return true; },
  upgradeCost(id) {
    const r = this.run, up = UPGRADES.find(u => u.id === id), lvl = (r.ship.upg[id] || 0);
    if (lvl >= up.max) return null;
    return up.cost(SHIPS[r.ship.type], lvl);
  },
  buyUpgrade(id) {
    const r = this.run, c = this.upgradeCost(id);
    if (c == null || r.cash < c) return false;
    const before = this.stats();
    r.cash -= c; r.ship.upg[id] = (r.ship.upg[id] || 0) + 1;
    const after = this.stats();
    if (after.hullMax > before.hullMax) r.ship.hull += after.hullMax - before.hullMax;
    return true;
  },
  shipDiscount(pid, type) {
    const r = this.run, h = hash2(PORT[pid].idx, Math.floor(r.day / 20), r.seed % 9973 + SHIP_ORDER.indexOf(type));
    return h < 0.18 ? 0.2 : 0;
  },
  shipOffer(type) {
    const r = this.run, S = SHIPS[type], disc = this.shipDiscount(r.port, type);
    const price = Math.round(S.price * (1 - disc));
    const tradeIn = this.shipValue(r.ship);
    const cargoNeed = U.sum(r.cargo) + this.parcelSpace();
    const newHold = Math.floor(S.hold * (1 + 0.1 * this.her('cale')));
    return { price, tradeIn, net: price - tradeIn, disc, fits: cargoNeed + Math.min(r.ship ? r.ship.cannons : 0, S.guns) * CANNON_SPACE <= newHold };
  },
  buyShip(type) {
    const r = this.run, o = this.shipOffer(type);
    if (r.cash < o.net || !o.fits) return false;
    r.cash -= o.net;
    const old = r.ship, S = SHIPS[type];
    const ns = this.makeShip(type);
    if (old) { ns.cannons = Math.max(ns.cannons, Math.min(old.cannons, S.guns)); ns.crew = Math.min(old.crew, S.crew); ns.food = old.food; }
    r.ship = ns;
    this.log(`Nouveau navire : ${S.name}.`);
    if (SEA.bigShipAch.types.includes(type)) this.unlock(SEA.bigShipAch.id);
    this.checkTitle();
    return true;
  },

  // ════════════ Entrepôt ════════════
  ware(pid) { const r = this.run; return (r.ware[pid] = r.ware[pid] || zeros()); },
  store(gi, n) { const r = this.run, w = this.ware(r.port); n = Math.min(n, r.cargo[gi]); if (n <= 0) return 0; r.cargo[gi] -= n; w[gi] += n; return n; },
  unstore(gi, n) { const r = this.run, w = this.ware(r.port); n = Math.min(n, w[gi], this.free()); if (n <= 0) return 0; w[gi] -= n; r.cargo[gi] += n; return n; },

  // ════════════ Temple ════════════
  offering(amount) {
    const r = this.run; if (r.cash < amount) return false;
    r.cash -= amount; r.stats.offerings++;
    if (amount >= 1000) { this.addBuff('calme', 60); this.addBuff('vent', 20); this.addBuff('paix', 20); }
    else if (amount >= 200) { this.addBuff('calme', 35); this.addBuff('vent', 10); }
    else this.addBuff('calme', 18);
    if (r.stats.offerings >= 5) this.unlock('mazu');
    return true;
  },
  fortune() {
    const r = this.run, key = r.port + ':' + Math.floor(r.day / 10);
    if (r.flags.fortune === key) return null;
    r.flags.fortune = key;
    const f = R.pick(FORTUNES);
    if (f.fx === 'marins' && r.ship) { const st = this.stats(); r.ship.crew = Math.min(st.crewMax, r.ship.crew + 3); }
    else if (f.fx === 'calme') this.addBuff('calme', 25);
    else if (f.fx) this.addBuff(f.fx, 20);
    return f;
  },

  // ════════════ Fan-tan ════════════
  fantan(bet, pick) {
    const r = this.run;
    bet = Math.min(bet, r.cash);
    if (bet <= 0) return null;
    const beans = R.int(24, 63), rem = beans % 4 || 4, win = rem === pick;   // 40 tirages : chaque reste a 1 chance sur 4
    const delta = win ? Math.round(bet * 2.85) : -bet;
    r.cash += delta;
    r.stats.fantan = win ? r.stats.fantan + 1 : 0;
    if (r.stats.fantan >= 3) this.unlock('flambeur');
    return { beans, rem, win, delta };
  },

  // ════════════ Contrats ════════════
  travelDaysEst(a, b) {
    // une mer à grands détours (la botte de l'Italie…) compte la vraie route ; sinon, la ligne droite allongée d'un tiers
    if (SEA.world.routes) return World.routeLen(a, b) * 1.25 / 60 * DAYS_PER_SEC;
    const pa = PORT[a], pb = PORT[b];
    const d = Math.hypot(lonX(pa.lon) - lonX(pb.lon), latY(pa.lat) - latY(pb.lat)) * 1.3;
    return d / 60 * DAYS_PER_SEC;
  },
  huntTargets() { return NAMED_PIRATES.filter(p => !this.run.hunts[p.id]); },
  offersFor(pid) {
    const r = this.run, key = Math.floor(r.day / 6);
    const cur = r.offers[pid];
    if (cur && cur.key === key) return cur.list;
    const rng = new RNG((r.seed ^ strHash(pid) ^ Math.imul(key + 1, 2654435761)) >>> 0);
    const st = this.stats() || this.stats({ type: SHIP_ORDER[0], upg: {} });
    const list = [];
    const others = PORTS.filter(p => p.id !== pid);
    const tierMul = 1 + (st.tier - 1) * 0.6;
    const targets = this.huntTargets();
    for (let i = 0; i < 3; i++) {
      const kind = rng.weighted(['livraison', 'colis', 'chasse', 'prime'], k => ({ livraison: 5, colis: 3, chasse: 2, prime: targets.length && r.day > 20 ? 1.6 : 0 })[k]);
      const id = 'o' + key + pid + i;
      if (kind === 'livraison') {
        const to = rng.pick(others);
        const goods = GOODS.map((g, gi) => gi).filter(gi => to.f[gi] >= 1.1);
        const gi = rng.pick(goods.length ? goods : [1]);
        const qty = Math.max(10, Math.round(st.hold * rng.range(0.2, 0.55) / 5) * 5);
        const est = this.basePrice(to.id, gi) * qty;
        const days = this.travelDaysEst(pid, to.id);
        list.push({ id, type: 'livraison', from: pid, to: to.id, g: gi, qty, reward: Math.round(est * rng.range(1.18, 1.5) / 10) * 10, deadline: Math.round(r.day + days * 1.8 + 8) });
      } else if (kind === 'colis') {
        const to = rng.pick(others), days = this.travelDaysEst(pid, to.id);
        const space = rng.int(6, 14);
        list.push({ id, type: 'colis', from: pid, to: to.id, space, reward: Math.round((250 + days * 70) * tierMul * rng.range(0.9, 1.3) / 10) * 10, deadline: Math.round(r.day + days * 1.6 + 5), what: rng.pick(TXT.parcels) });
      } else if (kind === 'chasse') {
        const n = rng.int(2, 4);
        list.push({ id, type: 'chasse', from: pid, n, done: 0, reward: Math.round(n * (500 + r.day * 6) * tierMul / 10) * 10, deadline: Math.round(r.day + 55) });
      } else {
        // une cible distincte par liste
        const t = targets.splice(rng.int(0, targets.length - 1), 1)[0];
        list.push({ id, type: 'prime', from: pid, target: t.id, reward: t.bounty, deadline: Math.round(r.day + 100) });
      }
    }
    // le boss de la mer (en mer de Chine : le Dragon Écarlate)
    if (r.day > DRAGON.contractDay && !r.hunts[DRAGON.id] && DRAGON.contractPorts.includes(pid)) {
      list.push({ id: DRAGON.id + key, type: 'prime', from: pid, target: DRAGON.id, reward: DRAGON.bounty, deadline: r.endDay });
    }
    r.offers[pid] = { key, list };
    return list;
  },
  contractText(c) {
    if (c.type === 'livraison') return `Livrer ${c.qty} ${GOODS[c.g].name.toLowerCase()} à ${PORT[c.to].name}`;
    if (c.type === 'colis') return `Porter ${c.what} à ${PORT[c.to].name} (${c.space} ${TXT.unit})`;
    if (c.type === 'chasse') return `Couler ${c.n} navires pirates (${c.done || 0}/${c.n})`;
    if (c.type === 'prime') { const t = c.target === DRAGON.id ? DRAGON : NAMED_PIRATES.find(p => p.id === c.target); return `Vaincre ${t.name}, dans ${t.region}`; }
    return '';
  },
  acceptContract(offer) {
    const r = this.run;
    if (r.contracts.length >= 5) return 'Vous avez déjà 5 contrats en cours.';
    if (offer.type === 'prime' && r.hunts[offer.target] === 'dead') return 'Ce pirate a déjà été vaincu.';
    if (offer.type === 'prime' && r.hunts[offer.target] === 'active') return 'Vous traquez déjà ce pirate.';
    if (offer.type === 'colis' && this.free() < offer.space) return 'Pas assez de place dans la cale.';
    if (offer.type === 'colis' && !r.ship) return 'Il vous faut un navire.';
    const c = Object.assign({}, offer, { id: 'c' + (r.cid++), taken: r.day });
    r.contracts.push(c);
    if (c.type === 'prime') r.hunts[c.target] = 'active';
    const o = r.offers[offer.from];
    if (o) o.list = o.list.filter(x => x.id !== offer.id);
    return null;
  },
  deliverable(pid) {
    const r = this.run;
    return r.contracts.filter(c => c.type === 'livraison' && c.to === pid && r.cargo[c.g] >= c.qty);
  },
  deliver(c) {
    const r = this.run;
    if (r.cargo[c.g] < c.qty) return false;
    r.cargo[c.g] -= c.qty;
    if (r.cargo[c.g] === 0) r.cost[c.g] = 0;
    r.cash += c.reward;
    this.completeContract(c);
    return true;
  },
  completeContract(c) {
    const r = this.run;
    r.contracts = r.contracts.filter(x => x !== c && x.id !== c.id);
    r.stats.contracts++;
    if (r.stats.contracts >= 5) this.unlock('contrats');
    this.log(`Contrat honoré : ${this.contractText(c)} (+${fmt(c.reward)} ${TXT.money}).`);
    this.checkTitle();
  },
  onPirateSunk() {
    const r = this.run, done = [];
    for (const c of r.contracts) if (c.type === 'chasse') { c.done = (c.done || 0) + 1; if (c.done >= c.n) done.push(c); }
    for (const c of done) { r.cash += c.reward; this.completeContract(c); Bus.emit('toast', { t: `Contrat de chasse rempli : +${fmt(c.reward)} ${TXT.money}`, k: 'gold' }); }
  },
  onNamedDefeated(id) {
    const r = this.run;
    r.hunts[id] = 'dead';
    const c = r.contracts.find(x => x.type === 'prime' && x.target === id);
    const t = id === DRAGON.id ? DRAGON : NAMED_PIRATES.find(p => p.id === id);
    if (c) { r.cash += c.reward; this.completeContract(c); }
    this.unlock('prime');
    if (id === DRAGON.id) { this.unlock(DRAGON.ach); r.flags.dragonDead = true; }   // (drapeau du boss, quel que soit son nom)
    this.log(`${t.name} est vaincu !`);
    return c ? c.reward : 0;
  },
  expireContracts() {
    const r = this.run, gone = r.contracts.filter(c => r.day > c.deadline);
    r.contracts = r.contracts.filter(c => r.day <= c.deadline);
    for (const c of gone) { if (c.type === 'prime' && r.hunts[c.target] === 'active') delete r.hunts[c.target]; }
    return gone;
  },

  // ════════════ Rumeurs ════════════
  rumorCost() { return this.her('informateurs') >= 1 ? 10 : 25; },
  hearRumor() {
    const r = this.run;
    if (r.cash < this.rumorCost()) return null;
    r.cash -= this.rumorCost();
    if (SEA.rules && SEA.rules.rumor) { const x = SEA.rules.rumor(); if (x) return x; }   // rumeurs propres à la mer
    const d = r.day;
    const cands = r.events.filter(e => e.p !== r.port && e.start + e.dur > d && e.start - d < 28 && !r.rumors.includes(e.id));
    const reliable = this.her('informateurs') >= 1 || R.chance(0.85);
    if (!cands.length || !reliable) {
      if (!reliable && cands.length) {
        const p = R.pick(PORTS.filter(x => x.id !== r.port)), g = R.pick(GOODS);
        return { fake: true, text: `On raconte que ${g.name.toLowerCase()} va manquer à ${p.name}… mais l'homme a beaucoup bu.` };
      }
      return { text: R.pick(TAVERN_LINES) };
    }
    const e = R.pick(cands);
    r.rumors.push(e.id);
    const g = GOODS[e.g].name.toLowerCase(), p = PORT[e.p].name;
    const when = e.start > d + 1 ? `d'ici ${Math.round(e.start - d)} jours` : 'en ce moment';
    return { ev: e, text: e.shortage ? `Pénurie de ${g} à ${p} ${when} : les prix vont s'envoler.` : `Des cargaisons de ${g} inondent ${p} ${when} : les prix vont s'effondrer.` };
  },
  hearRumorFree() {
    const r = this.run, d = r.day;
    const cands = r.events.filter(e => e.start + e.dur > d && e.start - d < 30 && !r.rumors.includes(e.id));
    if (!cands.length) return null;
    const e = R.pick(cands);
    r.rumors.push(e.id);
    const g = GOODS[e.g].name.toLowerCase(), p = PORT[e.p].name;
    return { ev: e, text: e.shortage ? `« ${g} introuvable à ${p} »` : `« ${p} croule sous ${GOODS[e.g].bulk || 'les stocks de ' + g} »` };
  },
  knownEvents() {
    const r = this.run, d = r.day;
    return r.events.filter(e => r.rumors.includes(e.id) && e.start + e.dur > d);
  },

  // ════════════ Arrivée au port ════════════
  arrive(pid) {
    const r = this.run;
    const out = [];
    const first = !r.visited[pid];
    r.port = pid;
    r.visit = null;
    r.visited[pid] = (r.visited[pid] || 0) + 1;
    if (pid !== r.lastPort) { r.stats.voyages++; this.unlock('voyage'); }
    r.lastPort = pid;
    if (SEA.rules && SEA.rules.onArrive) SEA.rules.onArrive(pid, out);   // avant tout le reste (quarantaine…)
    if (Object.keys(r.visited).length >= PORTS.length) this.unlock('tour');
    this.recordPrices(pid);
    // contrats expirés
    for (const c of this.expireContracts()) out.push({ kind: 'toast', t: `Contrat expiré : ${this.contractText(c)}`, k: 'bad' });
    // colis livrés
    for (const c of r.contracts.filter(c => c.type === 'colis' && c.to === pid)) {
      r.cash += c.reward; this.completeContract(c);
      out.push({ kind: 'toast', t: `Colis livré à ${PORT[pid].name} : +${fmt(c.reward)} ${TXT.money}`, k: 'gold' });
    }
    // douane
    const P = PORT[pid];
    const cgi = this.roleIdx('contraband'), armes = cgi >= 0 ? r.cargo[cgi] : 0;
    if (armes > 0 && P.customs > 0 && R.chance(P.customs * 1.6)) {
      const value = Math.round(armes * GOODS[cgi].base * P.f[cgi]);
      out.push({ kind: 'customs', bribe: Math.max(80, Math.round(value * 0.14)), value, n: armes, chance: U.clamp(0.35 + P.customs, 0.4, 0.85) });
    }
    // les hommes de l'usurier
    if (this.debtOverdue() && R.chance(0.45)) out.push({ kind: 'wang' });
    // voleurs
    if (r.cash > 6000 && R.chance(P.thieves != null ? P.thieves : SEA.thieves)) {
      const t = Math.round(r.cash * R.range(0.08, 0.18));
      r.cash -= t;
      out.push({ kind: 'toast', t: `Des voleurs ont dérobé ${fmt(t)} ${TXT.money} sur le quai ! (La banque est plus sûre.)`, k: 'bad' });
      this.log(`Volé de ${fmt(t)} ${TXT.money} à ${P.name}.`);
    }
    // émissaire du boss : sa protection contre les pirates
    if (r.day > DRAGON.emissaryDay && !r.flags.dragonDead && DRAGON.emissaryPorts.includes(pid) && !this.buff('protection') && R.chance(0.14)) {
      out.push({ kind: 'emissary', cost: Math.round(Math.max(800, this.worth() * 0.04) / 50) * 50 });
    }
    const fest = this.festivalName(r.day);
    if (fest) out.push({ kind: 'toast', t: `${fest} à ${P.name} !`, k: 'gold' });
    if (first) out.push({ kind: 'toast', t: `Première escale à ${P.name}. ${P.desc}`, k: '' });
    if (r.flags.piracy) {
      const fine = Math.min(r.cash, 1500 * r.flags.piracy);
      r.cash -= fine; r.flags.piracy = 0;
      out.push({ kind: 'toast', t: `La capitainerie vous inflige ${fmt(fine)} ${TXT.money} d'amende pour piraterie.`, k: 'bad' });
    }
    this.checkTitle();
    this.saveRun();
    return out;
  },
  resolveCustoms(ev, choice) {
    const r = this.run, gi = this.roleIdx('contraband');
    if (choice === 'bribe') {
      if (r.cash < ev.bribe) return { ok: false, t: 'Vous n\'avez pas de quoi payer.' };
      r.cash -= ev.bribe;
      return { ok: true, t: `Les douaniers empochent ${fmt(ev.bribe)} ${TXT.money} et regardent ailleurs.` };
    }
    if (R.chance(ev.chance)) {
      const fine = Math.min(r.cash, Math.round(ev.value * 0.2));
      r.cargo[gi] = 0; r.cost[gi] = 0; r.cash -= fine;
      this.log(`Douane : ${ev.n} ${TXT.crates} saisies et ${fmt(fine)} ${TXT.money} d'amende.`);
      return { ok: false, t: `Fouille ! ${ev.n} ${TXT.crates} confisquées et ${fmt(fine)} ${TXT.money} d'amende.` };
    }
    return { ok: true, t: 'La fouille est bâclée : rien n\'a été trouvé. Quelle chance !' };
  },
  wangVisit() {
    const r = this.run;
    const take = Math.min(r.cash, Math.round(r.debt * 0.25));
    r.cash -= take; r.debt = Math.max(0, r.debt - take);
    let hurt = 0;
    if (r.ship && r.ship.crew > 2) { hurt = Math.min(r.ship.crew - 1, R.int(1, 3)); r.ship.crew -= hurt; }
    if (r.debt < 1) { r.debt = 0; r.debtSince = null; } else r.debtSince = r.day - 110;
    this.log(`${capFirst(TXT.men)} ont prélevé ${fmt(take)} ${TXT.money}.`);
    return { take, hurt };
  },
  payProtection(cost) {
    const r = this.run; if (r.cash < cost) return false;
    r.cash -= cost; this.addBuff('protection', 60);
    this.log(`${TXT.emissary.log} achetée pour 60 jours (${fmt(cost)} ${TXT.money}).`);
    return true;
  },

  // ════════════ Voyage ════════════
  depart(dest) {
    const r = this.run;
    r.port = null; r.dest = dest; r.from = r.lastPort; r.visit = null;
    if (SEA.rules && SEA.rules.onDepart) SEA.rules.onDepart(r.from, dest);
    this.saveRun();
  },
  sinkingRescue() {
    const r = this.run;
    if (this.her('assurance') && !r.insuranceUsed) {
      r.insuranceUsed = true;
      r.cargo = zeros(); r.cost = zeros();
      r.cash = 0;
      r.contracts = r.contracts.filter(c => c.type !== 'colis');
      const ns = this.makeShip(SEA.start.rescueShip);
      ns.crew = 5; ns.food = 5 * 20;
      r.ship = ns;
      this.log(`Naufrage ! ${TXT.rescue}.`);
      return true;
    }
    return false;
  },

  // ════════════ Fin de partie ════════════
  endRun(reason) {
    const r = this.run;
    if (!r || r.over) return null;
    r.over = true;
    if (reason === 'naufrage') {
      // le navire, sa cargaison et l'argent à bord sont au fond de la mer
      r.lostAtSea = { cash: Math.round(r.cash), ship: this.shipValue(r.ship), cargo: this.cargoValue(r.cargo) };
      r.cash = 0; r.cargo = zeros(); r.cost = zeros(); r.ship = null;
    }
    const worth = this.worth();
    const ti = titleIndex(worth);
    const jadeEarned = Math.max(1, Math.floor(Math.sqrt(Math.max(0, worth)) / 8)) + (reason === 'end' ? 5 : 0);
    this.meta.jade += jadeEarned; this.meta.jadeTotal += jadeEarned; this.meta.runs++;
    const rec = { worth, title: TITLES[ti].name, captain: r.captain, ship: r.shipName, when: Date.now(), mode: r.mode, reason, day: Math.floor(r.day) };
    const prevBest = this.meta.best || 0;
    this.meta.records.push(rec);
    this.meta.records.sort((a, b) => b.worth - a.worth);
    this.meta.records = this.meta.records.slice(0, 10);
    if (worth > prevBest) this.meta.best = worth;
    let dailyBest = false;
    if (r.mode === 'daily') {
      const k = r.dailyKey;
      if (this.meta.daily[k] == null || this.meta.daily[k] < worth) { this.meta.daily[k] = worth; dailyBest = true; }
    }
    this.meta.tutorialDone = true;
    this.saveMeta();
    Store.del(runKey(Seas.current));
    return { worth, ti, jadeEarned, isBest: worth > prevBest, prevBest, dailyBest, reason, rec, run: r };
  },

  // ════════════ Objectifs ════════════
  objectives() {
    const r = this.run, s = r.ship, out = [];
    const tuto = !this.meta.tutorialDone && this.meta.runs === 0;
    if (tuto || !s) {
      const steps = [
        { t: `Empruntez de l'argent à ${TXT.house}`, done: r.debt > 0 || !!s || r.stats.voyages > 0 },
        { t: 'Achetez un navire au chantier naval', done: !!s },
        { t: 'Engagez au moins 5 marins à la taverne', done: s && s.crew >= 5 },
        { t: 'Achetez des marchandises au marché', done: U.sum(r.cargo) > 0 || r.stats.voyages > 0 },
        { t: 'Allez au quai et prenez la mer', done: r.stats.voyages > 0 },
        { t: 'Revendez avec bénéfice dans un autre port', done: r.stats.profitSales > 0 },
      ];
      if (s && this.her('navire') > 0) steps.splice(0, 2);
      if (steps.some(x => !x.done)) {
        let cur = false;
        for (const st of steps) { const o = { t: st.t, done: !!st.done }; if (!o.done && !cur) { o.cur = true; cur = true; } out.push(o); }
        return { title: 'Premiers pas', list: out };
      }
    }
    const w = this.worth(), next = TITLES[Math.min(TITLES.length - 1, titleIndex(w) + 1)];
    if (next.min > w) out.push({ t: `Devenir « ${next.name} » : ${fmt(next.min)} ${TXT.money} (${fmt(w)})`, cur: true });
    if (r.debt > 0) { const due = this.debtDueIn(); out.push({ t: `Rembourser ${TXT.lender} : ${fmt(r.debt)} ${TXT.money}` + (due != null ? (due > 0 ? ` (patience : ${due} j)` : ' (EN RETARD !)') : ''), cur: true }); }
    for (const c of r.contracts) out.push({ t: this.contractText(c) + ` · avant le ${fmtDate(c.deadline, true)}`, cur: true });
    return { title: 'Objectifs', list: out };
  },
};

</script>
<script>
'use strict';
// ─── Mers de Jade · scène du port (vue de côté, illustration vectorielle) et écran titre ───

// cultures des ports (couleurs, toits, fenêtres) : registre rempli par chaque mer (js/seas/)
const CULTURE = {};

const BW = { marche: 92, chantier: 108, taverne: 80, banque: 84, usurier: 60, entrepot: 96, temple: 96, jeu: 76 };
const BH = { marche: 60, chantier: 78, taverne: 72, banque: 74, usurier: 64, entrepot: 66, temple: 80, jeu: 68 };
const SH = 160, GY = 156;   // hauteur de la rue (unités) et ligne de sol

// ── Ciel selon l'heure (dégradés « bokashi » des estampes) ──
// clés : [heure, haut du ciel, horizon, obscurité] (palette de la mer)
function skyAt(h) {
  const SKY_KEYS = SEA.palette.sky;
  for (let i = 0; i < SKY_KEYS.length - 1; i++) {
    const a = SKY_KEYS[i], b = SKY_KEYS[i + 1];
    if (h >= a[0] && h <= b[0]) {
      const t = (h - a[0]) / (b[0] - a[0]);
      return { top: mixHex(a[1], b[1], t), bot: mixHex(a[2], b[2], t), dark: U.lerp(a[3], b[3], t) };
    }
  }
  return { top: SKY_KEYS[0][1], bot: SKY_KEYS[0][2], dark: SKY_KEYS[0][3] };
}
function drawSky(ctx, W, H, top, bot, horizon) {
  const g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, shade(top, 0.82)); g.addColorStop(0.18, top); g.addColorStop(0.72, mixHex(top, bot, 0.62)); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon + 1);
  ctx.fillStyle = bot; ctx.fillRect(0, horizon, W, H - horizon);
}
// nuage stylisé à base plate, teinté par l'heure
function makeCloud(rng, w, h, k, tod) {
  const [c, x] = makeLayer(w, h, k);
  const top = mixHex('#ffffff', tod.bot, 0.28), bot = mixHex('#c7d3e2', tod.top, 0.32);
  x.fillStyle = Gfx.lin(x, 0, 0, 0, h, [[0, top], [0.7, mixHex(top, bot, 0.6)], [1, bot]]);
  x.beginPath();
  for (let i = 0; i < 7; i++) {
    const r = rng.range(h * 0.22, h * 0.45), cx = rng.range(r, w - r), cy = h - r - rng.range(0, h * 0.18);
    x.moveTo(cx + r, cy); x.arc(cx, cy, r, 0, TAU);
  }
  x.fill();
  x.globalCompositeOperation = 'destination-out'; x.fillRect(0, h * 0.84, w, h);
  return c;
}

// ════════════════════════════════════════════════════════════════════
//  Façades (dessin vectoriel, rendu une fois par port)
// ════════════════════════════════════════════════════════════════════
const Facade = {
  x: null, lights: null, signs: null, rng: null,
  r(x, y, w, h, c) { this.x.fillStyle = c; this.x.fillRect(x, y, w, h); },
  rr(x, y, w, h, r, c) { Gfx.rr(this.x, x, y, w, h, r); this.x.fillStyle = c; this.x.fill(); },
  poly(pts, c) { const x = this.x; x.beginPath(); x.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) x.lineTo(pts[i], pts[i + 1]); x.closePath(); x.fillStyle = c; x.fill(); },
  line(x0, y0, x1, y1, c, w) { const x = this.x; x.strokeStyle = c; x.lineWidth = w || 0.5; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); },
  eaveShadow(x0, top, w, depth) {
    this.x.fillStyle = Gfx.lin(this.x, 0, top, 0, top + (depth || 7), [[0, 'rgba(24,16,12,0.42)'], [1, 'rgba(24,16,12,0)']]);
    this.x.fillRect(x0, top, w, depth || 7);
  },

  roof(type, x0, top, w, cul, color, colorL) {
    const x = this.x, col = color || cul.roof, colL = colorL || cul.roofL, dk = shade(col, 0.7);
    if (type === 'curved' || type === 'jcurve') {
      const jp = type === 'jcurve', ov = jp ? 5 : 6;
      const xs = x0 - ov, xe = x0 + w + ov, rh = 10 + w * 0.07, flare = jp ? 2.2 : 5;
      const eave = top + 2, ridge = top - rh, rl = x0 + w * 0.22, rr = x0 + w * 0.78;
      const edge = () => { x.moveTo(xs - 1.5, eave - flare); x.quadraticCurveTo(xs + 3, eave + 0.6, xs + 9, eave + 0.6); x.lineTo(xe - 9, eave + 0.6); x.quadraticCurveTo(xe - 3, eave + 0.6, xe + 1.5, eave - flare); };
      const outline = () => { x.beginPath(); edge(); x.quadraticCurveTo(xe - 6, eave - rh * 0.3, rr, ridge); x.lineTo(rl, ridge); x.quadraticCurveTo(xs + 6, eave - rh * 0.3, xs - 1.5, eave - flare); x.closePath(); };
      this.eaveShadow(x0, top, w, 8);
      outline(); x.fillStyle = Gfx.lin(x, 0, ridge, 0, eave, [[0, colL], [0.55, col], [1, dk]]); x.fill();
      x.save(); outline(); x.clip();

const PortScene = {

  enter(pid) {
    const P = PORT[pid];
    this.pid = pid; this.P = P; this.t = 0;
    this.fx.list.length = 0;
    const rng = new RNG(strHash(pid + 'rue'));
    const cul = CULTURE[P.culture];

    const items = [];
    let x = 20;
    const house = () => { const w = rng.int(36, 56); items.push({ type: 'house', x, w, h: rng.int(44, 72) }); x += w + rng.int(2, 5); };
    house();
    for (const b of P.buildings) {
      if (rng.chance(0.45)) house();
      items.push({ type: b, x, w: BW[b], h: BH[b] + rng.int(-3, 3), door: x + BW[b] / 2 });
      x += BW[b] + rng.int(3, 7);
    }
    house(); house();

    items.push(quai);

    this.st = { items, len, quai, lights: [], signs: [] };
    this.street = null; this.streetK = 0;
    this.cul = cul;
    // météo, heure, saison
    const r = Game.run;
    const h = hourOf(r.day);
    this.hour = h;
    this.tod = skyAt(h);
    const m = monthOf(r.day);
    const wr = new RNG(Math.floor(r.day * 7) + P.idx);
    this.weather = null;
    const pw = P.weather || {};
    if (pw.snow && pw.snow.months.includes(m) && wr.chance(pw.snow.p)) this.weather = 'snow';
    else if (pw.petals && pw.petals.months.includes(m) && wr.chance(pw.petals.p)) this.weather = 'petals';
    else if (wr.chance(SEA.rain[m])) this.weather = 'rain';
    const fest = Game.festivalOf(r.day), ffx = fest && fest.fxPorts && fest.fxPorts.includes(pid) ? fest.fx : null;
    this.festival = fest ? fest.name : null;
    this.fireworks = ffx === 'fireworks' && this.tod.dark > 0.3;
    this.lanternsFest = ffx === 'lanterns';
    // passants
    this.npcs = [];
    const types = this.npcTypes(P);
    const n = 11 + Math.floor(P.size * 4);
    for (let i = 0; i < n; i++) {
      const o = rng.pick(types);
      this.npcs.push({ spr: People.make(o), x: rng.range(0, len - 60), dir: rng.chance(0.5) ? 1 : -1, sp: rng.range(14, 30), d: rng.range(0, 9), f: rng.range(0, 4), pause: 0, still: rng.chance(0.12) });

  // ── Mise à jour ──
  update(dt) {
    this.t += dt;
    const cap = this.cap, st = this.st;
    let dir = 0;
    const live = !Input.blocked && !Main.fadeDir;
    if (live) {
      if (Input.down('left')) dir = -1;
      else if (Input.down('right')) dir = 1;
    }
    if (dir) { cap.target = null; cap.openOnArrive = null; cap.fast = false; }
    if (cap.target != null && !dir) {
      const d = cap.target - cap.x;
      if (Math.abs(d) < 2) {
        cap.x = cap.target; cap.target = null; cap.fast = false;
        if (cap.openOnArrive) { const b = cap.openOnArrive; cap.openOnArrive = null; this.open(b); }
      } else dir = Math.sign(d);
    }
    const sp = cap.fast ? 230 : 72;
    cap.moving = dir !== 0;
    if (dir) {
      cap.dir = dir;
      let stepX = sp * dt;
      if (cap.target != null) stepX = Math.min(stepX, Math.abs(cap.target - cap.x));
      cap.x = U.clamp(cap.x + dir * stepX, 8, st.len - 12);
      cap.f = (cap.f + dt * (cap.fast ? 14 : 8)) % 4;
      if (Math.floor(this.t * 3.2) !== Math.floor((this.t - dt) * 3.2) && cap.fast) Sound.sfxPlay('tick', { vol: 0.3 });
    } else cap.f = 0;
    // proximité d'une porte
    let near = null, bd = 16;
    for (const it of st.items) {
      if (it.door == null) continue;
      const d = Math.abs(it.door - cap.x);
      if (d < bd) { bd = d; near = it; }
    }
    this.near = near;
    if (near && live && (Input.hitCode('ArrowUp') || Input.hitCode('KeyW') || Input.hitCode('Enter') || Input.hitCode('KeyE') || Input.hitCode('Space'))) this.open(near);
    // raccourcis clavier des bâtiments
    if (live) {
      const keys = this.shortcuts();
      keys.forEach((it, i) => { if (Input.hitCode('Digit' + (i + 1)) || Input.hitCode('Numpad' + (i + 1))) this.goTo(it); });
      if (Input.hit('map')) this.goTo(st.quai);
    }
    // clic / toucher
    const pt = Input.pointer;
    if (pt.clicked && live && Main.bufPoint) {
      const bp = Main.bufPoint(pt.x, pt.y);
      const wx = bp.x + this.cam;
      const it = st.items.find(i => i.type !== 'quai' && wx >= i.x && wx <= i.x + i.w && bp.y < this.groundY + 4 && bp.y > this.groundY - i.h - 20);
      if (it && it.door != null) this.goTo(it);
      else if (wx > st.quai.x && bp.y > this.groundY - 90) this.goTo(st.quai);
      else { cap.target = U.clamp(wx, 8, st.len - 12); cap.openOnArrive = null; cap.fast = false; }
    }
    // caméra
    const W = this.W || 480;
    const tgt = U.clamp(cap.x - W / 2, 0, Math.max(0, st.len - W));
    this.cam += (tgt - this.cam) * Math.min(1, dt * 6);
    // passants
    for (const n of this.npcs) {
      if (n.still) { n.f = 0; continue; }
      if (n.pause > 0) { n.pause -= dt; continue; }
      n.x += n.dir * n.sp * dt;
      n.f = (n.f + dt * n.sp * 0.16) % 4;
      if (n.x < -20) n.x = st.len - 30;
      if (n.x > st.len - 20) { n.x = -10; }
      if (R.chance(dt * 0.05)) { n.pause = R.range(1, 4); if (R.chance(0.3)) n.dir *= -1; }
    }
    for (const c of this.clouds) { c.x += c.sp * dt; if (c.x > (this.W || 480) + 80) c.x = -80; }
    // particules d'ambiance
    const gy = this.groundY || 200;
    const fx = this.fx;
    for (const it of st.items) if (it.incense && Math.abs(it.incense.x - cap.x) < 400 && R.chance(dt * 6)) fx.add({ x: it.incense.x + R.range(-1.5, 1.5), y: gy - GY + it.incense.y, vx: R.range(-2, 2), vy: -8, life: 3.2, color: '#dcdce6', alpha: 0.4, size: 1.2, grow: 1.4, soft: true, layer: 'world' });
    if (this.weather === 'rain') for (let i = 0; i < 5; i++) fx.add({ x: this.cam + R.range(-20, W + 40), y: R.range(-10, 0), vx: -30, vy: 280, life: 1.2, color: '#b4c6e2', alpha: 0.45, layer: 'world', size: 1, streak: 0.028 });
    if (this.weather === 'snow' && R.chance(dt * 30)) fx.add({ x: this.cam + R.range(-20, W + 20), y: -4, vx: R.range(-8, 8), vy: R.range(12, 22), life: 14, color: '#ffffff', alpha: 0.9, layer: 'world', size: R.range(1, 2.2) });
    if (this.weather === 'petals' && R.chance(dt * 12)) fx.add({ x: this.cam + R.range(-20, W + 60), y: R.range(-4, gy * 0.5), vx: R.range(-24, -10), vy: R.range(8, 16), life: 12, colors: ['#f8b8c8', '#f4a0b8'], alpha: 0.95, layer: 'world', size: 1.6 });
    if (this.fireworks && R.chance(dt * 0.9)) {
      const fxX = this.cam + R.range(40, W - 40), fyY = R.range(20, gy * 0.45);
      const col = R.pick(['#ff6a52', '#ffd84a', '#8fe3bb', '#8ab4ff', '#ff8ad8']);
      for (let i = 0; i < 40; i++) { const a = i / 40 * TAU, s = R.range(30, 55); fx.add({ x: fxX, y: fyY, vx: Math.cos(a) * s, vy: Math.sin(a) * s, drag: 1.4, life: R.range(1.1, 1.7), color: col, layer: 'sky', size: 1.3, glow: true }); }
      Sound.sfxPlay('firework', { vol: 0.5, pan: (fxX - this.cam) / W * 2 - 1 });
    }
    if (R.chance(dt * 0.06)) Sound.sfxPlay('seagull', { vol: 0.35, pan: R.range(-0.8, 0.8) });
    fx.update(dt);
  },
  shortcuts() { return this.st.items.filter(i => i.door != null && i.type !== 'house'); },
  goTo(it) {
    const cap = this.cap;
    cap.target = it.door; cap.fast = Math.abs(it.door - cap.x) > 40; cap.openOnArrive = it;

  open(it) {
    if (!it || Input.blocked || Main.fadeDir || Main.sceneName !== 'port') return;

  // ── Rendu ──
  draw(ctx, W, H) {

    // ciel, astres, nuages
    ctx.drawImage(this.sky, 0, 0, W, H);
    const h = this.hour;
    if (tod.dark < 0.5) {
