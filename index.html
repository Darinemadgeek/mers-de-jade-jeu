<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mers de Jade</title>
<meta name="description" content="Un an pour devenir Taï-pan : commerce, pirates et typhons en mer de Chine, 1840.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Shippori+Mincho+B1:wght@500;600;700;800&display=swap">
<style>
/* ─── Mers de Jade · interface « estampe contemporaine » : verre d'encre, jade, vermillon et or ─── */
:root {
  --ink: #0b1220;
  --ink-2: #131d2e;
  --glass: rgba(12, 20, 33, 0.72);
  --glass-2: rgba(12, 20, 33, 0.9);
  --line: rgba(243, 235, 218, 0.11);
  --line-2: rgba(243, 235, 218, 0.2);
  --text: #f3ebda;
  --text-2: rgba(243, 235, 218, 0.74);
  --text-3: rgba(243, 235, 218, 0.52);
  --paper: #f3ebda;
  --jade: #3fae8a;
  --jade-hi: #7fd9b6;
  --jade-lo: #237a60;
  --jade-ink: #04170f;
  --gold: #e8b54a;
  --gold-hi: #f7d58a;
  --gold-lo: #b9832a;
  --gold-ink: #2a1804;
  --red: #d8472b;
  --red-hi: #ff8a70;
  --red-lo: #9e2f1c;
  --prussian: #1f4e79;
  --good: #6fd6a8;
  --bad: #ff8a70;
  --font-ui: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-title: "Shippori Mincho B1", "Noto Serif JP", Georgia, serif;
  --blur: blur(14px) saturate(1.2);
  --shadow: 0 20px 56px rgba(0, 0, 0, 0.48), 0 2px 8px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
#app { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
#gl, #screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#screen { touch-action: none; }

.ico { width: 20px; height: 20px; vertical-align: -4px; flex: none; }
.ico.big { width: 34px; height: 34px; vertical-align: middle; }
.ico.sm { width: 16px; height: 16px; vertical-align: -3px; }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.dim { opacity: 0.6; }
b { font-weight: 800; }

/* ── Boutons ── */
.btn {
  font: 700 14.5px/1.15 var(--font-ui);
  color: var(--text);
  background: rgba(243, 235, 218, 0.08);
  border: 1px solid rgba(243, 235, 218, 0.16);
  border-radius: 10px;
  padding: 8px 14px;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  white-space: nowrap;
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.08s;
}
.btn:hover:not(:disabled) { background: rgba(243, 235, 218, 0.15); border-color: rgba(243, 235, 218, 0.3); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(0.985); }
.btn:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.jade { background: linear-gradient(180deg, #56c7a0, #33a07b); color: var(--jade-ink); border-color: rgba(127, 217, 182, 0.65); box-shadow: 0 4px 16px rgba(63, 174, 138, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
.btn.jade:hover:not(:disabled) { background: linear-gradient(180deg, #66d4ad, #3aad86); }
.btn.gold { background: linear-gradient(180deg, #f3c865, #d8a038); color: var(--gold-ink); border-color: rgba(247, 213, 138, 0.65); box-shadow: 0 4px 16px rgba(232, 181, 74, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
.btn.gold:hover:not(:disabled) { background: linear-gradient(180deg, #f8d27a, #e2ab44); }
.btn.red { background: linear-gradient(180deg, #e65c40, #c23b22); color: #fff5ee; border-color: rgba(255, 138, 112, 0.55); box-shadow: 0 4px 16px rgba(216, 71, 43, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.22); }
.btn.red:hover:not(:disabled) { background: linear-gradient(180deg, #f06a4d, #cc4428); }
.btn.dark, .btn.glass { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-color: var(--line-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { background: rgba(243, 235, 218, 0.08); color: var(--text); }
.btn.gold-line { background: rgba(12, 20, 33, 0.4); border-color: rgba(232, 181, 74, 0.6); color: var(--gold-hi); }
.btn.gold-line:hover:not(:disabled) { background: rgba(232, 181, 74, 0.14); }
.btn.sm { font-size: 13.5px; padding: 6px 11px; border-radius: 9px; }
.btn.xs { font-size: 12.5px; padding: 4px 8px; border-radius: 8px; }
.btn.big { font-size: 16.5px; padding: 12px 22px; border-radius: 12px; }
.btn.wide { width: 100%; }

/* ── HUD haut : pastilles de verre ── */
.hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 10;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 0;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.hud-bar { display: contents; }
.hud .it {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px;
  background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--line); border-radius: 999px;
  font: 700 14px var(--font-ui); font-variant-numeric: tabular-nums; white-space: nowrap;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
}
.hud .it.date { font-family: var(--font-title); font-weight: 800; color: var(--gold-hi); letter-spacing: 0.01em; }
.hud .it .bar { width: 52px; height: 6px; background: rgba(243, 235, 218, 0.14); border-radius: 3px; position: relative; overflow: hidden; }
.hud .it .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #3fae8a, #7fd9b6); }
.hud .it .bar i.warn { background: linear-gradient(90deg, #d9a13a, #f7d58a); }
.hud .it .bar i.crit { background: linear-gradient(90deg, #c23b22, #ff8a70); }
.hud .it.debt { color: var(--red-hi); }
.hud .it.bump { animation: bump 0.55s ease-out; }
.hud .it.dip { animation: dip 0.55s ease-out; }
@keyframes bump { 30% { transform: scale(1.12); color: var(--gold-hi); box-shadow: 0 0 0 4px rgba(232, 181, 74, 0.25), 0 6px 18px rgba(0, 0, 0, 0.22); } }
@keyframes dip { 30% { color: var(--red-hi); } }
.hud .sp { flex: 1; pointer-events: none; }
.hud .title { color: var(--jade-hi); font-family: var(--font-title); font-weight: 700; }
.hud .menu-btn { height: 34px; border-radius: 999px; padding: 0 13px; }

/* ── Objectifs ── */
.objectives {
  position: absolute; left: 12px; top: 56px; z-index: 5;
  max-width: min(320px, 70vw);
  background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 10px 13px 11px;
  font-size: 13.5px; line-height: 1.4;
  pointer-events: auto; cursor: pointer;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
}
.objectives h4 { margin: 0 0 6px; font: 800 10.5px var(--font-ui); letter-spacing: 0.16em; color: var(--gold-hi); }
.objectives .o { display: flex; gap: 8px; align-items: flex-start; padding: 1px 0; }
.objectives .o::before { content: ''; flex: none; width: 9px; height: 9px; margin-top: 5px; border-radius: 50%; border: 1.5px solid rgba(232, 181, 74, 0.8); }
.objectives .o.cur::before { background: var(--gold); box-shadow: 0 0 0 3px rgba(232, 181, 74, 0.22); }
.objectives .o.done { opacity: 0.5; text-decoration: line-through; }
.objectives .o.done::before { background: var(--jade); border-color: var(--jade); }
.objectives.min .o:not(.cur) { display: none; }

/* ── HUD mer ── */
.seahud { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; pointer-events: none; padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.seahud > div { pointer-events: auto; }
.sh-left { display: flex; align-items: flex-end; gap: 8px; }
.sh-left canvas { width: 72px; height: 72px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35)); }
.sh-speed { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--line); border-radius: 14px; padding: 7px 12px 8px; display: flex; flex-direction: column; min-width: 112px; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25); }
.sh-speed b { font: 800 17px var(--font-ui); color: var(--paper); font-variant-numeric: tabular-nums; }
.sh-speed span { font-size: 12px; color: var(--text-2); }
.sh-center { display: flex; flex-direction: column; align-items: center; gap: 7px; flex: 1; min-width: 0; }
.sh-dest { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font: 600 13.5px var(--font-ui); max-width: 100%; text-align: center; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22); }
.sh-dest:empty { display: none; }
.sh-guns { display: flex; gap: 8px; }
.gun { display: flex; align-items: center; gap: 8px; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); padding: 6px 10px; border: 1px solid var(--line); border-radius: 12px; font: 700 12.5px var(--font-ui); box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22); }
.gun i { display: block; width: 76px; height: 6px; border-radius: 3px; background: rgba(243, 235, 218, 0.14); position: relative; overflow: hidden; }
.gun i::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: var(--p, 100%); border-radius: 3px; background: var(--gold); }
.gun.ready i::after { background: var(--jade-hi); box-shadow: 0 0 10px rgba(127, 217, 182, 0.7); }
.gun em { font: 800 11px var(--font-ui); font-style: normal; color: var(--paper); background: rgba(243, 235, 218, 0.12); border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 6px; }
.sh-right { display: flex; align-items: flex-end; gap: 10px; }
.sh-right canvas { width: 136px; height: 136px; border-radius: 50%; background: #dfe9e4; box-shadow: 0 0 0 1px rgba(243, 235, 218, 0.3), 0 0 0 5px rgba(12, 20, 33, 0.72), 0 12px 28px rgba(0, 0, 0, 0.45); }
.sh-btns { display: flex; flex-direction: column; gap: 6px; }
.sh-btns .btn { min-width: 72px; }
.sh-btns .btn.on { background: linear-gradient(180deg, #56c7a0, #33a07b); color: var(--jade-ink); border-color: rgba(127, 217, 182, 0.65); }

/* ── Barre du port ── */
.portbar {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  z-index: 6; display: flex; gap: 3px; flex-wrap: wrap; justify-content: center;
  background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--line); border-radius: 16px; padding: 6px;
  width: max-content; max-width: calc(100vw - 16px);
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.38);
}
.portbar .btn { background: transparent; border-color: transparent; font-size: 13.5px; padding: 7px 10px; }
.portbar .btn:hover:not(:disabled) { background: rgba(243, 235, 218, 0.1); border-color: transparent; }
.portbar .btn kbd { font: 800 10px var(--font-ui); padding: 1px 5px; border-radius: 5px; background: rgba(243, 235, 218, 0.1); color: var(--text-3); }
.portbar .btn.go { background: linear-gradient(180deg, #56c7a0, #33a07b); color: var(--jade-ink); border-color: rgba(127, 217, 182, 0.65); }
.portbar .btn.go kbd { background: rgba(4, 23, 15, 0.15); color: rgba(4, 23, 15, 0.7); }

/* ── Invite contextuelle ── */
.prompt {
  position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 7;
  display: flex; align-items: center; gap: 9px;
  background: var(--glass-2); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid rgba(232, 181, 74, 0.55); border-radius: 999px;
  padding: 6px 15px 6px 7px; font: 700 14.5px var(--font-ui);
  box-shadow: 0 0 0 4px rgba(232, 181, 74, 0.1), 0 12px 28px rgba(0, 0, 0, 0.38);
  pointer-events: auto; cursor: pointer; white-space: nowrap;
}
.prompt kbd { font: 800 11px var(--font-ui); padding: 4px 8px; border-radius: 999px; background: var(--gold); color: var(--gold-ink); }
.prompt.top { bottom: auto; top: 128px; font-size: 16px; border-color: rgba(127, 217, 182, 0.65); box-shadow: 0 0 0 4px rgba(63, 174, 138, 0.14), 0 12px 28px rgba(0, 0, 0, 0.38); }

/* ── Notifications et bannières ── */
.toasts { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; width: min(540px, 94vw); }
.toast {
  display: flex; align-items: center; gap: 10px; max-width: 100%;
  background: var(--glass-2); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--line-2); border-radius: 12px; padding: 9px 14px;
  font: 600 14px/1.4 var(--font-ui); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.38);
  animation: toastIn 0.28s cubic-bezier(.2, 1.2, .4, 1);
}
.toast::before { content: ''; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.toast:has(.ico)::before { display: none; }
.toast.good { border-color: rgba(63, 174, 138, 0.55); }
.toast.good::before { background: var(--jade-hi); }
.toast.bad { border-color: rgba(216, 71, 43, 0.6); }
.toast.bad::before { background: var(--red-hi); }
.toast.gold { border-color: rgba(232, 181, 74, 0.6); color: var(--gold-hi); }
.toast.gold::before { background: var(--gold); }
.toast.out { animation: toastOut 0.4s ease-in forwards; }
@keyframes toastIn { from { transform: translateY(-10px) scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateY(-8px); opacity: 0; } }
.banner { position: absolute; left: 0; right: 0; top: 30%; z-index: 55; text-align: center; pointer-events: none; }
.banner .b-in {
  display: inline-flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 64px 20px;
  background: radial-gradient(closest-side, rgba(9, 15, 26, 0.86), rgba(9, 15, 26, 0.62) 65%, rgba(9, 15, 26, 0));
  animation: bannerIn 0.55s cubic-bezier(.2, 1.2, .4, 1);
}
.banner h2 { margin: 0; font: 800 clamp(26px, 5vw, 54px)/1.05 var(--font-title); letter-spacing: 0.14em; text-transform: uppercase; color: var(--paper); text-shadow: 0 4px 28px rgba(0, 0, 0, 0.55); text-wrap: balance; }
.banner p { margin: 0; padding-top: 9px; border-top: 1px solid rgba(232, 181, 74, 0.55); font: 600 clamp(14px, 1.9vw, 18px) var(--font-ui); color: var(--text-2); }
.banner .b-seal { font: 800 17px/1.1 var(--font-title); writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 0.08em; color: #fff3ea; background: var(--red); padding: 7px 5px; border-radius: 4px; transform: rotate(-4deg); box-shadow: 0 8px 20px rgba(120, 20, 10, 0.4), inset 0 0 0 1.5px rgba(255, 243, 234, 0.55); }
.banner.red h2 { color: #ffb2a0; }
.banner.jade h2 { color: var(--jade-hi); }
.banner.out .b-in { animation: bannerOut 0.5s ease-in forwards; }
@keyframes bannerIn { from { transform: scale(1.18); opacity: 0; filter: blur(6px); } to { transform: none; opacity: 1; filter: none; } }
@keyframes bannerOut { to { transform: scale(0.94); opacity: 0; } }

/* ── Panneaux ── */
.modal-root { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
.overlay { position: absolute; inset: 0; z-index: 30; background: rgba(5, 9, 16, 0.5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 16px; pointer-events: auto; animation: fadeIn 0.2s; }
.overlay.clear { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
@keyframes fadeIn { from { opacity: 0; } }
.panel {
  position: relative; width: min(720px, 100%); max-height: calc(100% - 8px);
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(24, 35, 53, 0.96), rgba(13, 21, 34, 0.97));
  border: 1px solid var(--line-2); border-radius: 18px;
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  overflow: hidden;
  animation: panelIn 0.26s cubic-bezier(.2, 1.2, .4, 1);
}
.panel.wide { width: min(1000px, 100%); }
.panel.narrow { width: min(490px, 100%); }
@keyframes panelIn { from { transform: translateY(14px) scale(0.975); opacity: 0; } }
.panel-in { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px 13px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(243, 235, 218, 0.045), rgba(243, 235, 218, 0)); }
.panel-head .ico.big { width: 42px; height: 42px; padding: 7px; background: rgba(243, 235, 218, 0.06); border: 1px solid var(--line); border-radius: 12px; }
.panel-head h3 { margin: 0; font: 800 21px/1.2 var(--font-title); letter-spacing: 0.02em; color: var(--paper); text-wrap: balance; }
.panel-head .sub { font-size: 13.5px; color: var(--text-2); margin-top: 2px; }
.panel-head .grow { flex: 1; min-width: 0; }
.panel-head .x { flex: none; width: 34px; height: 34px; border-radius: 50%; background: rgba(243, 235, 218, 0.06); border: 1px solid var(--line); color: var(--text-2); font: 700 14px var(--font-ui); cursor: pointer; transition: background 0.15s; }
.panel-head .x:hover { background: rgba(243, 235, 218, 0.14); color: var(--text); }
.panel-head .x:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.panel-body { padding: 14px 16px 16px; overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; font-size: 15px; line-height: 1.5; -webkit-user-select: text; user-select: text; scrollbar-width: thin; scrollbar-color: rgba(243, 235, 218, 0.25) transparent; }
.panel-foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; background: rgba(0, 0, 0, 0.14); }
.panel-body h4 { margin: 18px 0 8px; font: 800 11px var(--font-ui); letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold-hi); }
.panel-body h4:first-child { margin-top: 0; }
.panel-body p { margin: 0 0 8px; }
.flavor { font: 500 16px/1.55 var(--font-title); color: var(--text-2); padding: 2px 0 2px 14px; border-left: 2px solid rgba(63, 174, 138, 0.6); margin-bottom: 12px !important; }
.intro p { font: 500 16px/1.6 var(--font-title); color: var(--text); }
.intro .intro-date { font: 800 11.5px var(--font-ui); letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-hi); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.sb { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 700 12.5px var(--font-ui); padding: 3px 10px; border-radius: 999px; background: rgba(243, 235, 218, 0.08); border: 1px solid var(--line); color: var(--text); white-space: nowrap; }
.pill.red { background: rgba(216, 71, 43, 0.16); border-color: rgba(216, 71, 43, 0.45); color: #ffb2a0; }
.pill.jade { background: rgba(63, 174, 138, 0.16); border-color: rgba(63, 174, 138, 0.45); color: var(--jade-hi); }
.pill.gold { background: rgba(232, 181, 74, 0.15); border-color: rgba(232, 181, 74, 0.45); color: var(--gold-hi); }
.stat { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.stat:last-child { border-bottom: none; }
.stat b { font-variant-numeric: tabular-nums; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.card { background: rgba(243, 235, 218, 0.045); border: 1px solid var(--line); border-radius: 13px; padding: 11px 12px; display: flex; flex-direction: column; gap: 7px; }
.card.sel { border-color: rgba(63, 174, 138, 0.7); box-shadow: inset 0 0 0 1px rgba(63, 174, 138, 0.3), 0 8px 22px rgba(63, 174, 138, 0.1); }
.card.locked { opacity: 0.5; }
.card h5 { margin: 0; font: 800 15.5px/1.3 var(--font-ui); }
.card .d { font-size: 13.5px; color: var(--text-2); }
.ledger { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.ledger td, .ledger th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.ledger th { font: 800 10.5px var(--font-ui); letter-spacing: 0.12em; color: var(--text-3); }
.ledger td.r, .ledger th.r { text-align: right; font-variant-numeric: tabular-nums; }
.tabs { display: inline-flex; gap: 2px; padding: 3px; margin-bottom: 10px; flex-wrap: wrap; background: rgba(0, 0, 0, 0.28); border: 1px solid var(--line); border-radius: 12px; }
.tabs .btn { background: transparent; border-color: transparent; }
.tabs .btn.on { background: var(--paper); color: #172233; border-color: var(--paper); }
.hint { font-size: 13px; color: var(--text-3); }
.lvl { display: inline-flex; gap: 3px; }
.lvl i { width: 14px; height: 6px; border-radius: 3px; background: rgba(243, 235, 218, 0.16); display: block; }
.lvl i.on { background: var(--jade-hi); box-shadow: 0 0 8px rgba(127, 217, 182, 0.45); }
input[type=range] { accent-color: var(--jade); width: 100%; min-width: 80px; }
input[type=checkbox] { accent-color: var(--jade); width: 17px; height: 17px; }
input[type=text], input[type=number] {
  font: 600 15px var(--font-ui); color: var(--text); background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 11px; width: 100%;
  -webkit-user-select: text; user-select: text;
}
input[type=number] { width: 110px; }
input:focus-visible { outline: 2px solid var(--jade); outline-offset: 1px; border-color: transparent; }
label.chk { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
kbd.pill { font-size: 11.5px; padding: 1px 7px; }

/* ── Marché ── */
.mk-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.mk-head .sp { flex: 1; }
.mk { display: flex; flex-direction: column; gap: 6px; }
.mk-row {
  display: grid;
  grid-template-columns: 38px minmax(88px, 1.1fr) 82px 70px minmax(120px, 1.6fr) 116px;
  grid-template-areas: "ic name price held slider act" "ic info info info slider act";
  align-items: center; column-gap: 10px; row-gap: 1px;
  background: rgba(243, 235, 218, 0.04); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px;
  transition: background 0.15s, border-color 0.15s;
}
.mk-row:hover { background: rgba(243, 235, 218, 0.07); border-color: var(--line-2); }
.mk-row .ic { grid-area: ic; }
.mk-row .ic .ico.big { width: 36px; height: 36px; }
.mk-row .nm { grid-area: name; font-weight: 800; }
.mk-row .pr { grid-area: price; font: 800 16px var(--font-ui); font-variant-numeric: tabular-nums; text-align: right; color: var(--gold-hi); }
.mk-row .hd { grid-area: held; text-align: right; font-variant-numeric: tabular-nums; }
.mk-row .inf { grid-area: info; font-size: 12.5px; color: var(--text-2); min-width: 0; }
.mk-row .sl { grid-area: slider; display: flex; flex-direction: column; gap: 1px; }
.mk-row .sl output { font-size: 12.5px; text-align: center; font-variant-numeric: tabular-nums; color: var(--text-2); }
.mk-row .ac { grid-area: act; }
.mk-row .ac .btn { width: 100%; }
.trend-up { color: var(--good); margin-left: 3px; font-size: 12px; }
.trend-down { color: var(--bad); margin-left: 3px; font-size: 12px; }
.tag-ev { font: 700 11px var(--font-ui); padding: 1px 7px; border-radius: 999px; background: rgba(232, 181, 74, 0.2); color: var(--gold-hi); margin-left: 6px; vertical-align: 1px; }
.tag-ct { font: 700 11px var(--font-ui); padding: 1px 7px; border-radius: 999px; background: rgba(216, 71, 43, 0.22); color: #ffb2a0; margin-left: 6px; }
.mk-foot { margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: rgba(243, 235, 218, 0.045); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
.mk-foot.contract { background: rgba(232, 181, 74, 0.1); border-color: rgba(232, 181, 74, 0.35); }
.mk-foot.jade-note { background: rgba(63, 174, 138, 0.1); border-color: rgba(63, 174, 138, 0.35); }

/* ── Chantier ── */
.ship-card { display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: center; }
.ship-card canvas, .card canvas.ship-cv { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); display: block; }
.swatch { height: 24px; border-radius: 8px; border: 1px solid var(--line-2); }

/* ── Carte ── */
.chart-wrap { position: relative; display: flex; gap: 14px; align-items: stretch; }
.chart-cv { flex: none; height: min(66vh, 640px); width: auto; max-width: 100%; aspect-ratio: 544 / 736; border-radius: 12px; border: 1px solid var(--line-2); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35); cursor: crosshair; touch-action: manipulation; }
.chart-side { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; max-width: 330px; }
.chart-side .card { gap: 5px; }
.chart-wrap.land { flex-direction: column; align-items: center; }
.chart-wrap.land .chart-side { max-width: none; width: 100%; flex: none; }
.chart-side .card h5 { font: 800 18px var(--font-title); }

/* ── Titre ── */
.title-screen { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 16px; pointer-events: none; text-align: center; }
.title-screen > * { pointer-events: auto; }
.t-brand { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.t-eyebrow { margin: 0; font: 800 12px var(--font-ui); letter-spacing: 0.42em; text-transform: uppercase; color: rgba(247, 213, 138, 0.9); text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5); }
.logo { position: relative; margin: 0; font: 800 clamp(46px, 9.5vw, 112px)/0.98 var(--font-title); letter-spacing: 0.01em; color: var(--paper); text-shadow: 0 8px 44px rgba(18, 8, 30, 0.6); }
.logo span { background: linear-gradient(180deg, #c6f5df 10%, #4bbd96 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.t-seal { position: absolute; left: calc(100% + 0.25em); top: -0.12em; font: 800 clamp(12px, 1.7vw, 19px)/1.08 var(--font-title); font-style: normal; writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 0.06em; color: #fff3ea; background: var(--red); padding: 0.45em 0.28em; border-radius: 3px; transform: rotate(5deg); box-shadow: 0 8px 20px rgba(120, 20, 10, 0.45), inset 0 0 0 1.5px rgba(255, 243, 234, 0.55); text-shadow: none; }
.tagline { margin: 6px 0 0; font: 600 clamp(15px, 2vw, 21px) var(--font-title); color: rgba(243, 235, 218, 0.88); text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55); }
/* sélecteur de mer : une pastille par mer, la mer choisie en or ; défile sur petit écran */
.sea-pick { display: flex; gap: 4px; max-width: min(780px, 94vw); overflow-x: auto; padding: 4px; scrollbar-width: none; background: rgba(12, 20, 33, 0.5); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--line); border-radius: 999px; }
.sea-pick::-webkit-scrollbar { display: none; }
.sea-pick .btn { flex: none; flex-direction: column; gap: 1px; border-radius: 999px; padding: 6px 15px 7px; background: transparent; border-color: transparent; color: var(--text-2); }
.sea-pick .btn b { font: 800 14px/1.1 var(--font-title); color: inherit; }
.sea-pick .btn small { font: 700 10.5px/1.1 var(--font-ui); letter-spacing: 0.08em; opacity: 0.78; }
.sea-pick .btn.on { background: linear-gradient(180deg, rgba(243, 200, 101, 0.24), rgba(216, 160, 56, 0.16)); border-color: rgba(247, 213, 138, 0.62); color: var(--gold-hi); }
.sea-pick .btn.locked { opacity: 0.55; }
.menu { display: flex; flex-direction: column; gap: 8px; width: min(340px, 90vw); }
.menu > .btn { font-size: 16px; padding: 12px 16px; }
.menu > .btn:not(.jade):not(.gold) { background: rgba(12, 20, 33, 0.58); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-color: var(--line-2); }
.menu > .btn.gold-line { border-color: rgba(232, 181, 74, 0.65); }
.menu-sub { justify-content: center; gap: 2px; margin-top: 4px; align-self: center; width: max-content; max-width: 94vw; padding: 3px; background: rgba(12, 20, 33, 0.5); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--line); border-radius: 18px; }
.menu-sub .btn.ghost { color: rgba(243, 235, 218, 0.85); border-radius: 999px; }
.t-stats { justify-content: center; }
.jade-count { display: inline-flex; align-items: center; gap: 7px; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid rgba(63, 174, 138, 0.42); border-radius: 999px; padding: 6px 14px; font: 700 14px var(--font-ui); color: var(--jade-hi); }
.jade-count.gold { color: var(--gold-hi); border-color: rgba(232, 181, 74, 0.42); }
.foot-note { position: absolute; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 16px; right: 16px; text-align: center; font: 500 12px var(--font-ui); color: rgba(243, 235, 218, 0.55); pointer-events: none; }

/* ── Fin de partie ── */
.seal { width: 128px; min-height: 128px; margin: 6px auto 12px; background: var(--red); color: #fff3ea; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 800 15px/1.25 var(--font-title); text-align: center; padding: 12px; border-radius: 10px; box-shadow: inset 0 0 0 3px var(--red), inset 0 0 0 4.5px rgba(255, 243, 234, 0.75), 0 12px 30px rgba(160, 30, 10, 0.35); transform: rotate(-5deg); animation: stamp 0.55s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: 0.3s; }
.seal-zh { font-size: 30px; line-height: 1; letter-spacing: 0.08em; }
@keyframes stamp { from { transform: scale(2.6) rotate(-18deg); opacity: 0; } to { transform: rotate(-5deg); opacity: 1; } }
.bigworth { text-align: center; font: 800 clamp(26px, 5vw, 44px) var(--font-title); color: var(--gold-hi); margin: 4px 0 2px; font-variant-numeric: tabular-nums; }

/* ── Fan-tan et abordage ── */
.fantan-cv { width: 100%; max-width: 440px; aspect-ratio: 2 / 1; border-radius: 12px; border: 1px solid var(--line-2); display: block; margin: 0 auto 12px; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35); }
.board-cv { width: 100%; aspect-ratio: 3 / 1; border-radius: 12px; border: 1px solid var(--line-2); display: block; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35); }
.duel-bar { height: 10px; border-radius: 5px; background: linear-gradient(90deg, #c23b22, #ff8a70); margin: 12px 0 10px; position: relative; overflow: hidden; }
.duel-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: linear-gradient(90deg, #33a07b, #7fd9b6); box-shadow: 0 0 12px rgba(127, 217, 182, 0.6); }

/* ── Commandes tactiles ── */
.touch { position: absolute; left: 0; right: 0; bottom: 150px; z-index: 8; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; }
.touch > div { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
.tc-col { display: flex; flex-direction: column; gap: 8px; }
.tc { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; color: var(--paper); background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--line-2); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); touch-action: none; }
.tc svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.tc:active, .tc.on { background: rgba(63, 174, 138, 0.45); }
.tc.fire { width: 72px; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font: 800 14px/1 var(--font-ui); color: #fff5ee; background: radial-gradient(circle at 50% 32%, rgba(236, 98, 70, 0.95), rgba(158, 40, 22, 0.92)); border-color: rgba(255, 138, 112, 0.6); }
.tc.fire small { font: 600 10px var(--font-ui); opacity: 0.85; }
.tc.fire:active, .tc.fire.on { background: radial-gradient(circle at 50% 32%, #ff8a6a, #c23b22); }
.tc.board { width: auto; height: 48px; border-radius: 999px; padding: 0 16px; font: 800 13px var(--font-ui); color: var(--jade-ink); background: linear-gradient(180deg, #56c7a0, #33a07b); border-color: rgba(127, 217, 182, 0.65); }

/* ── Chargement ── */
.loading { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; font: 600 14px var(--font-ui); color: var(--text-2); letter-spacing: 0.04em; background: radial-gradient(ellipse at 50% 40%, #1b2944, #0b1220 70%); z-index: 100; text-align: center; padding: 20px; transition: opacity 0.5s; }
.loading.done { opacity: 0; pointer-events: none; }
.ld-seal { font: 800 22px/1.1 var(--font-title); writing-mode: vertical-rl; text-orientation: upright; color: #fff3ea; background: var(--red); padding: 9px 6px; border-radius: 4px; box-shadow: 0 10px 26px rgba(120, 20, 10, 0.4); animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.06) rotate(-3deg); } }

@media (max-width: 760px) {
  .hud { gap: 5px; padding-left: 8px; padding-right: 8px; }
  .hud .it { height: 30px; padding: 0 10px; font-size: 13px; }
  .hud .it .bar { width: 36px; }
  .hud .hide-sm { display: none; }
  .hud .menu-btn { height: 30px; }
  .objectives { top: 88px; font-size: 13px; }
  .mk-row { grid-template-columns: 34px 1fr 74px 56px; grid-template-areas: "ic name price held" "info info info info" "slider slider slider act"; row-gap: 6px; }
  .mk-row .ac .btn { width: auto; min-width: 108px; }
  .chart-wrap { flex-direction: column; }
  .chart-side { width: auto; max-width: none; }
  .chart-cv { height: min(52vh, 560px); align-self: center; }
  .sh-right canvas { width: 96px; height: 96px; }
  .gun i { width: 44px; }
  .sh-speed { min-width: 0; }
  .seahud { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "center center center" "left . right"; row-gap: 8px; align-items: end; }
  .sh-left { grid-area: left; }
  .sh-center { grid-area: center; }
  .sh-right { grid-area: right; }
  .sh-left canvas { width: 60px; height: 60px; }
  .sh-dest { font-size: 12.5px; }
  .sh-speed b { white-space: nowrap; font-size: 15px; }
  .prompt.top { top: 178px; }
  .touch { bottom: 210px; }
  .tc { width: 52px; height: 52px; }
  .tc.fire { width: 64px; height: 64px; }
  .ship-card { grid-template-columns: 120px 1fr; }
  .panel-body { padding: 12px; }
  .panel-head h3 { font-size: 18px; }
  .banner .b-in { padding: 18px 26px 16px; }
}
@media (max-width: 420px) {
  .hide-xs { display: none; }
  .portbar .btn { padding: 6px 8px; font-size: 12.5px; }
  .menu-sub .btn.sm { padding: 6px 7px; font-size: 12.5px; }
  .logo { font-size: 42px; }
}
@media (max-height: 520px) {
  .sh-left canvas { width: 56px; height: 56px; }
  .sh-right canvas { width: 88px; height: 88px; }
  .touch { bottom: 96px; }
  .objectives { display: none; }
  .title-screen { gap: 12px; }
  .logo { font-size: clamp(38px, 8vh, 72px); }
  /* avec le sélecteur de mer (téléphone en paysage) : tout doit tenir en hauteur */
  .title-screen.multi { gap: 8px; padding-top: 6px; padding-bottom: 6px; }
  .title-screen.multi .t-eyebrow { display: none; }
  .title-screen.multi .tagline { margin-top: 0; }
  .title-screen.multi .menu { gap: 6px; }
  .title-screen.multi .menu > .btn { min-height: 36px; padding: 6px 14px; }
  .title-screen.multi .menu-sub .btn { min-height: 32px; }
  .title-screen .sea-pick { flex: none; padding: 3px; }
  .title-screen .sea-pick .btn { min-height: 0; padding: 2px 12px 3px; }
  .title-screen .sea-pick .btn b { font-size: 12.5px; }
  .title-screen .sea-pick .btn small { font-size: 9.5px; }
  .title-screen.multi .foot-note { position: static; margin-top: -2px; font-size: 11px; }
}
/* ═════════ Interface mobile (classe posée par Main.resize) ═════════ */
button, .prompt, .objectives { touch-action: manipulation; }
.mobile .btn { min-height: 40px; }
.mobile .btn.xs { min-height: 34px; }
.mobile .panel-head .x { width: 40px; height: 40px; }

/* curseurs plus faciles à attraper au doigt */
.mobile input[type=range] { -webkit-appearance: none; appearance: none; height: 30px; background: transparent; }
.mobile input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: rgba(243, 235, 218, 0.18); }
.mobile input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #8be3c1, #33a07b); border: 2px solid rgba(243, 235, 218, 0.85); box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4); }
.mobile input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(243, 235, 218, 0.18); }
.mobile input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #56c7a0; border: 2px solid rgba(243, 235, 218, 0.85); }

/* HUD : une seule barre de verre compacte */
.mobile .hud { padding: calc(8px + env(safe-area-inset-top, 0px)) 8px 0; flex-wrap: nowrap; gap: 0; }
.mobile .hud .it { height: 34px; padding: 0 6px; gap: 4px; font-size: 13px; border-radius: 0; border: none; box-shadow: none; background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
.mobile .hud .it .ico { width: 16px; height: 16px; vertical-align: -3px; }
.mobile .hud .it.date { font-size: 13.5px; padding-left: 10px; }
.mobile .hud .it:last-child { padding-right: 10px; }
.mobile .hud .it { flex: none; }
.mobile .hud .it .bar { width: 30px; }
.mobile .hud { padding-left: calc(8px + env(safe-area-inset-left, 0px)); padding-right: calc(8px + env(safe-area-inset-right, 0px)); }
.mobile .hud-bar {
  display: flex; align-items: center; min-width: 0; overflow: hidden;
  background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
}
.mobile .hud .it + .it { border-left: 1px solid var(--line); }
.mobile .hud .menu-btn { width: 38px; height: 38px; min-height: 0; padding: 0; border-radius: 50%; margin-left: 6px; flex: none; }
.mobile .hud .menu-btn span { display: none; }
.mobile .hud .it.hide-sm, .mobile .hud .hide-sm { display: none; }
@media (max-width: 370px) { .mobile .hud .it { padding: 0 5px; font-size: 12.5px; } .mobile .hud .it .bar { width: 24px; } }

/* objectif en cours : bandeau discret sous le HUD */
.mobile .objectives { left: 8px; right: auto; top: calc(50px + env(safe-area-inset-top, 0px)); max-width: calc(100vw - 16px); padding: 7px 11px; font-size: 12.5px; border-radius: 12px; }
.mobile .objectives h4 { font-size: 9.5px; margin-bottom: 3px; }
.mobile .objectives.min h4 { display: none; }
.mobile .objectives.min { border-radius: 999px; padding: 6px 12px 6px 10px; }
.mobile .objectives.min .o.cur::after { content: '▾'; margin-left: 4px; color: var(--text-3); }

/* notifications : en haut, plus compactes */
.mobile .toasts { top: calc(88px + env(safe-area-inset-top, 0px)); width: calc(100vw - 16px); }
.mobile .toast { font-size: 13px; padding: 8px 12px; border-radius: 11px; }
.mobile .banner { top: 24%; }
.mobile .banner .b-in { padding: 16px 20px 14px; }

/* barre du port : grille de raccourcis icône + libellé, façon barre d'onglets */
.mobile .portbar {
  left: 8px; right: 8px; transform: none; width: auto; max-width: none;
  bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: repeat(auto-fit, minmax(62px, 1fr)); gap: 2px; padding: 6px; border-radius: 20px;
}
.mobile .portbar .btn { flex-direction: column; gap: 3px; padding: 7px 2px 6px; min-height: 54px; font-size: 11.5px; font-weight: 700; white-space: normal; text-align: center; line-height: 1.1; border-radius: 13px; color: var(--text-2); }
.mobile .portbar .btn .ico { width: 24px; height: 24px; vertical-align: 0; }
.mobile .portbar .btn kbd { display: none; }
.mobile .portbar .btn.go { color: var(--jade-ink); box-shadow: 0 4px 14px rgba(63, 174, 138, 0.35); }
.mobile .prompt { font-size: 14px; }

/* panneaux : tiroirs qui montent du bas */
.mobile.portrait .overlay { align-items: flex-end; padding: calc(40px + env(safe-area-inset-top, 0px)) 0 0; }
.mobile.portrait .panel, .mobile.portrait .panel.wide, .mobile.portrait .panel.narrow {
  width: 100%; max-height: 100%; border-radius: 22px 22px 0 0; border-bottom: none;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: sheetIn 0.32s cubic-bezier(.2, 1, .3, 1);
  transition: transform 0.18s ease-out;

<script>
'use strict';
// ─── Mers de Jade · noyau : maths, hasard, bruit, formats, stockage, entrées ───

const TAU = Math.PI * 2;

const U = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  smooth: t => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t)),
  angNorm(a) { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; },
  angDiff: (from, to) => U.angNorm(to - from),
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  approach: (v, t, r) => (v < t ? Math.min(t, v + r) : Math.max(t, v - r)),
  easeOut: t => 1 - Math.pow(1 - t, 3),
  easeInOut: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  easeOutBack(t) { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  sum(arr, f) { let s = 0; for (const x of arr) s += f ? f(x) : x; return s; },
};

// ── Hasard reproductible (mulberry32) ──
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class RNG {
  constructor(seed) { this.f = mulberry32(seed >>> 0); }
  next() { return this.f(); }
  range(a, b) { return a + (b - a) * this.f(); }
  int(a, b) { return a + Math.floor((b - a + 1) * this.f()); }
  pick(arr) { return arr[Math.floor(this.f() * arr.length)]; }
  chance(p) { return this.f() < p; }
  gauss() { let u = 0, v = 0; while (u === 0) u = this.f(); while (v === 0) v = this.f(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }
  shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(this.f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

}

const R = new RNG((Date.now() ^ (Math.random() * 1e9)) >>> 0);

function strHash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function hash32(n) {
  n = Math.imul(n ^ (n >>> 16), 0x7feb352d);
  n = Math.imul(n ^ (n >>> 15), 0x846ca68b);
  return (n ^ (n >>> 16)) >>> 0;
}

function hash2(x, y, s) {

}

function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);

  pointer: { x: 0, y: 0, down: false, clicked: false, button: 0, type: 'mouse' },
  layout: null,
  touch: false,
  blocked: false, // vrai quand un panneau modal capte le clavier

  init(target) {
    addEventListener('keydown', e => {
      const tg = e.target;
      if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT')) return;
      if (!this.keys[e.code]) this.hits[e.code] = true;
      this.keys[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
      Bus.emit('key', e);
    });
    addEventListener('keyup', e => { this.keys[e.code] = false; });
    addEventListener('blur', () => { this.keys = Object.create(null); this.virt = Object.create(null); });
    target.addEventListener('pointerdown', e => {
      this.pointer.down = true; this.pointer.clicked = true; this.pointer.button = e.button;
      this.pointer.type = e.pointerType; this.pointer.x = e.clientX; this.pointer.y = e.clientY;

    target.addEventListener('pointermove', e => { this.pointer.x = e.clientX; this.pointer.y = e.clientY; this.pointer.type = e.pointerType; });

    this.touch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

      if (navigator.keyboard && navigator.keyboard.getLayoutMap) {
        navigator.keyboard.getLayoutMap().then(m => { this.layout = m; Bus.emit('layout'); }).catch(() => {});
      }
    } catch (e) { /* pas d'API clavier */ }
  },
  down(action) {
    if (this.blocked) return false;
    const codes = ACTIONS[action];
    if (codes) for (const c of codes) if (this.keys[c]) return true;
    return !!this.virt[action];
  },
  hit(action) {
    if (this.blocked) return false;
    const codes = ACTIONS[action];
    if (codes) for (const c of codes) if (this.hits[c]) return true;
    return !!this.virtHits[action];
  },
  hitCode(code) { return !this.blocked && !!this.hits[code]; },
  press(action) { this.virt[action] = true; this.virtHits[action] = true; },
  release(action) { this.virt[action] = false; },
  endFrame() {
    this.hits = Object.create(null);
    this.virtHits = Object.create(null);
    this.pointer.clicked = false;
  },
  label(code) {
    if (this.layout) { const k = this.layout.get(code); if (k) return k.toUpperCase(); }
    return code.replace('Key', '').replace('Digit', '');
  },
  isAzerty() { return this.layout ? this.layout.get('KeyQ') === 'a' : /^fr\b/i.test(navigator.language || ''); },
};

// Chaque mer (js/seas/<id>.js) décrit son monde, son économie, ses navires, ses pirates, son
// calendrier, son héritage, ses cultures et ses textes. Seas.use(id) recâble ici les tables
// que lit tout le moteur (GOODS, PORTS, SHIPS…) : le reste du code ne change pas de mer à mer.

function monnaie(n) { return fmt(n) + ' ' + TXT.money; }        // « 1 500 taels »
function capFirst(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  { id: 'creme', name: 'Toile crème', cost: 0, sail: '#efe2c0', trim: '#2fb67c' },
  { id: 'jade', name: 'Jade', cost: 10, sail: '#8fdcb4', trim: '#1d7f58' },

  list() { return SEA_ORDER.filter(id => SEA_DEFS[id]); },
  // recâble les tables du moteur sur la mer demandée ; vrai si la mer a changé
  use(id) {

    return true;
  },
};

    this.hullPath(x, M, L, B, 1, 1); x.fillStyle = hullD; x.fill();
    this.hullPath(x, M, L, B, 0.985, 0.93); x.fillStyle = sc.hull; x.fill();
    // pont bombé : plus clair au centre
    this.hullPath(x, M, L, B, 0.93, 0.76);
    x.fillStyle = Gfx.lin(x, 0, -B / 2, 0, B / 2, [[0, deckD], [0.5, deckL], [1, deckD]]);
    x.fill();
    x.save(); x.clip();
    x.strokeStyle = rgba('#3a2414', 0.16); x.lineWidth = 0.22;
    for (let v = -B * 0.42; v <= B * 0.42; v += Math.max(0.9, B * 0.11)) { x.beginPath(); x.moveTo(-L * 0.5, v); x.lineTo(L * 0.5, v); x.stroke(); }
    x.restore();
    this.hullPath(x, M, L, B, 0.93, 0.76);
    x.strokeStyle = rgba(shade(sc.hull, 1.5), 0.55); x.lineWidth = Math.max(0.3, L * 0.012); x.stroke();
    // écoutille
    Gfx.rr(x, L * 0.0, -B * 0.13, L * 0.13, B * 0.26, B * 0.04);
    x.fillStyle = deckD; x.fill(); x.strokeStyle = rgba('#2a1a10', 0.35); x.lineWidth = 0.25; x.stroke();
    // sabords
    if (M.gunports) {
      x.fillStyle = '#1a1210';
      for (let i = -3; i <= 3; i++) for (const s of [-1, 1]) x.fillRect(i * L * 0.11 - 0.5, s * B * 0.46 - 0.35, 1, 0.7);
    }
    // château arrière
    if (M.cabin) {
      const [c0, c1] = M.cabin, wv = B * 0.34, roof = sc.roof || M.roof || sc.hull;
      const xa = c0 * L * 0.93, xb = c1 * L;
      Gfx.rr(x, xa, -wv, xb - xa, wv * 2, Math.min(1.2, wv * 0.3));
      x.fillStyle = Gfx.lin(x, 0, -wv, 0, wv, [[0, shade(roof, 1.3)], [0.45, roof], [1, shade(roof, 0.72)]]);
      x.fill();
      x.strokeStyle = rgba(shade(roof, 0.5), 0.6); x.lineWidth = 0.3; x.stroke();
      x.strokeStyle = rgba(shade(roof, 1.6), 0.7); x.lineWidth = 0.35;
      x.beginPath(); x.moveTo(xa + 0.6, 0); x.lineTo(xb - 0.6, 0); x.stroke();
    }
    if (M.canopy) {
      const [c0, c1] = M.canopy, wv = B * 0.38;
      Gfx.rr(x, c0 * L, -wv, (c1 - c0) * L, wv * 2, wv * 0.5);
      x.fillStyle = Gfx.lin(x, 0, -wv, 0, wv, [[0, '#d6b77e'], [0.5, '#c29f64'], [1, '#8f7244']]);
      x.fill();
      x.strokeStyle = rgba('#6e5430', 0.6); x.lineWidth = 0.3;
      for (let i = 1; i < 5; i++) { const u = (c0 + (c1 - c0) * i / 5) * L; x.beginPath(); x.moveTo(u, -wv * 0.92); x.quadraticCurveTo(u + 0.5, 0, u, wv * 0.92); x.stroke(); }
    }
    // mâts
    for (const m of M.masts) {
      const r = Math.max(0.55, L * 0.026);
      x.fillStyle = PAL.woodD; x.beginPath(); x.arc(m.u * L, 0, r, 0, TAU); x.fill();
      x.fillStyle = rgba('#e8c49a', 0.5); x.beginPath(); x.arc(m.u * L - r * 0.3, -r * 0.3, r * 0.4, 0, TAU); x.fill();
    }
    return { c, ox, oy, w, h };
  },
  // voile en croissant (repère local : u vers la proue, v en travers)
  band(x, du, span, bul, th, swp) {
    const N = 12;
    x.beginPath();
    for (let i = 0; i <= N; i++) { const q = 2 * i / N - 1; const u = du + bul * (1 - q * q) - swp * q * q + th / 2; if (i) x.lineTo(u, q * span / 2); else x.moveTo(u, q * span / 2); }
    for (let i = N; i >= 0; i--) { const q = 2 * i / N - 1; x.lineTo(du + bul * 0.2 * (1 - q * q) - swp * q * q - th / 2, q * span / 2); }
    x.closePath();
  },
  // s : { style, len, scheme, x, y, a } ; o : { furled, sailOv, sheet, t, windA, flash, white }
  draw(ctx, s, o) {
    o = o || {};
    const M = SHIP_MODELS[s.style] || SHIP_MODELS.junk, L = s.len, B = L * M.beam;
    const S = (typeof Main !== 'undefined' && Main.S) || 3;
    const k = Gfx.k();
    const sc = shipColors(s.scheme, o.sailOv);
    const body = this.body(s.style, L, s.scheme, o.sailOv, k);
    const t = o.t || 0;
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.a);
    if (o.scale) ctx.scale(o.scale, o.scale);
    if (M.oars) this.oars(ctx, L, B, M.oars, o.row);
    // coque et son ombre portée (décalage en pixels écran : lumière fixe)
    if (!o.noShadow) {
      ctx.shadowColor = 'rgba(4,16,30,0.38)'; ctx.shadowBlur = 4 * S; ctx.shadowOffsetX = 1.4 * S; ctx.shadowOffsetY = 2.2 * S;
    }
    ctx.drawImage(body.c, -body.ox, -body.oy, body.w, body.h);
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
    if (o.flash > 0) {
      ctx.globalCompositeOperation = 'lighter'; const ga = ctx.globalAlpha; ctx.globalAlpha = ga * Math.min(1, o.flash * 4);
      ctx.drawImage(body.c, -body.ox, -body.oy, body.w, body.h);
      ctx.globalAlpha = ga; ctx.globalCompositeOperation = 'source-over';
    }
    // voiles
    const junk = M.rig === 'junk', furled = !!o.furled;
    const sheet = furled ? 0 : (o.sheet || 0);
    const sailC = sc.sail, sailS = shade(sc.sail, 0.78), sailL = shade(sc.sail, 1.1);
    for (const m of M.masts) {
      const w = junk ? L * (0.3 + m.h * 0.5) : m.w * L * 1.05;
      const th = furled ? 1.1 : Math.max(2.4, L * (junk ? 0.13 : 0.115));
      const bul = furled ? 0.25 : B * 0.32;
      const swp = junk && !furled ? B * 0.22 : 0;
      ctx.save();
      ctx.translate(m.u * L, 0); ctx.rotate(sheet * (junk ? 0.85 : 1));
      if (!o.noShadow) { ctx.shadowColor = 'rgba(4,16,30,0.26)'; ctx.shadowBlur = 5 * S; ctx.shadowOffsetX = 2.6 * S; ctx.shadowOffsetY = 3.8 * S; }
      this.band(ctx, 0, w, bul, th, swp);
      ctx.fillStyle = Gfx.lin(ctx, -th / 2, 0, bul + th / 2, 0, [[0, sailS], [0.55, sailC], [1, sailL]]);
      ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
      if (!furled) {
        // liseré de lumière sur le bord gonflé
        ctx.strokeStyle = rgba(shade(sc.sail, 1.25), 0.8); ctx.lineWidth = Math.max(0.25, L * 0.01);
        ctx.beginPath();
        for (let i = 1; i < 12; i++) { const q = 2 * i / 12 - 1; const u = bul * (1 - q * q) - swp * q * q + th / 2 - 0.2; if (i > 1) ctx.lineTo(u, q * w / 2 * 0.96); else ctx.moveTo(u, q * w / 2 * 0.96); }
        ctx.stroke();
      }
      if (!furled && !junk) {
        this.band(ctx, 1.2, w * 0.74, bul * 0.9, th * 0.7, 0);
        ctx.fillStyle = Gfx.lin(ctx, 1.2 - th / 2, 0, 1.2 + bul + th / 2, 0, [[0, sailC], [1, shade(sc.sail, 1.16)]]);
        ctx.fill();
      }
      if (junk && !furled) {
        ctx.strokeStyle = rgba(shade(sc.sail, 0.5), 0.45); ctx.lineWidth = Math.max(0.2, L * 0.008);
        for (const f of [-0.22, 0.2]) {
          ctx.beginPath();
          for (let i = 0; i <= 10; i++) { const q = i / 5 - 1; const u = bul * (0.55 + f * 0.9) * (1 - q * q) - swp * q * q; if (i) ctx.lineTo(u, q * w * 0.47); else ctx.moveTo(u, q * w * 0.47); }
          ctx.stroke();
        }
      }
      // vergue
      ctx.strokeStyle = PAL.woodD; ctx.lineWidth = Math.max(0.35, L * 0.018);
      ctx.beginPath();
      for (let i = 0; i <= 10; i++) { const q = i / 5 - 1; const u = bul * 0.2 * (1 - q * q) - swp * q * q - th / 2; if (i) ctx.lineTo(u, q * w * 0.5); else ctx.moveTo(u, q * w * 0.5); }
      ctx.stroke();
      ctx.restore();
    }
    if (M.rig === 'square' && !furled) {
      const fm = M.masts[0];
      ctx.beginPath(); ctx.moveTo(L * (0.5 + M.bowsprit) - 1, 0); ctx.lineTo(fm.u * L + 3, -B * 0.06); ctx.lineTo(fm.u * L + 3, B * 0.22); ctx.closePath();
      ctx.fillStyle = sailL; ctx.fill();
    }
    // pavillons qui flottent sous le vent
    const fa = (o.windA != null ? o.windA : s.a + Math.PI) - s.a;
    const top = M.masts.reduce((a, b) => (b.h > a.h ? b : a), M.masts[0]);
    this.pennant(ctx, top.u * L, 0, fa, L * 0.17, Math.max(0.5, L * 0.03), sc.trim, t);
    if (o.white) this.flag(ctx, -L * 0.5, 0, fa, L * 0.12, '#ffffff', t);
    else this.flag(ctx, -L * 0.5, 0, fa, L * 0.1, sc.trim, t);
    ctx.restore();
  },
  // avirons des galères, sous la coque : ils battent quand on rame (row = temps), sinon au repos
  oars(x, L, B, n, row) {
    x.strokeStyle = '#3a2618'; x.lineWidth = Math.max(0.35, L * 0.018); x.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const u = -L * 0.3 + i * L * 0.62 / (n - 1);
      const sw = row != null ? Math.sin(row * 5.5 - i * 0.35) * L * 0.07 : -L * 0.04;
      for (const sd of [-1, 1]) { x.beginPath(); x.moveTo(u, sd * B * 0.4); x.lineTo(u + sw, sd * (B * 0.5 + L * 0.2)); x.stroke(); }
    }
  },
  pennant(x, px, py, a, len, wid, color, t) {
    x.save(); x.translate(px, py); x.rotate(a);
    x.beginPath(); x.moveTo(0, -wid);
    const n = 6;
    for (let i = 1; i <= n; i++) { const u = len * i / n; x.lineTo(u, -wid * (1 - i / n) + Math.sin(t * 9 - i * 1.2) * len * 0.05 * i / n); }
    for (let i = n; i >= 0; i--) { const u = len * i / n; x.lineTo(u, wid * (1 - i / n) + Math.sin(t * 9 - i * 1.2) * len * 0.05 * i / n); }
    x.closePath(); x.fillStyle = color; x.fill();
    x.restore();
  },
  flag(x, px, py, a, len, color, t) {
    x.save(); x.translate(px, py); x.rotate(a);
    const h = len * 0.62, n = 5;
    x.beginPath(); x.moveTo(0, -h / 2);
    for (let i = 1; i <= n; i++) x.lineTo(len * i / n, -h / 2 + Math.sin(t * 7 - i) * len * 0.07 * i / n);
    for (let i = n; i >= 0; i--) x.lineTo(len * i / n, h / 2 + Math.sin(t * 7 - i) * len * 0.07 * i / n);
    x.closePath(); x.fillStyle = color; x.fill();
    x.strokeStyle = rgba('#000000', 0.25); x.lineWidth = 0.2; x.stroke();
    x.restore();
  },
};

// ════════════════════════════════════════════════════════════════════
//  Navires vus de profil (port, titre, chantier, abordage) — proue à droite
// ════════════════════════════════════════════════════════════════════
const ShipSide = {
  cache: new Map(),
  get(style, L, schemeName, sailOverride, k) {
    k = k || Gfx.k();
    const key = style + '|' + L + '|' + schemeName + '|' + (sailOverride ? sailOverride.sail + sailOverride.trim : '') + '|' + k;
    let r = this.cache.get(key);
    if (!r) { if (this.cache.size > 60) this.cache.clear(); r = this.render(style, L, schemeName, sailOverride, k); this.cache.set(key, r); }
    return r;
  },
  render(style, L, schemeName, sailOverride, k) {
    const M = SHIP_MODELS[style] || SHIP_MODELS.junk;
    const sc = shipColors(schemeName, sailOverride);
    if (SHIP_SIDES[style]) return this.custom(SHIP_SIDES[style], L, sc, k);
    const junk = M.hull === 'junk';
    const W = Math.ceil(L * 1.5) + 20, H = Math.ceil(L * 1.25) + 16;
    const [cv, x] = makeLayer(W, H, k);
    x.lineCap = 'round'; x.lineJoin = 'round';
    const wl = H - 8, x0 = (W - L) / 2, u = L / 80;   // u : épaisseur de trait de référence
    const deckAt = t => (junk ? L * (0.1 + 0.16 * Math.pow(1 - U.clamp(t, 0, 1), 2.2) + 0.05 * t * t) : L * (0.1 + 0.06 * Math.pow(1 - U.clamp(t, 0, 1), 3) + 0.03 * t * t));
    const keelAt = t => L * 0.1 * Math.sin(Math.PI * U.clamp(t * 1.05, 0, 1));
    const X = t => x0 + t * L, Y = t => wl - deckAt(t);
    const masts = M.masts.slice().sort((a, b) => a.u - b.u);
    const mastGeo = m => { const t = 0.5 + m.u; return { mx: X(t), deck: Y(t), mh: m.h * L * 1.05, m }; };
    const geos = masts.map(mastGeo);
    const sailC = sc.sail, sailS = shade(sc.sail, 0.8), sailL = shade(sc.sail, 1.1);
    const bowX = X(1) + (M.bowsprit || 0.12) * L * 1.6, bowY = Y(1) - L * 0.12;
    // gréement (derrière les voiles)
    x.strokeStyle = rgba('#2a1d16', 0.55); x.lineWidth = Math.max(0.2, u * 0.35);
    for (const g of geos) {
      const topY = g.deck - g.mh;
      if (!junk) {
        for (const d of [-0.07, 0.07]) { x.beginPath(); x.moveTo(g.mx, topY + 2); x.lineTo(X(0.5 + g.m.u + d), Y(0.5 + g.m.u + d) + 1); x.stroke(); }
        x.beginPath(); x.moveTo(g.mx, topY + 1); x.lineTo(bowX, bowY); x.stroke();
      } else {
        x.beginPath(); x.moveTo(g.mx, topY + 1); x.lineTo(X(0.5 + g.m.u + 0.12), Y(0.5 + g.m.u + 0.12)); x.stroke();
      }
    }
    // mâts
    for (const g of geos) {
      const bw = Math.max(0.9, u * 1.6), tw = bw * 0.55;
      x.beginPath(); x.moveTo(g.mx - bw / 2, g.deck + 2); x.lineTo(g.mx - tw / 2, g.deck - g.mh); x.lineTo(g.mx + tw / 2, g.deck - g.mh); x.lineTo(g.mx + bw / 2, g.deck + 2); x.closePath();
      x.fillStyle = Gfx.lin(x, g.mx - bw / 2, 0, g.mx + bw / 2, 0, [[0, '#6e4a30'], [0.4, '#a0744c'], [1, '#4a3020']]);
      x.fill();
    }
    // voiles
    for (const g of geos) {
      const { mx, deck, mh, m } = g;
      if (M.rig === 'junk') {
        const sw = m.w * L * 1.25;
        const fore = mx + sw * 0.2, aft = mx - sw * 0.8;
        const bot = deck - 3 * u - 1, topF = deck - mh * 0.9, topA = deck - mh * 1.02;
        const path = () => {
          x.beginPath();
          x.moveTo(fore, bot);
          x.lineTo(fore + 0.6, topF + 1.5);
          x.quadraticCurveTo(mx, topF - 4 * u, aft - 1, topA + 1);          // vergue relevée vers l'arrière
          x.quadraticCurveTo(aft - sw * 0.12, (topA + bot) * 0.5, aft, bot); // chute arrondie en éventail
          x.closePath();
        };
        path();
        x.fillStyle = Gfx.lin(x, fore, 0, aft, 0, [[0, sailL], [0.55, sailC], [1, sailS]]);
        x.fill();
        // panneaux légèrement gonflés entre les lattes
        x.save(); path(); x.clip();
        const nb = 6;
        for (let j = 0; j < nb; j++) {
          const y0 = bot + (topF - bot) * j / nb, y1 = bot + (topF - bot) * (j + 1) / nb;
          const g2 = x.createLinearGradient(0, y0, 0, y1);
          g2.addColorStop(0, rgba('#000000', 0.1)); g2.addColorStop(0.5, rgba('#ffffff', 0.06)); g2.addColorStop(1, rgba('#000000', 0.02));
          x.fillStyle = g2; x.fillRect(aft - sw * 0.2, Math.min(y0, y1) - 3, sw * 1.5, Math.abs(y1 - y0) + 6);
        }
        x.restore();
        x.strokeStyle = rgba(shade(sc.sail, 0.45), 0.8); x.lineWidth = Math.max(0.3, u * 0.55);
        for (let j = 1; j < nb; j++) {
          const yy = bot + (topF - bot) * j / nb, dy = (topA - topF) * j / nb;
          x.beginPath(); x.moveTo(fore + 0.3, yy); x.quadraticCurveTo(mx - sw * 0.3, yy + dy * 0.5 + 1.2 * u, aft - sw * 0.1 * Math.sin(Math.PI * j / nb), yy + dy); x.stroke();
        }
        x.strokeStyle = PAL.woodD; x.lineWidth = Math.max(0.5, u * 0.9);
        x.beginPath(); x.moveTo(fore + 0.6, topF + 1.5); x.quadraticCurveTo(mx, topF - 4 * u, aft - 1, topA + 1); x.stroke();
        x.beginPath(); x.moveTo(fore, bot); x.lineTo(aft, bot); x.stroke();
        // écoutes
        x.strokeStyle = rgba('#2a1d16', 0.5); x.lineWidth = Math.max(0.2, u * 0.3);
        for (let j = 1; j < 4; j++) { const ly = bot + (topA - bot) * j / 4; x.beginPath(); x.moveTo(aft - sw * 0.1, ly); x.lineTo(Math.max(x0 + 2, aft - 10 * u), deck - 1); x.stroke(); }
      } else {
        const sw = m.w * L * 0.95;
        const tiers = [[0.22, 0.47, 1], [0.5, 0.72, 0.84], [0.74, 0.92, 0.66]];
        for (const [a, b, wk] of tiers) {
          const y0 = deck - mh * b, y1 = deck - mh * a;
          const hw = sw * wk / 2, hb = hw * 1.06, bil = (y1 - y0) * 0.16;
          x.beginPath();
          x.moveTo(mx - hw, y0); x.lineTo(mx + hw, y0);
          x.lineTo(mx + hb, y1); x.quadraticCurveTo(mx, y1 + bil, mx - hb, y1);
          x.closePath();
          x.fillStyle = Gfx.lin(x, mx - hb, 0, mx + hb, 0, [[0, sailS], [0.5, sailL], [1, sailS]]);
          x.fill();
          x.strokeStyle = rgba(shade(sc.sail, 0.55), 0.35); x.lineWidth = Math.max(0.2, u * 0.3);
          x.beginPath(); x.moveTo(mx - hw * 0.98, y0 + (y1 - y0) * 0.3); x.lineTo(mx + hw * 0.98, y0 + (y1 - y0) * 0.3); x.stroke();
          x.strokeStyle = PAL.woodD; x.lineWidth = Math.max(0.5, u * 0.9);
          x.beginPath(); x.moveTo(mx - hw - 1, y0); x.lineTo(mx + hw + 1, y0); x.stroke();
        }
      }
      // flamme en tête de mât
      x.fillStyle = sc.trim;
      x.beginPath(); x.moveTo(mx, deck - mh - 1); x.quadraticCurveTo(mx - 4 * u, deck - mh - 0.2, mx - 9 * u, deck - mh + 1.2); x.quadraticCurveTo(mx - 4 * u, deck - mh + 1.4, mx, deck - mh + 2.4); x.closePath(); x.fill();
    }
    if (M.rig === 'square') {
      const g = geos[geos.length - 1];
      x.beginPath(); x.moveTo(g.mx + 1.5, g.deck - g.mh * 0.86); x.quadraticCurveTo((g.mx + bowX) / 2 + 2, (g.deck + bowY) / 2 - 4 * u, bowX - 1, bowY); x.lineTo(g.mx + 2.5, g.deck - 3); x.closePath();
      x.fillStyle = Gfx.lin(x, g.mx, 0, bowX, 0, [[0, sailC], [1, sailS]]); x.fill();
    }
    // coque
    const hullPath = () => {
      x.beginPath();
      x.moveTo(X(-0.01), Y(0) - (junk ? 1 : 0));
      for (let i = 1; i <= 40; i++) x.lineTo(X(i / 40), Y(i / 40));
      if (junk) x.quadraticCurveTo(X(1) + 2.5 * u, wl - L * 0.03, X(0.9), wl + keelAt(0.9) * 0.8);
      else x.bezierCurveTo(X(1) + L * 0.035, wl - L * 0.02, X(1) - L * 0.01, wl + L * 0.05, X(0.9), wl + keelAt(0.9) * 0.8);
      for (let i = 36; i >= 0; i--) x.lineTo(X(i / 40), wl + keelAt(i / 40) * 0.8);
      x.lineTo(X(-0.02), Y(0) * 0.35 + wl * 0.65);
      x.closePath();
    };
    const topY = Y(0) - 2, botY = wl + L * 0.1;
    // gouvernail
    x.fillStyle = shade(sc.hull, 0.6);
    x.beginPath(); x.moveTo(X(0) + 1, Y(0) + 4 * u); x.lineTo(X(0) - 3 * u, Y(0) + 5 * u); x.lineTo(X(0) - 4 * u, wl + L * 0.07); x.lineTo(X(0) + 2, wl + L * 0.05); x.closePath(); x.fill();
    hullPath();
    x.fillStyle = Gfx.lin(x, 0, topY, 0, botY, [[0, shade(sc.hull, 1.25)], [0.35, sc.hull], [1, shade(sc.hull, 0.58)]]);
    x.fill();
    x.save(); hullPath(); x.clip();
    // œuvres vives (blanchies à la chaux sur les jonques, cuivrées sinon)
    x.fillStyle = junk ? rgba('#e2dccb', 0.85) : rgba('#b8703e', 0.85);
    x.fillRect(0, wl + 0.8, W, H);
    // bordages
    x.strokeStyle = rgba(shade(sc.hull, 0.55), 0.45); x.lineWidth = Math.max(0.2, u * 0.3);
    for (let off = 3.5 * u + 2; off < L * 0.2; off += 2.2 * u + 0.8) {
      x.beginPath(); for (let i = 0; i <= 30; i++) { const t = i / 30; if (i) x.lineTo(X(t), Y(t) + off); else x.moveTo(X(t), Y(t) + off); } x.stroke();
    }
    // préceinte colorée qui suit la tonture
    const band = (off, wdt, col) => {

  make(o) { return Object.assign({ w: o.carry === 'pole' ? 22 : 12, h: o.big ? 23 : 21 }, o); },
  // phase : 0..4 (cycle de marche), moving : marche ou non ; pieds en (x, y)
  draw(ctx, o, x, y, dir, phase, moving, alpha) {

    const swing = moving ? Math.sin(p) : 0;
    const bob = moving ? Math.abs(Math.cos(p)) * 0.7 : 0;
    const sc = o.big ? 1.08 : 1;
    const skin = o.skin || PAL.skin[1];

    ctx.save();
    ctx.translate(x, y);

    // ombre au sol

    ctx.scale(dir * sc, sc);
    ctx.translate(0, -bob);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const hipY = -8, shY = -14.6, headY = -17.8;
    const leg = (ang, col) => {
      ctx.strokeStyle = col; ctx.lineWidth = 2.1;
      const kx = Math.sin(ang) * 4, ky = hipY + Math.cos(ang) * 4;

      if (o.coat) { ctx.beginPath(); ctx.moveTo(-2.6, hipY); ctx.lineTo(2.8, hipY); ctx.lineTo(3.1, hipY + 3.4); ctx.lineTo(-2.9, hipY + 3.4); ctx.closePath(); ctx.fillStyle = shade(top, 0.9); ctx.fill(); ctx.fillStyle = PAL.gold; for (const by of [-13, -11, -9]) { ctx.beginPath(); ctx.arc(1.9, by, 0.42, 0, TAU); ctx.fill(); } }

        ctx.fillStyle = '#1d1a26';
        ctx.beginPath(); ctx.moveTo(-3.8, headY - 1.2); ctx.quadraticCurveTo(0.3, headY - 6.4, 4.8, headY - 1.2); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = PAL.gold; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(-3.8, headY - 1.3); ctx.lineTo(4.8, headY - 1.3); ctx.stroke();
        ctx.fillStyle = PAL.gold; ctx.beginPath(); ctx.arc(0.6, headY - 3, 0.55, 0, TAU); ctx.fill(); break;
      case 'straw':
        ctx.fillStyle = '#e3c77a'; Gfx.rr(ctx, -2.3, headY - 4.2, 5.2, 2.6, 0.8); ctx.fill();
        Gfx.ellipse(ctx, 0.3, headY - 1.7, 4.8, 0.8); ctx.fill();
        ctx.fillStyle = PAL.red; ctx.fillRect(-2.3, headY - 2.6, 5.2, 0.8); break;
      case 'turban': {
        const tc = o.turban || '#f2efe6';
        ctx.fillStyle = tc; Gfx.ellipse(ctx, 0.2, headY - 2, 3.1, 2.2); ctx.fill();
        ctx.strokeStyle = shade(tc, 0.78); ctx.lineWidth = 0.35; ctx.beginPath(); ctx.moveTo(-2.6, headY - 1.4); ctx.quadraticCurveTo(0.2, headY - 3.8, 3, headY - 2.2); ctx.stroke(); break;
      }
      case 'sailor':
        ctx.fillStyle = '#f2efe6'; Gfx.rr(ctx, -2.5, headY - 4, 5.6, 2.8, 1); ctx.fill();
        ctx.fillStyle = '#2a4a8a'; ctx.fillRect(-2.5, headY - 2, 5.6, 0.8); break;
      case 'bun':
        ctx.beginPath(); ctx.arc(0.3, headY - 0.5, 2.8, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
        ctx.beginPath(); ctx.arc(-1.4, headY - 3, 1.5, 0, TAU); ctx.fill();
        ctx.fillStyle = o.pin || PAL.gold; ctx.fillRect(-3.4, headY - 3.3, 3.8, 0.45); break;
      default:
        ctx.beginPath(); ctx.arc(0.3, headY - 0.4, 2.8, Math.PI * 0.9, Math.PI * 2.02); ctx.fill();
    }
    if (o.xhat) this.xhat(ctx, o, headY);
    ctx.restore();
  },
  // coiffes des extensions, par-dessus la tête (planches de design/extensions)
  xhat(c, o, hy) {
    switch (o.xhat) {
      case 'tricorne':
        c.fillStyle = '#1d1a22'; c.beginPath(); c.moveTo(-5.4, hy - 1.2); c.lineTo(-3.6, hy - 5.4); c.quadraticCurveTo(0.3, hy - 3.8, 4.3, hy - 5.4); c.lineTo(6, hy - 1.2); c.quadraticCurveTo(0.3, hy - 2.8, -5.4, hy - 1.2); c.fill();
        c.strokeStyle = PAL.gold; c.lineWidth = 0.4; c.stroke();
        if (o.plume) { c.fillStyle = o.plume; c.beginPath(); c.ellipse(-2.4, hy - 6, 3.2, 1, -0.5, 0, TAU); c.fill(); }
        break;
      case 'bandana':
        c.fillStyle = o.band || '#c8342b'; c.beginPath(); c.arc(0.3, hy - 0.5, 2.95, Math.PI * 0.95, Math.PI * 2.05); c.fill();
        c.beginPath(); c.moveTo(-2.4, hy - 0.8); c.lineTo(-4.8, hy + 1.8); c.lineTo(-3.4, hy + 2.2); c.closePath(); c.fill(); break;
      case 'beret':
        c.fillStyle = o.band || '#8e1f1d'; c.beginPath(); c.ellipse(0.8, hy - 2.4, 3.6, 1.9, 0.12, 0, TAU); c.fill(); break;
      case 'fur':
        c.fillStyle = '#4a3222'; Gfx.rr(c, -2.4, hy - 5.4, 5.6, 3.6, 1); c.fill();
        c.fillStyle = '#9a7a56'; Gfx.rr(c, -3, hy - 2.6, 6.8, 1.8, 0.8); c.fill(); break;
      case 'kofia':
        c.fillStyle = '#f4ead4'; Gfx.rr(c, -2.3, hy - 4.6, 5.2, 2.8, 0.6); c.fill();
        c.fillStyle = '#b8322a'; for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(-1.4 + i * 1.3, hy - 3.2, 0.3, 0, TAU); c.fill(); } break;
      case 'flower':
        for (const [fx, fy, col] of [[2.2, hy - 2.4, '#ff8ab0'], [1.2, hy - 3.2, '#fff4d8']]) { c.fillStyle = col; for (let k = 0; k < 5; k++) { const a = k * TAU / 5; c.beginPath(); c.arc(fx + Math.cos(a) * 0.7, fy + Math.sin(a) * 0.7, 0.55, 0, TAU); c.fill(); } } break;
      case 'pilos':
        c.fillStyle = o.band || '#7b2a4f'; c.beginPath(); c.moveTo(-2.7, hy - 1.2); c.quadraticCurveTo(0.4, hy - 9, 3.4, hy - 1.2); c.closePath(); c.fill(); break;
      case 'veil':
        c.fillStyle = o.band || '#e8e2d6'; c.beginPath(); c.arc(0.2, hy - 0.2, 3.1, Math.PI * 0.8, Math.PI * 2.1); c.lineTo(3, hy + 2); c.quadraticCurveTo(-1, hy + 6, -3.6, hy + 7); c.closePath(); c.fill(); break;
    }
  },
};

//  Particules (points doux, écume, étincelles)
// ════════════════════════════════════════════════════════════════════
class Particles {
  constructor(max) { this.max = max || 1600; this.list = []; }
  add(p) {
    if (this.list.length >= this.max) this.list.shift();
    p.t = 0; p.z = p.z || 0; p.vz = p.vz || 0; p.size = p.size || 1;
    p.drag = p.drag === undefined ? 0 : p.drag;
    this.list.push(p);
    return p;
  }
  update(dt) {
    const L = this.list;
    let w = 0;
    for (let i = 0; i < L.length; i++) {
      const p = L[i];
      p.t += dt;
      if (p.t >= p.life) continue;
      if (p.drag) { const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.grav) { p.vz -= p.grav * dt; p.z += p.vz * dt; if (p.z < 0 && p.floor !== false) { p.z = 0; p.t = p.life; continue; } }
      else if (p.vz) p.z += p.vz * dt;
      if (p.grow) p.size += p.grow * dt;
      L[w++] = p;
    }
    L.length = w;
  }
  // soft : fumée et écume en points doux ; glow : étincelles additives ; sinon petits disques nets
  draw(ctx, camX, camY, filter) {
    const ga = ctx.globalAlpha;
    for (const p of this.list) {
      if (filter && p.layer !== filter) continue;
      const k = p.t / p.life;
      let a = p.fade === false ? 1 : 1 - k;
      if (p.fadeIn) a *= Math.min(1, p.t / p.fadeIn);
      if (a <= 0.02) continue;
      const col = p.colors ? p.colors[Math.min(p.colors.length - 1, Math.floor(k * p.colors.length))] : p.color;
      const x = p.x - camX, y = p.y - camY - p.z;
      ctx.globalAlpha = ga * Math.min(1, a * (p.alpha || 1));
      if (p.soft) {
        const r = p.size * 0.9;
        ctx.drawImage(Gfx.soft(col), x - r, y - r, r * 2, r * 2);
      } else if (p.glow) {
        const r = p.size * 1.6;
        ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(Gfx.soft(col, 1), x - r, y - r, r * 2, r * 2);
        ctx.globalCompositeOperation = 'source-over';
      } else if (p.streak) {
        ctx.strokeStyle = col; ctx.lineWidth = p.size * 0.35; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - p.vx * p.streak, y - p.vy * p.streak); ctx.stroke();
      } else {
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(x, y, Math.max(0.3, p.size * 0.42), 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = ga;
  }
}

const NOTE_IDX = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(s) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(s);
  if (!m) return 0;
  let n = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3], 10) - 4) * 12;
  return 440 * Math.pow(2, n / 12);
}
function parseTrack(ch) {
  const ev = [];
  let pos = 0;
  if (ch.w === 'drum') {
    for (const c of ch.n.replace(/\s|\|/g, '')) { if (c !== '.') ev.push({ at: pos, d: c }); pos++; }
    return { ev, len: pos };
  }
  for (const tok of ch.n.split(/\s+/)) {
    if (!tok || tok === '|') continue;
    const [nt, du] = tok.split(':');
    const len = parseInt(du, 10) || 1;
    if (nt !== 'r') ev.push({ at: pos, f: noteFreq(nt), len });
    pos += len;
  }
  return { ev, len: pos };
}

const Sound = {

  init() {

    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    this.music.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(wet); wet.connect(this.master);

    const len = c.sampleRate * 2;
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);

  pulse(duty) {

    for (let n = 1; n < N; n++) {

      im[n] = (2 / (n * Math.PI)) * (1 - Math.cos(2 * Math.PI * n * duty));

  play(name) {

    if (!def.loop && this.song && this.song.loop) this.resume = this.songName;

  tone(t, type, f0, f1, dur, vol, dest, pw) {

  drum(k, t, v) {

      case 'tick': this.tone(t, 'square', 1200, 1200, 0.018, 0.035, dest); break;
      case 'error': this.tone(t, 'square', 220, 150, 0.16, 0.08, dest); break;
      case 'bell':

        break;
      case 'gong': this.gongAt(t, 0.7, dest); break;
      case 'thunder':

      case 'shout':
        this.noise(t, 0.5, 'bandpass', 700, 3, 0.25, dest, 500);
        break;
      case 'creak': this.tone(t, 'sawtooth', 110, 80, 0.4, 0.03, dest); break;

  // ── Ambiances en boucle ──
  ambient(name, vol) {
