// ════════════ Écran titre (planche A) : Venise à l'aube, la lagune, la galère du joueur ════════════
const titleScene = {
  layout(W, H, S) {
    this.hz = H * 0.645;
    const hz = this.hz, sx = W / 800, sy = H / 450;
    const [kc, kx] = makeLayer(W, H, S);
    // l'aube : bleu de Prusse en haut (le titre s'y détache), or pâle à l'horizon
    kx.fillStyle = Gfx.lin(kx, 0, 0, 0, hz, [[0, '#1d3264'], [0.42, '#3d5588'], [0.72, '#a99a98'], [0.9, '#e8c89a'], [1, '#f6dea4']]); kx.fillRect(0, 0, W, hz + 1);
    this.sunX = 420 * sx;
    Gfx.glow(kx, this.sunX, hz - 6 * sy, 120 * sy, '#ffecbe', 0.8);
    kx.fillStyle = '#fff4d8'; kx.beginPath(); kx.arc(this.sunX, hz - 4 * sy, 16 * sy, Math.PI, 0); kx.fill();
    // Venise en silhouette : maisons, campanile, coupoles de Saint-Marc, palais des Doges
    const sil = 'rgba(150,108,84,0.88)', rng = new RNG(5);
    kx.fillStyle = sil;
    for (let x = 0; x < W; x += (18 + rng.range(0, 16)) * sx) kx.fillRect(x, hz - (16 + rng.range(0, 28)) * sy, (22 + rng.range(0, 16)) * sx, 60 * sy);
    kx.fillRect(248 * sx, hz - 150 * sy, 22 * sx, 150 * sy);
    kx.beginPath(); kx.moveTo(244 * sx, hz - 150 * sy); kx.lineTo(259 * sx, hz - 186 * sy); kx.lineTo(274 * sx, hz - 150 * sy); kx.fill();
    kx.fillRect(252 * sx, hz - 162 * sy, 14 * sx, 12 * sy);
    for (const [dx, rr, lift] of [[330, 22, 0], [362, 28, 0], [398, 22, 0], [362, 16, 24]]) { kx.beginPath(); kx.ellipse(dx * sx, hz - (52 + lift) * sy, rr * sx, rr * sy, 0, Math.PI, 0); kx.fill(); }
    kx.fillRect(310 * sx, hz - 52 * sy, 110 * sx, 52 * sy); kx.fillRect(450 * sx, hz - 58 * sy, 190 * sx, 58 * sy);
    kx.fillStyle = 'rgba(246,222,164,0.55)';
    for (let i = 0; i < 12; i++) { const ax = (458 + i * 15.5) * sx; kx.beginPath(); kx.moveTo(ax, hz - 6 * sy); kx.lineTo(ax, hz - 20 * sy); kx.ellipse(ax + 5 * sx, hz - 20 * sy, 5 * sx, 5 * sy, 0, Math.PI, 0); kx.lineTo(ax + 10 * sx, hz - 6 * sy); kx.fill(); }
    kx.fillStyle = Gfx.lin(kx, 0, hz - 40 * sy, 0, hz + 1, [[0, 'rgba(246,222,164,0)'], [1, 'rgba(246,226,176,0.85)']]); kx.fillRect(0, hz - 40 * sy, W, 41 * sy);
    this.sky = kc;
    const [sc, sxx] = makeLayer(W, H - hz, S);
    sxx.fillStyle = Gfx.lin(sxx, 0, 0, 0, H - hz, [[0, '#ecd4a0'], [0.3, '#8a9cb8'], [1, '#2e4a72']]); sxx.fillRect(0, 0, W, H - hz);
    this.sea = sc;
  },
  draw(ctx, W, H) {
    const hz = this.hz, t = this.t;
    ctx.drawImage(this.sky, 0, 0, W, H);
    ctx.drawImage(this.sea, 0, hz, W, H - hz);
    // le chemin du soleil qui scintille sur la lagune
    ctx.lineCap = 'round';
    for (let i = 0; i < 46; i++) {
      const y = hz + 2 + hash2(i, 1, 4) * (H - hz) * 0.7, k = (y - hz) / (H - hz), w = 3 + hash2(i, 2, 4) * 12 * (1 - k), a = Math.sin(t * 2.5 + i * 1.7);
      if (a < -0.2) continue;
      ctx.strokeStyle = `rgba(255,243,208,${(0.35 + 0.45 * a).toFixed(3)})`; ctx.lineWidth = 0.8 + (1 - k) * 0.6;
      const cx = this.sunX + (hash2(i, 3, 4) - 0.5) * 50 * (1 + (y - hz) / 30);
      ctx.beginPath(); ctx.moveTo(cx - w / 2, y); ctx.lineTo(cx + w / 2, y); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,236,200,0.28)'; ctx.lineWidth = 0.5; ctx.beginPath();
    for (let i = 0; i < 56; i++) { const y = hz + 4 + hash2(i, 9, 1) * (H - hz - 6), x = (hash2(i, 8, 1) * (W + 60) + t * (8 + (y - hz) * 0.3)) % (W + 60) - 30; ctx.moveTo(x, y); ctx.lineTo(x + 3 + (i % 4), y); }
    ctx.stroke();
    // la galère du joueur et son reflet
    const side = ShipSide.get('galley', 110, Game.meta ? Game.playerScheme() : 'med_player', Game.meta ? Game.sailScheme() : null, Math.min(Main.S, 5));
    const bx = W * (W > H ? 0.56 : 0.3) + Math.sin(t * 0.25) * 10, by = H * 0.9 + Math.sin(t * 1.3) * 1.5;
    ctx.save(); ctx.beginPath(); ctx.rect(0, by + 1, W, H - by); ctx.clip();
    ctx.globalAlpha = 0.22; ctx.translate(0, by * 2 + 2); ctx.scale(1, -1);
    ctx.drawImage(side.c, bx - side.x0, by - side.wl, side.W, side.H); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, by + 1.2); ctx.clip();
    ctx.drawImage(side.c, bx - side.x0, by - side.wl, side.W, side.H); ctx.restore();
    // les bricole, pieux d'amarrage de la lagune
    ctx.strokeStyle = '#2a2230'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    for (const [px, hh] of [[0.12, 42], [0.15, 36], [0.88, 40]]) { ctx.beginPath(); ctx.moveTo(px * W, H); ctx.lineTo(px * W + 2, H - hh); ctx.stroke(); }
    ctx.strokeStyle = '#2a1a2a'; ctx.lineWidth = 0.6; ctx.lineJoin = 'round';
    for (const p of this.fx.list) { const wing = Math.sin(t * 7 + p.ph) * 1.6; ctx.beginPath(); ctx.moveTo(p.x - 3, p.y - wing); ctx.quadraticCurveTo(p.x - 1.5, p.y - 0.8, p.x, p.y); ctx.quadraticCurveTo(p.x + 1.5, p.y - 0.8, p.x + 3, p.y - wing); ctx.stroke(); }
  },
};

    barbary: { wall: ['#f4f0e6', '#ece6d8', '#f8f4ea', '#e6dfcf'], wood: '#2f6a5a', pillar: '#f8f4ea', roof: '#ece6d8', roofL: '#f8f4ea', roofType: 'crenel', trim: '#2f6a5a', lantern: '#e0b040', door: '#2f6a5a', win: 'slit', awning: ['#2f7a4a', '#f4f0e6'], skyline: 'flat' },
  },
  towns: {
    venetian: { roofs: ['#b8543a', '#c2552e', '#d8744a'], walls: ['#e6c38f', '#d9a77e', '#e8d2a8', '#c98a6a'] },
    genoese: { roofs: ['#b8543a', '#6d6f78', '#c2552e'], walls: ['#e8c89a', '#d9a878', '#f0d8b0'] },
    provencal: { roofs: ['#c2552e', '#d27040', '#b8543a'], walls: ['#ecd9b4', '#f2e6cc'] },
    catalan: { roofs: ['#c2552e', '#b8543a', '#d27040'], walls: ['#e8d2a8', '#d9b98a'] },
    dalmatian: { roofs: ['#d06a3a', '#c2552e'], walls: ['#ece4d4', '#e0d6c2'] },
    candiote: { roofs: ['#b8543a', '#d8744a'], walls: ['#efe2c8', '#e6d2aa'] },
    mamluk: { roofs: ['#f7f2e8', '#fbf8f1', '#c9a36a'], walls: ['#fbf8f1', '#efe6d4'] },
    ottoman: { roofs: ['#b8543a', '#8a8a86', '#c2552e'], walls: ['#efe6d6', '#d9c8ae'] },
    barbary: { roofs: ['#fdfbf6', '#f4f0e6', '#e6e0d2'], walls: ['#fdfbf6', '#f0ebe0'] },
  },
  people(P) {
    const it = [
      { xhat: 'beret', band: '#8e1f1d', robe: true, top: '#2a3a6a', skin: PAL.skin[0] },
      { hat: 'bun', robe: true, top: '#b8322a', skin: PAL.skin[0], carry: 'parasol', parasol: '#f3e4c4' },
      { xhat: 'beret', band: '#2a2a33', top: '#5a3a22', bottom: '#8e1f1d', skin: PAL.skin[1], carry: 'box' },
      { xhat: 'veil', band: '#2a3a6a', robe: true, top: '#e8d2a8', skin: PAL.skin[0] },
      { hat: 'cap', top: '#6b4a2a', bottom: '#3a3a44', skin: PAL.skin[1] },
      { xhat: 'beret', band: '#1d1a22', robe: true, top: '#1d1a22', skin: PAL.skin[0] },
      { hat: 'sailor', top: '#2a4a8a', bottom: '#e8e2d2', skin: PAL.skin[1] },
    ];
    const west = [
      { xhat: 'beret', band: '#3b5a7a', top: '#6b4a2a', bottom: '#3a3a44', skin: PAL.skin[1], carry: 'box' },
      { hat: 'straw', top: '#f2efe6', bottom: '#4a3a2a', skin: PAL.skin[1] },
      { xhat: 'veil', band: '#f3e4c4', robe: true, top: '#8e3a2a', skin: PAL.skin[0] },
      { hat: 'sailor', top: '#e8e2d2', bottom: '#3a4a6a', skin: PAL.skin[0] },
    ];
    const east = [
      { hat: 'turban', turban: '#f2efe6', robe: true, top: '#2f6a3a', skin: PAL.skin[2] },
      { hat: 'turban', turban: '#c8342b', robe: true, top: '#6a3a8a', skin: PAL.skin[2] },
      { xhat: 'veil', band: '#1d1a22', robe: true, top: '#2a2a33', skin: PAL.skin[2] },
      { hat: 'turban', turban: '#e8e2d6', top: '#e8c86a', bottom: '#2f5a3a', skin: PAL.skin[3], carry: 'pole', load: '#b8612e' },
      { top: '#e8e2d2', bottom: '#6b4a2a', skin: PAL.skin[2], carry: 'box' },
    ];
    switch (P.culture) {
      case 'provencal': case 'catalan': return west.concat([it[0], it[4], it[6]]);
      case 'mamluk': case 'ottoman': case 'barbary': return east.concat([it[5], it[6]]);
    }
    return it.concat([east[0]]);
  },
  // le capitaine en patricien vénitien, la barque du port menée par un batelier en béret
  captain: robe => People.make({ xhat: 'beret', band: '#1d1a22', robe: true, top: robe, big: true, sash: '#d8a940', skin: PAL.skin[0] }),
  portScene: { farBoats: 'lateen', boatman: { xhat: 'beret', band: '#2a2a33', top: '#2a2a33', bottom: '#2a2a33', skin: PAL.skin[1] } },
  facades,
  icons,
  rules,
});
})();

</script>
<script>
'use strict';
// ─── Mers de Jade · démarrage, boucle principale, scènes ───

const Main = {
  cv: null, ctx: null,
  S: 3, W: 480, H: 270, dpr: 1,
  sceneName: null, scene: null,
  fade: 1, fadeDir: -1, fadeCb: null, last: 0,

  boot(data) {
    this.cv = document.getElementById('screen');
    this.ctx = this.cv.getContext('2d');
    Input.init(this.cv);
    Game.loadGlobal();
    // la mer d'une partie reprise à chaud, sinon la dernière choisie (si elle est débloquée)
    const want = (data && data.run && data.sea) || Game.global.sea;
    Seas.use(SEA_DEFS[want] && Unlocks.owned(want) ? want : 'chine');
    Game.loadMeta();
    Icons.build();
    UI.init();
    World.init();
    SeaGL.init(document.getElementById('gl'));
    this.resize();
    addEventListener('resize', () => this.resize());
    Bus.on('audio-unlock', () => Sound.unlock());
    Bus.on('audio-ready', () => {
      if (this.sceneName === 'port') { Sound.ambient('sea', 0.05); if (PortScene.weather === 'rain') Sound.ambient('rain', 0.22); }
      else if (this.sceneName === 'sea') Sound.ambient('sea', 0.16);
    });
    Bus.on('key', e => this.onKey(e));
    Bus.on('dock', pid => this.arrive(pid));
    Bus.on('board', t => { if (!UI.isOpen()) UI.boarding(t); });
    Bus.on('player-sunk', () => this.onSunk());
    Bus.on('captured', c => this.onCaptured(c));
    Bus.on('year-over', () => this.endRun('end'));
    addEventListener('pointerdown', () => Sound.unlock(), { capture: true });
    document.addEventListener('visibilitychange', () => { if (document.hidden && Game.run && this.sceneName === 'port') Game.saveRun(); });
    PortScene.onEnter = type => UI.building(type);
    const ld = document.getElementById('loading');
    if (ld) { ld.classList.add('done'); setTimeout(() => ld.remove(), 600); }
    if (data && data.run && !data.run.over) { Game.run = data.run; this.continueRun(true); }
    else this.toTitle(true);
    this.frame();
    // si requestAnimationFrame est suspendu (vue intégrée masquée), un minuteur prend le relais
    setInterval(() => { if (performance.now() - (this.lastReal || 0) > 200) this.frame(); }, 33);
  },
  onKey(e) {
    Sound.unlock();
    const wasOpen = UI.isOpen();
    UI.onKey(e);
    const inGame = this.sceneName === 'port' || this.sceneName === 'sea';
    if (!inGame || wasOpen || this.fadeDir) return;
    if (e.code === 'Escape' || e.code === 'KeyP') UI.pauseMenu();
    else if ((e.code === 'KeyM' || e.code === 'Tab') && this.sceneName === 'sea') UI.chart(false);
    else if (e.code === 'KeyJ') UI.journal();
  },
  // Rendu HD : la scène garde son repère logique (~270 unités sur le petit côté), dessiné à la résolution réelle de l'écran
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const w = Math.max(320, Math.round(innerWidth * dpr)), hgt = Math.max(240, Math.round(innerHeight * dpr));
    this.dpr = dpr;
    this.cv.width = w; this.cv.height = hgt;
    const S = Math.min(w, hgt) / 270;
    this.S = S; this.W = w / S; this.H = hgt / S;
    SeaGL.resize(w, hgt);
    PortScene.W = 0; TitleScene.W = 0;
    // interface mobile : téléphone tactile (ou fenêtre étroite), en portrait ou en paysage
    const mobile = (Input.touch && Math.min(innerWidth, innerHeight) < 600) || innerWidth < 520;
    document.body.classList.toggle('mobile', mobile);
    document.body.classList.toggle('portrait', mobile && innerHeight > innerWidth);
    document.body.classList.toggle('landscape', mobile && innerHeight <= innerWidth);
  },
  bufPoint(cx, cy) { return { x: cx * this.dpr / this.S, y: cy * this.dpr / this.S }; },

  // ── transitions en fondu ──
  transition(fn) {
    if (this.fadeDir === 1) { const prev = this.fadeCb; this.fadeCb = () => { prev && prev(); fn(); }; return; }
    this.fadeDir = 1; this.fadeCb = fn;
  },

  // ── Changer de mer (écran titre) : tables, monde, shader, progression et décor de la mer choisie ──
  setSea(id) {
    if (!SEA_DEFS[id] || id === Seas.current) return;
    if (!Unlocks.owned(id)) { UI.toast('Cette mer n\'est pas encore débloquée.', 'bad'); return; }
    Seas.use(id);
    Icons.build();
    Game.global.sea = id; Game.saveGlobal();
    Game.run = null; Game.loadMeta();
    World.init();
    if (SeaGL.gl) { try { SeaGL.build(); } catch (e) { console.warn('WebGL :', e.message); SeaGL.ok = false; } }
    PortScene.W = 0; TitleScene.W = 0;
    ShipTop.cache.clear(); ShipSide.cache.clear();
    UI.title();
  },

  // ── Scènes ──
  toTitle(instant) {
    const go = () => {
      this.sceneName = 'title'; this.scene = TitleScene; TitleScene.enter();
      UI.closeAll(); UI.title();
      Sound.ambientOff(); Sound.play('title');
    };
    if (instant) go(); else this.transition(go);
  },
  startRun(o) {
    Game.newRun(o);
    Game.saveRun();
    this.transition(() => {
      this.enterPort(SEA.start.port);
      setTimeout(() => {
        if (!Game.meta.tutorialDone && Game.meta.runs === 0) UI.toast(Input.touch ? 'Suivez l\'objectif en haut de l\'écran. Touchez un bâtiment ou un raccourci en bas pour y aller.' : 'Suivez les objectifs en haut à gauche. Touchez un bâtiment ou utilisez les chiffres 1 à 9.', '');
        UI.toast(TXT.startToast, 'gold', 'scroll');
      }, 900);
    });
  },
  continueRun(instant) {
    const r = Game.run || Game.loadRun();
    if (!r) { this.toTitle(); return; }
    const pid = r.port || r.lastPort || SEA.start.port;
    r.port = pid;
    const go = () => { UI.hideTitle(); this.enterPort(pid); };
    if (instant) go(); else this.transition(go);
  },
  enterPort(pid) {
    UI.hideTitle(); UI.closeAll();
    this.sceneName = 'port'; this.scene = PortScene;
    PortScene.enter(pid);
    UI.showHud('port');
    Sound.play('port');
    Sound.ambient('sea', 0.05);
    Sound.ambient('rain', PortScene.weather === 'rain' ? 0.22 : 0);
    Sound.ambient('wind', 0);
    Game.saveRun();
    if (SEA.rules && SEA.rules.onEnterPort) SEA.rules.onEnterPort(pid);   // (une captivité en cours…)
  },
  setSail(dest) {
    Game.depart(dest);
    this.transition(() => {
      this.sceneName = 'sea'; this.scene = SeaScene;
      SeaScene.enter(dest);
      UI.showHud('sea');
      if (Input.touch && this.H > this.W * 1.2 && !this.rotateHint) { this.rotateHint = true; UI.toast('Astuce : tournez votre téléphone en paysage pour mieux voir la mer.', ''); }
    });
  },
  arrive(pid) {
    this.transition(() => {
      const evs = Game.arrive(pid);
      this.enterPort(pid);
      const r = Game.run, cargo = U.sum(r.cargo);
      UI.banner(PORT[pid].name, fmtDate(r.day) + (cargo ? ` · ${cargo} ${TXT.unit} à vendre` : ''), '', PORT[pid].zh);
      setTimeout(() => UI.arrivalEvents(evs), 450);
    });
  },
  onSunk() {
    const r = Game.run;
    if (Game.sinkingRescue()) {
      const p = SeaScene.player;
      let best = World.ports[0], bd = 1e9;
      for (const q of World.ports) { const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd) { bd = d; best = q; } }
      this.transition(() => {
        r.port = best.id; r.lastPort = best.id;
        this.enterPort(best.id);
        UI.banner('Sauvé des eaux', TXT.rescue, 'jade');
      });
    } else this.endRun('naufrage');
  },
  // capturé en mer (corsaires) : emmené au port de la mer, où celle-ci règle la rançon (via onEnterPort)
  onCaptured(c) {
    this.transition(() => {
      const r = Game.run;
      r.port = c.port; r.lastPort = c.port;
      this.enterPort(c.port);
    });
  },
  endRun(reason) {
    if (!Game.run || Game.run.over) return;
    const res = Game.endRun(reason);
    if (!res) return;
    this.transition(() => {
      this.sceneName = 'title'; this.scene = TitleScene; TitleScene.enter();
      Sound.ambientOff();
      Sound.play('title');
      Sound.play(reason === 'naufrage' ? 'defeat' : 'fanfare');
      UI.endScreen(res);
    });
  },

  // ── Boucle ──
  frame(forcedDt) {
    const ts = performance.now();
    const dt = forcedDt !== undefined ? forcedDt : Math.min(0.05, Math.max(0, (ts - (this.last || ts)) / 1000));
    this.last = ts; this.lastReal = ts;
    try {
      const paused = this.sceneName === 'sea' && UI.isOpen();
      if (this.scene && !paused) this.scene.update(dt);
      if (this.sceneName === 'port' && !this.fadeDir && !UI.isOpen() && Game.isYearOver() && !Game.run.over) this.endRun('end');
      if (this.fadeDir === 1) {
        this.fade = Math.min(1, this.fade + dt * 3.2);
        if (this.fade >= 1) { const cb = this.fadeCb; this.fadeCb = null; this.fadeDir = -1; if (cb) cb(); }
      } else if (this.fadeDir === -1) {
        this.fade = Math.max(0, this.fade - dt * 2.6);
        if (this.fade <= 0) this.fadeDir = 0;
      }
      SeaGL.show(this.sceneName === 'sea');
      const ctx = this.ctx, S = this.S, cw = this.cv.width, ch = this.cv.height;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, cw, ch);
      ctx.setTransform(S, 0, 0, S, 0, 0);
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      if (this.scene) this.scene.draw(ctx, this.W, this.H);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      if (this.scene && this.scene.overlay && this.fade < 0.6) this.scene.overlay(ctx, S);
      if (this.fade > 0) { ctx.fillStyle = `rgba(8,13,22,${U.easeInOut(this.fade).toFixed(3)})`; ctx.fillRect(0, 0, cw, ch); }
      UI.frame(dt);
    } catch (err) {
      console.error(err);
      if (!this.errShown) { this.errShown = true; UI.toast('Erreur : ' + err.message, 'bad'); }
    }
    Input.endFrame();
    if (forcedDt !== undefined) return;
    if (!this.rafPending) { this.rafPending = true; requestAnimationFrame(() => { this.rafPending = false; this.frame(); }); }
  },
  // pour les tests : avancer de n images à pas fixe
  step(n, dt) { for (let i = 0; i < (n || 1); i++) this.frame(dt || 1 / 30); },
};

// Démarrage (avec reprise à chaud si la page est republiée pendant une partie)
(function start() {
  const hot = window.claude && window.claude.hot;
  const run = data => {
    try { Main.boot(data || {}); } catch (e) { console.error(e); const l = document.getElementById('loading'); if (l) l.textContent = 'Erreur de démarrage : ' + e.message; }
  };
  try {
    if (hot && hot.snapshot) hot.snapshot(() => ({ run: Game.run && !Game.run.over ? Game.run : null, sea: Seas.current }));
  } catch (e) { /* facultatif */ }
  const go = () => {
    if (hot && hot.ready) hot.ready(run);
    else run((hot && hot.data) || {});
  };
  let fontsReady = Promise.resolve();
  try {
    if (document.fonts) {
      const want = [`800 32px "Shippori Mincho B1"`, `700 16px "Shippori Mincho B1"`, `600 16px "Manrope"`, `800 16px "Manrope"`].map(f => document.fonts.load(f, 'Mers de Jade 0123 ' + Object.values(SEA_DEFS).map(d => d.ports.map(p => p.zh || '').join('') + (d.text.supremeSeal || '')).join('') + '翡翠大班'));
      fontsReady = Promise.race([Promise.all(want), new Promise(r => setTimeout(r, 1800))]);
    }
  } catch (e) { /* polices facultatives */ }
  fontsReady.then(go, go);
})();

</script>
